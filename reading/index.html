
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ePeak Reading Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D3B6F;--purple:#470074;--ink:#1A1A2E;--sky:#4A90D9;--bg:#F7F8FC;--border:rgba(13,59,111,.13);--green:#1a7a4a;--red:#c0392b;--gold:#8a6800}
*{box-sizing:border-box}
body{margin:0;font-family:Outfit,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
button{font-family:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:28px}
.hero{background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;border-radius:18px;padding:28px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.hero h1{font-family:"Cormorant Garamond",serif;font-size:2rem;line-height:1;margin:0 0 8px}
.hero p{margin:0;opacity:.72;font-size:.92rem;max-width:640px}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 11px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.14);white-space:nowrap}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.test-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:18px;text-align:left;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;min-height:180px;display:flex;flex-direction:column}
.test-card:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(13,59,111,.09);border-color:rgba(13,59,111,.24)}
.test-card.locked{opacity:.72}
.test-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.test-num{font-family:"Cormorant Garamond",serif;color:var(--navy);font-size:1.35rem;font-weight:700}
.access{font-size:.68rem;font-weight:700;text-transform:uppercase;border-radius:999px;padding:4px 9px;background:rgba(74,144,217,.12);color:var(--sky);white-space:nowrap}
.access.public{background:rgba(26,122,74,.1);color:var(--green)}
.access.premium{background:rgba(201,168,76,.16);color:var(--gold)}
.access.locked{background:rgba(0,0,0,.06);color:#777}
.test-title{font-weight:700;color:var(--navy);font-size:1rem;margin-bottom:6px}
.test-desc{font-size:.84rem;color:#666;margin:0 0 14px;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:#999;font-size:.74rem}
.btn{border:0;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;font-size:.9rem;font-weight:700;padding:12px 18px;cursor:pointer}
.btn.secondary{background:#fff;color:var(--navy);border:1.5px solid var(--border)}
.btn.ghost{background:transparent;color:var(--navy);border:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.screen{display:none}.screen.active{display:block}
.reader-shell{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:22px;align-items:start}
.panel{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:22px}
.passage-kicker{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700;margin-bottom:6px}
.passage-title{font-family:"Cormorant Garamond",serif;color:var(--navy);font-size:1.55rem;font-weight:700;margin:0 0 12px}
.passage-text{font-size:1rem;color:#263044;text-align:justify}
.progress-line{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;color:#777;font-size:.82rem}
.bar{height:8px;background:rgba(13,59,111,.08);border-radius:999px;overflow:hidden;flex:1}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--navy));border-radius:999px}
.question{padding:16px 0;border-top:1px solid var(--border)}
.question:first-child{border-top:0;padding-top:0}
.q-text{font-weight:700;color:var(--navy);margin-bottom:10px}
.option{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--border);background:#fff;border-radius:9px;margin:8px 0;cursor:pointer;color:#263044}
.option:hover{background:#f8fafc}.option.selected{border-color:var(--navy);background:rgba(13,59,111,.07)}
.letter{font-weight:700;color:var(--navy);min-width:20px}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.score-card{text-align:center;background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.score-big{font-family:"Cormorant Garamond",serif;color:var(--navy);font-size:3rem;font-weight:700;line-height:1}
.feedback-list{display:grid;gap:14px}
.feedback-card{background:#fff;border:1.5px solid var(--border);border-left-width:6px;border-radius:12px;padding:16px}
.feedback-card.correct{border-left-color:var(--green)}.feedback-card.wrong{border-left-color:var(--red)}
.feedback-title{font-weight:700;color:var(--navy);margin-bottom:8px}
.feedback-meta{font-size:.84rem;color:#555;margin-bottom:8px}
.why{font-size:.88rem;color:#555;background:#f8fafc;border-radius:9px;padding:10px;margin-top:8px}
.saved{color:var(--green);font-size:.86rem;font-weight:700;margin-top:10px}
.nav-warning{display:none;margin-top:14px;padding:10px 12px;border-radius:10px;background:#fff7ed;border:1px solid rgba(201,168,76,.28);color:#8a4b00;font-size:.86rem;font-weight:700}
@media(max-width:860px){.wrap{padding:16px}.hero{display:block}.reader-shell{grid-template-columns:1fr}.panel{padding:18px}.hero h1{font-size:1.7rem}}
</style>
</head>
<body>
<div class="wrap">
  <section id="menu-screen" class="screen active">
    <div class="hero">
      <div>
        <h1>📖 Reading Practice</h1>
        <p>Business, science, pop culture, and biography readings with challenging multiple-choice questions and full answer explanations.</p>
      </div>
      <span class="pill" id="access-summary">Loading access</span>
    </div>
    <div id="menu-grid" class="menu-grid"></div>
  </section>

  <section id="test-screen" class="screen">
    <div class="progress-line">
      <button class="btn secondary" onclick="backToMenu()">Back to tests</button>
      <div class="bar" aria-hidden="true"><span id="progress-bar" style="width:33%"></span></div>
      <strong id="progress-text">Passage 1 of 3</strong>
    </div>
    <div class="reader-shell">
      <article class="panel">
        <div class="passage-kicker" id="passage-kicker">Test 1</div>
        <h2 class="passage-title" id="passage-title"></h2>
        <div class="passage-text" id="passage-text"></div>
      </article>
      <aside class="panel">
        <div id="questions"></div>
        <div class="nav-warning" id="nav-warning" role="status" aria-live="polite"></div>
        <div class="actions">
          <button class="btn secondary" id="prev-btn" onclick="prevPassage()">Previous</button>
          <button class="btn" id="next-btn" onclick="nextPassage()">Next passage</button>
        </div>
      </aside>
    </div>
  </section>

  <section id="results-screen" class="screen">
    <div class="score-card">
      <div class="passage-kicker" id="result-test-name">Reading Test</div>
      <div class="score-big" id="score-big">0/12</div>
      <p id="score-note">Review the explanations below.</p>
      <div class="saved" id="saved-msg"></div>
      <div class="actions" style="justify-content:center">
        <button class="btn" onclick="backToMenu()">Back to reading tests</button>
      </div>
    </div>
    <div id="feedback-list" class="feedback-list"></div>
  </section>
</div>

<script>
var READING_TESTS = [
  {
    id: "reading1",

      {

          {

          {
            q: "The phrase 'disciplined surrender to evidence' suggests that the founders",

            "changed direction only after carefully studying user signals.",

            "gave up because the product had no future."
          ],
            answer: 0,

          },
          {
            q: "Why did revenue grow after the pivot?",

            answer: 3,

          {
            q: "Which lesson best follows from the passage?",
            options: [
            "Founders should never build project-management tools.",
            "A minor feature may expose a major market need.",
            "Users usually know the full strategy a company should follow.",
            "Interviews matter less than the first product plan."
          ],
            answer: 1,
            why: "The chat feature was minor at first, but it revealed the product's strongest direction."
          }
        ]
      },
      {
        title: "A Battery With a Second Life",
        text: "Electric-vehicle batteries are often judged by how long they can power a car, but that is only their first career. Once a battery can no longer deliver the intense bursts of energy required for driving, it may still store electricity reliably for buildings. Some energy companies now collect retired vehicle batteries and arrange them into stationary packs that absorb solar power during the day and release it after sunset. This approach does not eliminate the need for recycling, because batteries eventually degrade beyond practical use. However, it can delay disposal, reduce demand for newly mined materials, and make renewable energy easier to manage when sunlight and consumption do not occur at the same time.",
        questions: [

            "Recycling companies refuse to process electric-vehicle batteries.",
            "Solar panels cannot work without old car batteries."

            why: "The passage says old batteries may fail at intense driving demands but still store energy reliably for buildings."
          },
          {
            q: "What does the passage imply about recycling?",

            "Recycling makes batteries unsuitable for buildings.",
            "Second-life use replaces recycling completely.",
            "Recycling is only useful for solar panels.",
            "Recycling remains necessary, but it can be postponed."
          ],
            answer: 3,
            why: "It explicitly says second-life use does not eliminate recycling but can delay disposal."
          },
          {
            q: "What problem with renewable energy does second-life storage address?",
            options: [
            "Solar power is produced and needed at different times.",
            "Wind turbines damage electric vehicles.",
            "Buildings cannot connect to the electrical grid.",
            "Mining materials prevents panels from producing electricity."
          ],
            answer: 0,
            why: "The batteries store daytime solar energy and release it after sunset, when demand may continue."
          },
          {
            q: "The author's tone toward second-life batteries is best described as",
            options: [
            "angry and suspicious.",
            "uncritically celebratory.",
            "cautiously supportive.",
            "openly dismissive."
          ],
            answer: 2,
            why: "The author presents benefits while noting limits, especially eventual degradation and recycling needs."
          }
        ]
      },
      {
        title: "Streaming and the Shape of Attention",
        text: "A decade ago, television executives worried mainly about ratings at a scheduled hour. Streaming platforms changed the question. They can measure where viewers pause, abandon an episode, replay a scene, or continue into the next installment. This data has influenced how some shows are edited: early conflicts appear sooner, recaps become sharper, and episode endings are designed to reduce hesitation. Critics argue that such decisions may flatten storytelling by rewarding constant stimulation. Supporters respond that audience data does not write scripts; it simply reveals when attention weakens. The deeper issue is not whether data should exist, but how much creative authority it should be allowed to gain.",
        questions: [
          {
            q: "What is the central tension in the passage?",
            options: [
            "Whether streaming platforms can measure audience behavior accurately.",
            "Whether scheduled television has better actors than streaming shows.",
            "Whether recaps should be removed from all modern shows.",
            "Whether viewer data should influence creative decisions and to what degree."
          ],
            answer: 3,
            why: "The final sentence frames the main issue as the amount of creative authority data should have."
          },
          {
            q: "Why might episode endings be designed differently on streaming platforms?",

            "To avoid collecting audience data."

            answer: 1,
            why: "The passage states endings are designed to reduce hesitation before the next installment."
          },
          {
            q: "Which concern do critics raise?",
            options: [
            "Shows now have fewer conflicts than before.",
            "Audience data prevents any editing changes.",
            "Data may encourage storytelling that relies too much on constant stimulation.",
            "Streaming platforms cannot detect when viewers pause."
          ],
            answer: 2,
            why: "Critics worry that rewarding constant stimulation may flatten storytelling."
          },
          {
            q: "Supporters of audience data would most likely agree that",
            options: [
            "data can identify weak attention points without creating the story itself.",
            "all creative authority should belong to algorithms.",
            "data replaces writers entirely.",
            "scheduled ratings are more detailed than streaming metrics."
          ],
            answer: 0,
            why: "Supporters say data does not write scripts; it reveals when attention weakens."
          }
        ]
      }
    ]
  },
  {
    id: "reading2",
    title: "People Behind Big Leaps",
    theme: "Biography and innovation",
    passages: [
      {
        title: "Steve Jobs and the Discipline of Saying No",
        text: "Steve Jobs is often remembered for dramatic product launches, but one of his quieter strengths was subtraction. After returning to Apple in 1997, he pushed the company to reduce a confusing range of products into a smaller matrix. The decision disappointed teams whose projects were canceled, yet it clarified Apple's identity and concentrated engineering talent. Jobs did not treat simplicity as decoration; he treated it as strategy. A simple product line made it easier for customers to understand what Apple sold and easier for employees to understand what mattered. The passage of time has made the launches famous, but the cancellations helped make the launches possible.",

          {
            q: "What does the passage suggest about Jobs's use of simplicity?",

            "It was mainly an aesthetic preference.",
            "It functioned as a strategic business tool.",
            "It was popular because it avoided difficult decisions.",
            "It meant Apple stopped investing in engineering."

            answer: 1,
            why: "The passage says he treated simplicity as strategy and used it to focus customers and employees."
          },
          {
            q: "Why were some teams disappointed?",
            options: [
            "Customers stopped understanding Apple's products.",

            "They had to design a more confusing product range.",
            "Their projects were canceled during the product-line reduction."
          ],
            answer: 3,
            why: "The text says the decision disappointed teams whose projects were canceled."
          },
          {
            q: "The final sentence implies that successful launches depended partly on",
            options: [
            "earlier decisions to remove distractions.",
            "making the product line more complex.",
            "keeping every project alive until release.",
            "avoiding a clear company identity."
          ],
            answer: 0,
            why: "The cancellations concentrated focus and resources, helping later launches succeed."
          },
          {
            q: "Which title best captures the passage?",
            options: [
            "Why Apple Avoided Engineering Talent",
            "The End of All Apple Product Launches",
            "The Strategy of Focus at Apple",
            "How Customers Designed Apple's Matrix"
          ],
            answer: 2,
            why: "The passage is about how focus and subtraction clarified Apple's strategy."
          }
        ]
      },
      {
        title: "Michael Jordan and Productive Friction",
        text: "Michael Jordan's career is frequently summarized through championships, but that shorthand can hide the daily intensity behind them. Teammates have described practices in which Jordan pushed standards so aggressively that comfort rarely survived. This pressure did not automatically create excellence; pressure without trust can become fear. What made the system productive was that Jordan held himself to the same level he demanded from others and performed under the stakes he created. His example shows a difficult leadership paradox: high expectations can sharpen a team when they are connected to shared goals, but the same expectations can damage a group when they become personal humiliation.",
        questions: [
          {
            q: "What nuance does the passage add to Jordan's reputation?",
            options: [
            "He avoided intense practices to preserve comfort.",
            "His teammates never experienced pressure.",
            "His demanding style could be productive, but only under certain conditions.",
            "Championships resulted only from natural talent."
          ],
            answer: 2,
            why: "The passage distinguishes useful pressure tied to trust and goals from damaging humiliation."
          },
          {
            q: "Why was Jordan's pressure described as productive?",
            options: [
            "He demanded standards that he also met himself.",
            "He focused only on individual statistics.",
            "He removed all shared goals from the team.",
            "He made teammates fear public interviews."
          ],
            answer: 0,
            why: "The text says he held himself to the same level and performed under the stakes he created."
          },
          {
            q: "Which situation would the author likely criticize?",
            options: [
            "A leader with high standards and shared team goals.",
            "A leader who demands excellence while accepting the same pressure.",
            "A leader who connects practice intensity to performance.",
            "A leader who uses expectations mainly to humiliate people."
          ],
            answer: 3,
            why: "The passage warns that expectations damage a group when they become personal humiliation."
          },
          {
            q: "The phrase 'productive friction' most nearly means",
            options: [
            "a refusal to practice with intensity.",
            "pressure that can improve performance when properly grounded.",
            "comfort that protects a team from goals.",
            "conflict that weakens every relationship."
          ],
            answer: 1,
            why: "Friction means pressure or tension; productive means it sharpens the team under the right conditions."
          }
        ]
      },
      {
        title: "The Scientist Who Changed the Question",
        text: "In many laboratories, progress begins when someone notices that the accepted question is too narrow. A young materials scientist studying plastics initially asked how to make a package stronger. After visiting a coastal cleanup site, she changed the question: how could packaging perform briefly and then disappear safely? That shift moved her from durability toward controlled breakdown. Her team began testing plant-based polymers that resisted moisture for several weeks but decomposed under industrial composting conditions. The work was slower than improving ordinary plastic, and early versions failed basic shipping tests. Still, the reframed question opened a path that strength alone could not have produced.",
        questions: [
          {
            q: "What changed after the scientist visited the cleanup site?",
            options: [
            "She stopped testing materials under shipping conditions.",
            "She abandoned packaging research entirely.",
            "She decided ordinary plastic decomposed too quickly.",
            "She shifted from asking about strength to asking about safe disappearance."
          ],
            answer: 3,

          },
          {
            q: "Why were early versions unsuccessful?",
            options: [
            "They decomposed only in the ocean.",
            "They were made from metal rather than plants.",
            "They failed basic shipping tests.",
            "They resisted moisture for many years."
          ],
            answer: 2,
            why: "The passage directly states that early versions failed basic shipping tests."
          },
          {
            q: "What broader idea does the passage illustrate?",
            options: [
            "Scientific progress can come from reframing the problem.",
            "Industrial composting prevents all research delays.",

            "Durability is always more important than environmental impact."

            answer: 0,
            why: "The central idea is that changing the question opened a new research path."

            "a better question does not remove technical difficulty.",

          ],

          }
        ]
      }
    ]
  },
  {
    id: "reading3",
    title: "Markets, Minds, and Media",
    theme: "Business and pop culture",
    passages: [
      {
        title: "The Price of Convenience",
        text: "Subscription services often present themselves as inexpensive because each monthly fee looks small in isolation. The business model depends on a different calculation: customers are less likely to cancel when the cost feels forgettable and the service is embedded in daily routines. This does not make subscriptions deceptive by nature; many provide real value. The risk is accumulation. A music app, cloud storage plan, language tool, streaming service, and delivery membership can quietly become a large fixed expense. The smartest consumers do not reject subscriptions automatically. They periodically ask whether the service still solves a current problem or merely survives because canceling requires attention.",
        questions: [
          {
            q: "What is the main risk described in the passage?",
            options: [
            "Every subscription is intentionally deceptive.",
            "Customers cancel useful services too quickly.",
            "Small fees can accumulate into a significant fixed expense.",
            "Monthly fees are always larger than annual fees."
          ],
            answer: 2,
            why: "The passage focuses on accumulation: individually small costs become large together."
          },
          {
            q: "Why are customers less likely to cancel?",

            "review whether each subscription still serves a present need."
          ],

            answer: 0,

        ]
      },
      {
        title: "Why Trends Feel Sudden",
        text: "Online trends often appear to explode overnight, but the visible moment is usually late in the process. A dance, phrase, or editing style may circulate for weeks inside smaller communities before a large creator amplifies it. Once the trend reaches a broader audience, imitation accelerates because people are not only copying the original idea; they are copying proof that the idea has social momentum. By the time a brand notices the trend, joining it may already feel stale. This explains why effective cultural marketing depends less on chasing every viral moment and more on understanding the communities where those moments quietly begin.",

      {
        title: "Memory and the Spacing Effect",
        text: "Students often reread notes the night before an exam because fluency feels like mastery. The page looks familiar, so the brain mistakes recognition for durable memory. Cognitive science suggests a less comfortable method: spacing practice across time and forcing retrieval before the answer is visible. When learners struggle to recall an idea on Monday, revisit it on Thursday, and test it again the following week, they create stronger retrieval paths. This process can feel slower than rereading because it exposes forgetting. Yet that exposure is precisely the point. A study routine that feels smooth may be hiding weakness, while a routine that feels effortful may be building access.",
        questions: [
          {
            q: "What mistaken belief does the passage identify?",
            options: [
            "Forgetting proves learning is impossible.",
            "Testing yourself always damages memory.",
            "Spacing practice means studying only once.",
            "Familiarity with notes can be confused with real mastery."

var allowedTests = ["reading1","reading2"];
(function(){
  var params = new URLSearchParams(window.location.search);
  var allowed = params.get("allowed");
  if (allowed) allowedTests = allowed.split(",").filter(Boolean);
})();

var currentTest = null;
var passageIndex = 0;
var answers = {};
var allowUnansweredPassageAdvance = false;

function accessLabel(index, id) {
  if (index < 2) return { text: "Open", cls: "public" };
  if (index < 5) return { text: allowedTests.indexOf(id) > -1 ? "Account" : "Sign in", cls: allowedTests.indexOf(id) > -1 ? "" : "locked" };
  return { text: allowedTests.indexOf(id) > -1 ? "ePeak+" : "ePeak+", cls: allowedTests.indexOf(id) > -1 ? "premium" : "locked" };
}

function renderMenu() {
  var grid = document.getElementById("menu-grid");
  var openCount = READING_TESTS.filter(function(t){ return allowedTests.indexOf(t.id) > -1; }).length;
  document.getElementById("access-summary").textContent = openCount + " of " + READING_TESTS.length + " tests unlocked";
  grid.innerHTML = "";
  READING_TESTS.forEach(function(test, index) {
    var locked = allowedTests.indexOf(test.id) === -1;
    var access = accessLabel(index, test.id);
    var card = document.createElement("button");
    card.className = "test-card" + (locked ? " locked" : "");
    card.innerHTML = '<div class="test-top"><div class="test-num">Test ' + (index + 1) + '</div><span class="access ' + access.cls + '">' + access.text + '</span></div>'
      + '<div class="test-title">' + escapeHTML(test.title) + '</div>'
      + '<p class="test-desc">' + escapeHTML(test.theme) + '. Three passages, twelve challenging questions, full explanations.</p>'
      + '<div class="meta"><span>3 passages</span><span>12 questions</span><span>Multiple choice</span></div>';
    card.onclick = function() {
      if (locked) return notifyUpgrade();
      startTest(test.id);
    };
    grid.appendChild(card);
  });
}

function notifyUpgrade() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "showModal" }, window.location.origin);
  } else {
    alert("Please sign in or upgrade to unlock this reading test.");
  }
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(function(screen){ screen.classList.remove("active"); });
  document.getElementById(id).classList.add("active");
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function startTest(id) {
  currentTest = READING_TESTS.find(function(test){ return test.id === id; });
  passageIndex = 0;
  answers = {};
  allowUnansweredPassageAdvance = false;
  showScreen("test-screen");
  renderPassage();
}

function renderPassage() {
  var passage = currentTest.passages[passageIndex];
  document.getElementById("progress-bar").style.width = (((passageIndex + 1) / currentTest.passages.length) * 100) + "%";
  document.getElementById("progress-text").textContent = "Passage " + (passageIndex + 1) + " of " + currentTest.passages.length;
  document.getElementById("passage-kicker").textContent = currentTest.title;
  document.getElementById("passage-title").textContent = passage.title;
  document.getElementById("passage-text").textContent = passage.text;
  var questions = document.getElementById("questions");
  questions.innerHTML = "";
  passage.questions.forEach(function(q, qIndex) {
    var key = passageIndex + "-" + qIndex;
    var block = document.createElement("div");
    block.className = "question";
    block.innerHTML = '<div class="q-text">' + (qIndex + 1) + ". " + escapeHTML(q.q) + '</div>'
      + q.options.map(function(opt, optIndex){
        var selected = answers[key] === optIndex ? " selected" : "";
        return '<button type="button" class="option' + selected + '" onclick="selectAnswer(' + qIndex + ',' + optIndex + ')"><span class="letter">' + String.fromCharCode(65 + optIndex) + '</span><span>' + escapeHTML(opt) + '</span></button>';
      }).join("");
    questions.appendChild(block);
  });
  document.getElementById("prev-btn").disabled = passageIndex === 0;
  document.getElementById("next-btn").textContent = passageIndex === currentTest.passages.length - 1 ? "Submit test" : "Next passage";
  var warning = document.getElementById("nav-warning");
  warning.style.display = "none";
  warning.textContent = "";
}

function selectAnswer(qIndex, optIndex) {
  answers[passageIndex + "-" + qIndex] = optIndex;
  allowUnansweredPassageAdvance = false;
  renderPassage();
}

function prevPassage() {
  if (passageIndex > 0) {
    passageIndex -= 1;
    allowUnansweredPassageAdvance = false;
    renderPassage();
  }
}

function nextPassage() {
  var unanswered = currentTest.passages[passageIndex].questions.some(function(_, qIndex){
    return answers[passageIndex + "-" + qIndex] == null;
  });
  if (unanswered && !allowUnansweredPassageAdvance) {
    allowUnansweredPassageAdvance = true;
    var warning = document.getElementById("nav-warning");
    warning.textContent = "Some questions on this passage are unanswered. Click Next passage again to continue anyway.";
    warning.style.display = "block";
    return;
  }
  allowUnansweredPassageAdvance = false;
  if (passageIndex < currentTest.passages.length - 1) {
    passageIndex += 1;
    renderPassage();
  } else {
    showResults();
  }
}

function showResults() {
  var score = 0;
  var maxScore = 0;
  var feedback = [];
  currentTest.passages.forEach(function(passage, pIndex) {
    passage.questions.forEach(function(q, qIndex) {
      maxScore += 1;
      var key = pIndex + "-" + qIndex;
      var user = answers[key];
      var correct = user === q.answer;
      if (correct) score += 1;
      feedback.push({ passage: passage.title, number: qIndex + 1, q: q, user: user, correct: correct });
    });
  });
  document.getElementById("result-test-name").textContent = currentTest.title;
  document.getElementById("score-big").textContent = score + "/" + maxScore;
  document.getElementById("score-note").textContent = Math.round((score / maxScore) * 100) + "% correct. Review why each answer works below.";
  document.getElementById("feedback-list").innerHTML = feedback.map(function(item, index) {
    var userText = item.user == null ? "No answer" : String.fromCharCode(65 + item.user) + ". " + item.q.options[item.user];
    var rightText = String.fromCharCode(65 + item.q.answer) + ". " + item.q.options[item.q.answer];
    return '<div class="feedback-card ' + (item.correct ? "correct" : "wrong") + '">'
      + '<div class="feedback-title">' + (index + 1) + ". " + escapeHTML(item.q.q) + '</div>'
      + '<div class="feedback-meta"><strong>Passage:</strong> ' + escapeHTML(item.passage) + '</div>'
      + '<div class="feedback-meta"><strong>Your answer:</strong> ' + escapeHTML(userText) + '</div>'
      + '<div class="feedback-meta"><strong>Correct answer:</strong> ' + escapeHTML(rightText) + '</div>'
      + '<div class="why"><strong>Why:</strong> ' + escapeHTML(item.q.why) + '</div>'
      + '</div>';
  }).join("");
  reportProgress(score, maxScore);
  showScreen("results-screen");
}

function reportProgress(score, maxScore) {
  var saved = false;
  if (window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({
        type: "exerciseComplete",
        exerciseType: "Reading",
        exerciseName: currentTest.title,
        score: score,
        maxScore: maxScore,
        details: { testId: currentTest.id, totalPassages: currentTest.passages.length }
      }, window.location.origin);
      saved = true;
    } catch(e) {}
  }
  document.getElementById("saved-msg").textContent = saved ? "Progress sent to My Progress." : "";
}

function backToMenu() {
  currentTest = null;
  renderMenu();
  showScreen("menu-screen");
}

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, function(ch) {
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch];
  });
}

renderMenu();
</script>
