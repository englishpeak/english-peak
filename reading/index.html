<html lang="en">
<head>

<title>ePeak Reading Practice</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>

.pill{display:inline-flex;align-items:center;border-radius:999px;padding:5px 11px;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.14);white-space:nowrap}

.test-card.locked{opacity:.72}
.test-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:14px}
.test-num{font-family:"Cormorant Garamond",serif;color:var(--navy);font-size:1.35rem;font-weight:700}

.access.public{background:rgba(26,122,74,.1);color:var(--green)}
.access.premium{background:rgba(201,168,76,.16);color:var(--gold)}
.access.locked{background:rgba(0,0,0,.06);color:#777}
.test-title{font-weight:700;color:var(--navy);font-size:1rem;margin-bottom:6px}
.test-desc{font-size:.84rem;color:#666;margin:0 0 14px;flex:1}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:#999;font-size:.74rem}
.btn{border:0;border-radius:10px;background:linear-gradient(135deg,var(--navy),var(--purple));color:#fff;font-size:.9rem;font-weight:700;padding:12px 18px;cursor:pointer}

.screen{display:none}.screen.active{display:block}
.reader-shell{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:22px;align-items:start}
.panel{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:22px}
.passage-kicker{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700;margin-bottom:6px}
.passage-title{font-family:"Cormorant Garamond",serif;color:var(--navy);font-size:1.55rem;font-weight:700;margin:0 0 12px}
.passage-text{font-size:1rem;color:#263044;text-align:justify;white-space:pre-line}

.actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.score-card{text-align:center;background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:28px;margin-bottom:20px}
.score-big{font-family:"Cormorant Garamond",serif;color:var(--navy);font-size:3rem;font-weight:700;line-height:1}
.feedback-list{display:grid;gap:14px}

.feedback-card.correct{border-left-color:var(--green)}.feedback-card.wrong{border-left-color:var(--red)}

@media(max-width:860px){.wrap{padding:16px}.hero{display:block}.reader-shell{grid-template-columns:1fr}.panel{padding:18px}.hero h1{font-size:1.7rem}.passage-media{margin-bottom:14px}}
</style>
</head>
<body>
<div class="wrap">
  <section id="menu-screen" class="screen active">
    <div class="hero">
      <div>
        <h1>📖 Reading Practice</h1>
        <p>Business, science, pop culture, and biography readings with challenging multiple-choice questions and full answer explanations.</p>
      </div>
      <span class="pill" id="access-summary">Loading access</span>
    </div>
    <div id="menu-grid" class="menu-grid"></div>
  </section>

  <section id="test-screen" class="screen">
    <div class="progress-line">
      <button class="btn secondary" onclick="backToMenu()">Back to tests</button>
      <div class="bar" aria-hidden="true"><span id="progress-bar" style="width:33%"></span></div>
      <strong id="progress-text">Passage 1 of 3</strong>
    </div>
    <div class="reader-shell">
      <article class="panel">
        <div class="passage-kicker" id="passage-kicker">Test 1</div>
        <h2 class="passage-title" id="passage-title"></h2>
        <div class="passage-text" id="passage-text"></div>
      </article>
      <aside class="panel">
        <div id="passage-media" class="passage-media" hidden></div>
        <div id="questions"></div>
        <div class="nav-warning" id="nav-warning" role="status" aria-live="polite"></div>
        <div class="actions">
          <button class="btn secondary" id="prev-btn" onclick="prevPassage()">Previous</button>
          <button class="btn" id="next-btn" onclick="nextPassage()">Next passage</button>
        </div>
      </aside>
    </div>
  </section>

  <section id="results-screen" class="screen">
    <div class="score-card">
      <div class="passage-kicker" id="result-test-name">Reading Test</div>
      <div class="score-big" id="score-big">0/12</div>
      <p id="score-note">Review the explanations below.</p>
      <div class="saved" id="saved-msg"></div>
      <div class="actions" style="justify-content:center">
        <button class="btn" onclick="backToMenu()">Back to reading tests</button>
      </div>
    </div>
    <div id="feedback-list" class="feedback-list"></div>
  </section>
</div>

ble time to rebuild.\n\nLooking back, it is easy to think Apple’s success was inevitable. In reality, the company’s future depended on a series of difficult decisions made during just a few months. Steve Jobs did not save Apple by inventing a revolutionary product overnight. He first saved it by eliminating distractions, making painful choices, and giving the company something it had almost lost: focus.",

        title: "Why Iceland Has Almost No Mosquitoes",
        text: "Mosquitoes are among the most widespread insects on Earth. They thrive in tropical rainforests, deserts, cities, and even regions close to the Arctic Circle. Yet one country has managed to avoid becoming their home almost entirely. Surprisingly, that country is Iceland.\n\nConsidering Iceland’s climate, many people assume the explanation is simple: it is just too cold. However, scientists believe the answer is much more interesting than temperature alone. In fact, mosquitoes survive in places that experience colder winters than Iceland, including parts of Canada, Alaska, and northern Scandinavia.\n\nThe real difference appears to be Iceland’s unusual weather patterns. Mosquitoes depend on calm, shallow pools of water where they can lay their eggs. Their life cycle also requires predictable seasonal changes. Iceland’s climate, however, rarely follows a stable pattern. Winter temperatures often rise above freezing for short periods before dropping again. These repeated freeze-thaw cycles interrupt the development of mosquito larvae before they can mature into adults.\n\nThe island’s volcanic landscape also plays a role. Much of Iceland’s water flows quickly through rivers fed by glaciers or disappears into porous volcanic rock instead of remaining in the quiet ponds mosquitoes prefer. Without enough suitable breeding areas, large mosquito populations struggle to establish themselves.\n\nScientists are careful not to say Iceland will remain mosquito-free forever. As global temperatures continue to rise, ecosystems around the world are changing in unexpected ways. Species that once could not survive in certain regions are gradually expanding their range. Researchers regularly monitor Iceland’s wildlife to detect any new arrivals that might affect public health or local ecosystems.\n\nFor visitors, however, the absence of mosquitoes often comes as a pleasant surprise. Hikers can explore valleys, waterfalls, and lava fields without constantly swatting insects away. It is one of those rare natural mysteries that seems almost unbelievable until you experience it yourself. In a world where mosquitoes are nearly impossible to escape, Iceland remains an extraordinary exception.",

ul companies must understand the difference between meaningful innovation and unnecessary complexity. Sometimes the smartest way to move forward is not by adding something new, but by rediscovering what made people fall in love with a product in the first place.",

        text: "By the time Game 5 of the 1997 NBA Finals began, many people believed Michael Jordan would spend the evening watching from the bench. Just hours before tip-off, he was lying in a hotel room with a high fever, severe dehydration, and barely enough strength to stand. Team doctors were unsure whether he should play at all. Yet when the Chicago Bulls took the court against the Utah Jazz, Jordan walked onto the floor anyway.\n\nFor years, fans referred to the performance simply as “The Flu Game.” More recently, several people close to the team have suggested that food poisoning may have been the real cause. Whatever the illness actually was, everyone agreed on one point: Jordan was physically exhausted.\n\nThroughout the game, his body language revealed how much he was struggling. During time-outs he often sat motionless, conserving every bit of energy. He moved more slowly than usual, and teammates noticed that even walking back to the bench seemed unusually difficult. Yet whenever the Bulls needed a basket, Jordan continued demanding the ball.\n\nAs the fourth quarter unfolded, the game remained extremely close. With less than a minute remaining, Jordan received a pass beyond the three-point line. Despite his obvious fatigue, he calmly released the shot. The ball sailed through the net, giving Chicago the lead and eventually securing an 90–88 victory.\n\nJordan finished the night with 38 points, seven rebounds, five assists, and three steals. After the final buzzer, he leaned heavily on teammate Scottie Pippen simply to leave the court. The image of Pippen supporting Jordan as they walked toward the locker room has become one of the most famous photographs in basketball history.\n\nThe game has often been used to symbolize determination, but sports psychologists point out a more practical lesson. Elite athletes rarely perform because they feel perfect. Instead, they develop routines that allow them to focus despite discomfort, pressure, or unexpected setbacks. Jordan’s greatest achievement that evening may not have been scoring 38 points—it was continuing to make smart decisions while his body was telling him to stop.\n\nToday, nearly three decades later, “The Flu Game” remains one of the defining moments of Jordan’s career, not because it proved he was invincible, but because it showed how resilience often means performing well even when circumstances are far from ideal.",

      {
        title: "The Dancing Plague That Still Baffles Historians",
        text: "Imagine walking through your city’s main square and seeing dozens of people dancing uncontrollably. They are not celebrating a festival or performing for an audience. They simply cannot stop. Hours turn into days, and some collapse from exhaustion while others continue moving as if trapped by an invisible force.\n\nAs strange as it sounds, this appears to have happened during the summer of 1518 in the city of Strasbourg, which today lies in eastern France. According to historical records, a woman began dancing alone in the street for reasons no one understood. Within a week, dozens of other people had joined her. Soon the number had grown into the hundreds.\n\nLocal authorities were completely confused. Instead of stopping the dancing, they believed the victims needed to dance until they recovered. Musicians were hired to provide music, and temporary stages were even built in an effort to help people “dance the illness away.” Unsurprisingly, the strategy failed.\n\nModern historians continue debating what actually happened. One popular theory once suggested that contaminated rye bread caused hallucinations similar to those produced by certain natural chemicals. However, many researchers now consider that explanation unlikely because the dancers behaved in surprisingly coordinated ways over an extended period.\n\nAnother possibility is something known as mass psychogenic illness. Under extreme stress, fear, or social pressure, groups of people can develop real physical symptoms without any infectious disease being present. Europe during the early sixteenth century faced famine, disease, religious conflict, and widespread uncertainty. Some historians believe these hardships created psychological conditions capable of triggering extraordinary collective behavior.\n\nAlthough the exact cause remains unknown, the Dancing Plague reminds us that history is filled with events that resist simple explanations. It also demonstrates that people centuries ago responded to mysteries much as we do today: by proposing theories, arguing over evidence, and trying to understand experiences that seemed impossible at the time.\n\nMore than five hundred years later, the dancers of Strasbourg continue moving through history—not in the streets, but in one of history’s most fascinating unsolved mysteries.",

    media.innerHTML = '<img src="' + escapeHTML(passage.image) + '" alt="' + escapeHTML(passage.imageAlt || "") + '" loading="lazy">' + credit;
  } else {
    media.hidden = true;
    media.innerHTML = "";
  }
  var questions = document.getElementById("questions");
  questions.innerHTML = "";
  passage.questions.forEach(function(q, qIndex) {
    var key = passageIndex + "-" + qIndex;
    var block = document.createElement("div");
    block.className = "question";
    block.innerHTML = '<div class="q-text">' + (qIndex + 1) + ". " + escapeHTML(q.q) + '</div>'
      + q.options.map(function(opt, optIndex){
        var selected = answers[key] === optIndex ? " selected" : "";
        return '<button type="button" class="option' + selected + '" onclick="selectAnswer(' + qIndex + ',' + optIndex + ')"><span class="letter">' + String.fromCharCode(65 + optIndex) + '</span><span>' + escapeHTML(opt) + '</span></button>';
      }).join("");
    questions.appendChild(block);
  });
  document.getElementById("prev-btn").disabled = passageIndex === 0;
  document.getElementById("next-btn").textContent = passageIndex === currentTest.passages.length - 1 ? "Submit test" : "Next passage";
  var warning = document.getElementById("nav-warning");
  warning.style.display = "none";
  warning.textContent = "";
}

function selectAnswer(qIndex, optIndex) {
  answers[passageIndex + "-" + qIndex] = optIndex;
  allowUnansweredPassageAdvance = false;
  renderPassage();
}

function prevPassage() {
  if (passageIndex > 0) {
    passageIndex -= 1;
    allowUnansweredPassageAdvance = false;
    renderPassage();
  }
}

function nextPassage() {
  var unanswered = currentTest.passages[passageIndex].questions.some(function(_, qIndex){
    return answers[passageIndex + "-" + qIndex] == null;
  });
  if (unanswered && !allowUnansweredPassageAdvance) {
    allowUnansweredPassageAdvance = true;
    var warning = document.getElementById("nav-warning");
    warning.textContent = "Some questions on this passage are unanswered. Click Next passage again to continue anyway.";
    warning.style.display = "block";
    return;
  }
  allowUnansweredPassageAdvance = false;
  if (passageIndex < currentTest.passages.length - 1) {
    passageIndex += 1;
    renderPassage();
  } else {
    showResults();
  }
}

function showResults() {
  var score = 0;
  var maxScore = 0;
  var feedback = [];
  currentTest.passages.forEach(function(passage, pIndex) {
    passage.questions.forEach(function(q, qIndex) {
      maxScore += 1;
      var key = pIndex + "-" + qIndex;
      var user = answers[key];
      var correct = user === q.answer;
      if (correct) score += 1;
      feedback.push({ passage: passage.title, number: qIndex + 1, q: q, user: user, correct: correct });
    });
  });
  document.getElementById("result-test-name").textContent = currentTest.title;
  document.getElementById("score-big").textContent = score + "/" + maxScore;
  document.getElementById("score-note").textContent = Math.round((score / maxScore) * 100) + "% correct. Review why each answer works below.";
  document.getElementById("feedback-list").innerHTML = feedback.map(function(item, index) {
    var userText = item.user == null ? "No answer" : String.fromCharCode(65 + item.user) + ". " + item.q.options[item.user];
    var rightText = String.fromCharCode(65 + item.q.answer) + ". " + item.q.options[item.q.answer];
    return '<div class="feedback-card ' + (item.correct ? "correct" : "wrong") + '">'
      + '<div class="feedback-title">' + (index + 1) + ". " + escapeHTML(item.q.q) + '</div>'
      + '<div class="feedback-meta"><strong>Passage:</strong> ' + escapeHTML(item.passage) + '</div>'
      + '<div class="feedback-meta"><strong>Your answer:</strong> ' + escapeHTML(userText) + '</div>'
      + '<div class="feedback-meta"><strong>Correct answer:</strong> ' + escapeHTML(rightText) + '</div>'
      + '<div class="why"><strong>Why:</strong> ' + escapeHTML(item.q.why) + '</div>'
      + '</div>';
  }).join("");
  reportProgress(score, maxScore);
  showScreen("results-screen");
}

function reportProgress(score, maxScore) {
  var saved = false;
  if (window.parent && window.parent !== window) {
    try {
      window.parent.postMessage({
        type: "exerciseComplete",
        exerciseType: "Reading",
        exerciseName: currentTest.title,
        score: score,
        maxScore: maxScore,
        details: { testId: currentTest.id, totalPassages: currentTest.passages.length }
      }, window.location.origin);
      saved = true;
    } catch(e) {}
  }
  document.getElementById("saved-msg").textContent = saved ? "Progress sent to My Progress." : "";
}

function backToMenu() {
  currentTest = null;
  renderMenu();
  showScreen("menu-screen");
}

function escapeHTML(value) {
  return String(value || "").replace(/[&<>"']/g, function(ch) {
    return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[ch];
  });
}

renderMenu();
</script>
</body>
</html>
