p:wrap;align-items:center}.answer-zone.correct{border-color:var(--ep-success);background:#edf8f2}.answer-zone.incorrect{border-color:var(--ep-error);background:#fff1f1}.word-bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.word{border:1px solid rgba(13,59,111,.22);background:#fff;color:var(--ep-navy);border-radius:999px;padding:10px 14px;font-weight:700}.word .move{font-size:.74rem;margin-left:8px;color:var(--ep-muted)}.field-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.prompt{background:var(--ep-card-soft);border:1px solid var(--ep-border);border-radius:12px;padding:13px 14px;color:var(--ep-navy);font-weight:800}.text-input,.textarea{width:100%;border:1.5px solid var(--ep-border);border-radius:14px;padding:14px 16px;font:inherit;font-size:1.05rem}.textarea{min-height:130px;resize:vertical}.hard-textarea{min-height:clamp(220px,28vh,280px);border-width:2px;border-color:rgba(13,59,111,.24);border-radius:16px;padding:clamp(24px,3vw,30px);font-family:var(--ep-font-sans, Outfit, system-ui, -apple-system, "Segoe UI", sans-serif);font-size:clamp(1.55rem,3vw,2.125rem);line-height:1.45;color:#151515;background:#fff}.medium-input{flex:1;min-width:240px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px}.control-group{display:flex;gap:10px;flex-wrap:wrap}.feedback{min-height:28px;font-weight:800}.feedback.good{color:#2E7D32;font-size:clamp(1.1rem,2vw,1.45rem);animation:correctText .7s ease}.feedback.bad{color:var(--ep-error)}.textarea.correct{border-color:#2E7D32;background:#f7fcf8}.textarea.incorrect,.text-input.incorrect{border-color:var(--ep-error);background:#fffafa}.shake{animation:softShake .28s ease}.correct-flash{position:fixed;inset:0;background:rgba(46,125,50,.23);opacity:0;pointer-events:none;z-index:900;transition:opacity .28s ease}.correct-flash.show{opacity:1}.magic-toggle{position:fixed;right:clamp(16px,3vw,24px);bottom:clamp(18px,3vw,26px);width:54px;height:54px;border-radius:50%;border:1.5px solid var(--ep-border);background:rgba(255,255,255,.95);color:var(--ep-navy);font-size:1.45rem;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 22px rgba(13,59,111,.14);z-index:950;transition:background-color .2s ease,border-color .2s ease,color .2s ease,transform .2s ease}.magic-toggle:hover{transform:translateY(-1px);border-color:rgba(13,59,111,.38)}.magic-toggle.active{background:var(--ep-navy);border-color:var(--ep-navy);color:#fff}.sentence-card{transition:background-color .45s ease,border-color .45s ease}.magic-mode .sentence-card{background:rgba(255,255,255,.92)}@keyframes correctText{0%{opacity:.55;transform:scale(.96)}45%{opacity:1;transform:scale(1.04)}100%{transform:scale(1)}}@keyframes softShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.answer-reveal{margin-top:14px;padding:14px 16px;border-left:4px solid var(--ep-navy);background:var(--ep-card-soft);border-radius:10px}.results-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0}.stat{background:var(--ep-card-soft);border:1px solid var(--ep-border);border-radius:16px;padding:18px}.stat b{display:block;color:var(--ep-navy);font-size:2rem}.review-list{display:grid;gap:14px;margin-top:24px}.review-item{border:1px solid var(--ep-border);border-radius:18px;background:#fff;padding:18px}.review-item p{margin:.35rem 0}.modal-backdrop{position:fixed;inset:0;background:rgba(26,26,46,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal-backdrop.show{display:flex}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:24px;box-shadow:0 24px 80px rgba(13,59,111,.25);padding:28px;border:1px solid var(--ep-border)}.modal h3{margin:0 0 14px;color:var(--ep-navy);font-family:var(--ep-font-serif, "Cormorant Garamond", Georgia, serif);font-size:2rem;font-weight:400}.modal ul{padding-left:22px}.sr-only{position:absolute;left:-9999px}.hidden{displ {id:1,spanish:"No tengo idea de dónde dejé mis llaves.",primaryAnswer:"I have no idea where I left my keys.",acceptedAnswers:["I don't know where I left my keys.","I have no clue where I left my keys."],mediumPrompt:"I have no",note:"“I have no idea” and “I have no clue” are both natural alternatives."},
{id:2,spanish:"¿Cuánto tiempo llevas trabajando desde casa?",primaryAnswer:"How long have you been working from home?",acceptedAnswers:["How long have you worked from home?","How long have you been working at home?"],mediumPrompt:"How long have",note:"The present perfect continuous emphasizes the ongoing activity."},
{id:3,spanish:"Ojalá hubiera estudiado más para ese examen.",primaryAnswer:"I wish I had studied more for that exam.",acceptedAnswers:["If only I had studied more for that exam.","I wish I’d studied more for that exam."],mediumPrompt:"I wish I",note:"“I wish” plus the past perfect expresses regret about the past."},
{id:4,spanish:"Si mañana llueve, cancelaremos el picnic.",primaryAnswer:"If it rains tomorrow, we’ll cancel the picnic.",acceptedAnswers:["If it rains tomorrow, we will cancel the picnic.","We’ll cancel the picnic if it rains tomorrow.","We will cancel the picnic if it rains tomorrow."],mediumPrompt:"If it rains",note:"This is a first conditional sentence."},
{id:5,spanish:"Acabo de darme cuenta de que olvidé apagar las luces.",primaryAnswer:"I just realized that I forgot to turn off the lights.",acceptedAnswers:["I’ve just realized that I forgot to turn off the lights.","I just realized I forgot to turn off the lights.","I’ve just realized I forgot to turn off the lights.","I just realized that I left the lights on.","I’ve just realized that I left the lights on."],mediumPrompt:"I just realized",note:"“Forgot to turn off the lights” and “left the lights on” communicate the same result."},
{id:6,spanish:"¿Te importaría cerrar la ventana?",primaryAnswer:"Would you mind closing the window?",acceptedAnswers:["Would you mind shutting the window?","Do you mind closing the window?","Could you close the window, please?"],mediumPrompt:"Would you mind",note:"“Would you mind” is followed by a gerund."},
{id:7,spanish:"Nunca había probado comida tailandesa antes de ese viaje.",primaryAnswer:"I had never tried Thai food before that trip.",acceptedAnswers:["I’d never tried Thai food before that trip.","I had never eaten Thai food before that trip.","I’d never eaten Thai food before that trip."],mediumPrompt:"I had never",note:"The past perfect places the experience before another past event."},
{id:8,spanish:"¿A qué hora se supone que empieza la reunión?",primaryAnswer:"What time is the meeting supposed to start?",acceptedAnswers:["What time is the meeting supposed to begin?","What time is the meeting meant to start?","When is the meeting supposed to start?"],mediumPrompt:"What time is",note:"“Be supposed to” expresses an expected or scheduled action."},
{id:9,spanish:"Llevo esperando más de una hora.",primaryAnswer:"I’ve been waiting for more than an hour.",acceptedAnswers:["I have been waiting for more than an hour.","I’ve been waiting for over an hour.","I have been waiting for over an hour."],mediumPrompt:"I’ve been waiting",note:"Use “for” to express a duration."},
{id:10,spanish:"No pude contestarte porque mi teléfono se quedó sin batería.",primaryAnswer:"I couldn’t answer you because my phone ran out of battery.",acceptedAnswers:["I couldn’t reply because my phone ran out of battery.","I couldn’t get back to you because my phone ran out of battery.","I couldn’t answer you because my phone died.","I couldn’t reply because my phone died.","I couldn’t respond because my phone died."],mediumPrompt:"I couldn’t answer",note:"“My phone died” is a common informal alternative."},
{id:11,spanish:"Aunque estaba muy cansado, decidió terminar el proyecto esa misma noche.",primaryAnswer:"Although he was very tired, he decided to finish the project that same night.",acceptedAnswers:["Even though he was very tired, he decided to finish the project that same night.","Although she was very tired, she decided to finish the project that same night.","Even though she was very tired, she decided to finish the project that same night.","Despite being very tired, he decided to finish the project that same night.","Despite being very tired, she decided to finish the project that same night."],mediumPrompt:"Although he was",note:"Spanish does not specify gender here, so both “he” and “she” are accepted."},
{id:12,spanish:"¿Qué habrías hecho en mi lugar?",primaryAnswer:"What would you have done in my place?",acceptedAnswers:["What would you have done if you were me?","What would you have done if you’d been me?","What would you have done in my position?","What would you have done in my situation?"],mediumPrompt:"What would you",note:"“In my place,” “in my position,” and “in my situation” are natural equivalents."},
{id:13,spanish:"Me tomó años perder el miedo a hablar inglés.",primaryAnswer:"It took me years to overcome my fear of speaking English.",acceptedAnswers:["It took me years to get over my fear of speaking English.","It took me years to lose my fear of speaking English.","It took me years to stop being afraid of speaking English.","It took me years to stop being afraid to speak English."],mediumPrompt:"It took me",note:"“Overcome” is more formal; “get over” is more conversational."},
{id:14,spanish:"Apenas estaba empezando a entender cuando cambiaron de tema.",primaryAnswer:"I was just starting to understand when they changed the subject.",acceptedAnswers:["I was just beginning to understand when they changed the subject.","I had just started to understand when they changed the subject.","I was only beginning to understand when they changed the topic.","I was just starting to understand when they changed the topic."],mediumPrompt:"I was just",note:"“Change the subject” is generally more idiomatic in conversation."},
{id:15,spanish:"No vale la pena discutir por algo tan pequeño.",primaryAnswer:"It’s not worth arguing over something so small.",acceptedAnswers:["It isn’t worth arguing over something so small.","It’s not worth arguing about something so small.","There is no point in arguing over something so small.","There’s no point in arguing about something so small.","It’s not worth fighting over something so small."],mediumPrompt:"It’s not worth",note:"“Worth” is followed by a gerund."},
{id:16,spanish:"Se espera que el nuevo sistema reduzca los tiempos de espera.",primaryAnswer:"The new system is expected to reduce waiting times.",acceptedAnswers:["The new system is expected to reduce wait times.","It is expected that the new system will reduce waiting times.","The new system is expected to shorten waiting times."],mediumPrompt:"The new system",note:"This structure uses a passive reporting verb."},
{id:17,spanish:"¿Has pensado en cambiar de trabajo?",primaryAnswer:"Have you thought about changing jobs?",acceptedAnswers:["Have you thought of changing jobs?","Have you considered changing jobs?","Have you thought about changing your job?","Have you considered getting a new job?"],mediumPrompt:"Have you thought",note:"“Consider” is followed directly by a gerund."},
{id:18,spanish:"No importa cuántas veces lo intentes; lo importante es no rendirse.",primaryAnswer:"It doesn’t matter how many times you try; what matters is not giving up.",acceptedAnswers:["No matter how many times you try, the important thing is not to give up.","It doesn’t matter how many times you try; the important thing is not to give up.","No matter how many times you try, what matters is that you don’t give up.","It doesn’t matter how many times you try as long as you don’t give up."],mediumPrompt:"It doesn’t matter",note:"Several natural structures can express the same idea."},
{id:19,spanish:"Si no me hubieras recordado, lo habría olvidado por completo.",primaryAnswer:"If you hadn’t reminded me, I would have completely forgotten.",acceptedAnswers:["If you hadn’t reminded me, I would have forgotten completely.","If you hadn’t reminded me, I would’ve completely forgotten.","Had you not reminded me, I would have completely forgotten.","I would have completely forgotten if you hadn’t reminded me.","If you had not reminded me, I would have forgotten all about it."],mediumPrompt:"If you hadn’t",note:"This is a third conditional sentence."},
{id:20,spanish:"Hace calor aquí, ¿podrías encender el aire acondicionado?",primaryAnswer:"It’s hot in here. Could you turn on the air conditioning?",acceptedAnswers:["It’s hot in here. Could you turn on the air conditioner?","It’s hot in here. Could you turn the air conditioning on?","It’s hot in here. Can you turn on the air conditioning?","It’s hot in here. Would you turn on the air conditioning?","It’s hot in here. Could you switch on the air conditioning?"],mediumPrompt:"It’s hot in",note:"“Air conditioning” refers to the system; “air conditioner” can refer to the unit."},
{id:21,spanish:"Estoy deseando volver a verte.",primaryAnswer:"I’m looking forward to seeing you again.",acceptedAnswers:["I am looking forward to seeing you again.","I can’t wait to see you again.","I’m really looking forward to seeing you again.","I look forward to seeing you again."],mediumPrompt:"I’m looking forward",note:"In “look forward to,” the word “to” is a preposition, so it is followed by a gerund."},
{id:22,spanish:"Ese informe debería haberse enviado ayer.",primaryAnswer:"That report should have been sent yesterday.",acceptedAnswers:["The report should have been sent yesterday.","That report was supposed to be sent yesterday.","The report was supposed to have been sent yesterday."],mediumPrompt:"That report should",note:"“Should have been sent” is a modal perfect passive."},
{id:23,spanish:"No sólo llegó tarde, sino que además olvidó traer los documentos.",primaryAnswer:"Not only did he arrive late, but he also forgot to bring the documents.",acceptedAnswers:["Not only did she arrive late, but she also forgot to bring the documents.","He not only arrived late, but also forgot to bring the documents.","She not only arrived late, but also forgot to bring the documents.","Not only was he late, but he also forgot to bring the documents.","Not only was she late, but she also forgot to bring the documents."],mediumPrompt:"Not only did",note:"Beginning with “Not only” requires subject–auxiliary inversion. Both genders are accepted."},
{id:24,spanish:"¿Podrías decirme dónde está la estación de autobuses más cercana?",primaryAnswer:"Could you tell me where the nearest bus station is?",acceptedAnswers:["Can you tell me where the nearest bus station is?","Could you tell me where the closest bus station is?","Would you tell me where the nearest bus station is?","Could you tell me where the nearest bus stop is?"],mediumPrompt:"Could you tell",note:"An embedded question uses statement word order: “where the station is.”"},
{id:25,spanish:"Tan pronto como terminó la llamada, salió corriendo de la oficina.",primaryAnswer:"As soon as he finished the call, he ran out of the office.",acceptedAnswers:["As soon as she finished the call, she ran out of the office.","As soon as he ended the call, he rushed out of the office.","As soon as she ended the call, she rushed out of the office.","The moment he finished the call, he ran out of the office.","The moment she finished the call, she ran out of the office."],mediumPrompt:"As soon as",note:"Spanish does not specify gender, so “he” and “she” are accepted."},
{id:26,spanish:"Me sorprende que todavía no hayan anunciado los resultados.",primaryAnswer:"I’m surprised that they still haven’t announced the results.",acceptedAnswers:["I am surprised that they still haven’t announced the results.","It surprises me that they still haven’t announced the results.","I’m surprised they haven’t announced the results yet.","I’m surprised that the results still haven’t been announced.","I’m surprised the results haven’t been announced yet."],mediumPrompt:"I’m surprised that",note:"English does not use a subjunctive structure here in the same way Spanish does."},
{id:27,spanish:"Solía jugar tenis todos los fines de semana cuando estaba en la universidad.",primaryAnswer:"I used to play tennis every weekend when I was in college.",acceptedAnswers:["I used to play tennis every weekend when I was at university.","I would play tennis every weekend when I was in college.","I would play tennis every weekend when I was at university.","I used to play tennis every weekend when I was in university."],mediumPrompt:"I used to",note:"“At university” is common in British English; “in college” is common in American English."},
{id:28,spanish:"No fue hasta el año pasado que empecé a disfrutar leer en inglés.",primaryAnswer:"It wasn’t until last year that I started enjoying reading in English.",acceptedAnswers:["It was not until last year that I started enjoying reading in English.","It wasn’t until last year that I began to enjoy reading in English.","I didn’t start enjoying reading in English until last year.","I didn’t begin to enjoy reading in English until last year."],mediumPrompt:"It wasn’t until",note:"Both the cleft structure and the version with “until” at the end are natural."},
{id:29,spanish:"Cuanto más practiques, más natural sonará tu inglés.",primaryAnswer:"The more you practice, the more natural your English will sound.",acceptedAnswers:["The more you practise, the more natural your English will sound.","The more you practice, the more naturally you’ll speak English.","The more you practise, the more naturally you will speak English."],mediumPrompt:"The more you",note:"This is a correlative comparative structure. Accept both American “practice” and British “practise.”"},
{id:30,spanish:"A estas alturas mañana, estaré volando rumbo a Italia.",primaryAnswer:"By this time tomorrow, I’ll be flying to Italy.",acceptedAnswers:["By this time tomorrow, I will be flying to Italy.","This time tomorrow, I’ll be flying to Italy.","At this time tomorrow, I’ll be flying to Italy.","By this time tomorrow, I’ll be on my way to Italy.","This time tomorrow, I’ll be on my way to Italy."],mediumPrompt:"By this time",note:"The future continuous describes an action that will be in progress at a specific future time."}
]},{id:2,title:"Set 2",description:"30 sentences · Mixed levels · Mixed grammar",sentences:[
{id:1,spanish:"¿Ya terminaste o todavía te falta mucho?",primaryAnswer:"Are you done yet, or do you still have a lot left?",acceptedAnswers:["Have you finished yet, or do you still have a lot left?","Are you finished yet, or do you still have a lot to do?","Have you finished yet, or do you still have a lot to do?","Are you done yet, or do you still have much left?"],mediumPrompt:"Are you done",note:"“Be done” is a natural conversational alternative to “have finished.”"},
{id:2,spanish:"Me tomó un rato darme cuenta de lo que había pasado.",primaryAnswer:"It took me a while to realize what had happened.",acceptedAnswers:["It took me a while to figure out what had happened.","It took me some time to realize what had happened.","It took me a little while to realize what had happened.","It took me a while to understand what had happened."],mediumPrompt:"It took me",note:"“Figure out” is a natural phrasal verb for slowly understanding something."},
{id:3,spanish:"Nunca imaginé que terminaríamos trabajando juntos.",primaryAnswer:"I never imagined we’d end up working together.",acceptedAnswers:["I never imagined we would end up working together.","I never thought we’d end up working together.","I never thought we would end up working together.","I never imagined we’d wind up working together."],mediumPrompt:"I never imagined",note:"“End up” describes an unexpected final result."},
{id:4,spanish:"Si yo fuera tú, aceptaría esa oportunidad.",primaryAnswer:"If I were you, I’d take that opportunity.",acceptedAnswers:["If I were you, I would take that opportunity.","If I were you, I’d accept that opportunity.","If I were you, I would accept that opportunity.","If I were in your shoes, I’d take that opportunity."],mediumPrompt:"If I were",note:"Use “If I were you” for hypothetical advice."},

{id:16,spanish:"No me gustan las películas de terror, pero cuéntame sobre esta.",primaryAnswer:"I don't like horror movies, but tell me about this one.",acceptedAnswers:["I'm not into horror movies, but tell me about this one.","I don't care for horror films, but tell me about this one.","Horror movies aren't my thing, but tell me about this one.","I don't usually like horror movies, but tell me about this one."],mediumPrompt:"I don't like",note:"“This one” naturally replaces a repeated countable noun."},
{id:17,spanish:"Si las cosas siguen así, tendremos que buscar otra solución.",primaryAnswer:"If things keep going this way, we'll have to find another solution.",acceptedAnswers:["If things continue like this, we'll have to find another solution.","If this keeps up, we'll have to look for another solution.","If things carry on this way, we'll need to find a different solution.","We'll have to come up with another solution if things keep going this way."],mediumPrompt:"If things keep",note:"“If this keeps up” is an idiomatic way to describe a continuing situation."},

{id:22,spanish:"Llevo años queriendo visitar ese lugar.",primaryAnswer:"I've been wanting to visit that place for years.",acceptedAnswers:["I have wanted to visit that place for years.","I've wanted to go to that place for years.","I've been meaning to visit that place for years.","For years, I've wanted to visit that place."],mediumPrompt:"I've been wanting",note:"The present perfect continuous emphasizes a long-standing desire."},

{id:29,spanish:"Para el próximo mes, habremos terminado la parte más complicada del proyecto.",primaryAnswer:"By next month, we'll have finished the most complicated part of the project.",acceptedAnswers:["By next month, we will have completed the most difficult part of the project.","We'll have finished the hardest part of the project by next month.","By next month, we'll be done with the most complicated part of the project.","We will have completed the trickiest part of the project by next month."],mediumPrompt:"By next month",note:"The future perfect describes something completed by a future deadline."},

{id:2,spanish:"¿Qué harías si de repente te quedaras sin trabajo?",primaryAnswer:"What would you do if you suddenly lost your job?",acceptedAnswers:["What would you do if you were suddenly out of work?","What would you do if you suddenly found yourself without a job?","What would you do if you unexpectedly lost your job?"],mediumPrompt:"What would you",note:"The second conditional describes an unreal or imagined present or future situation."},
{id:3,spanish:"Todavía me estoy acostumbrando a trabajar desde casa.",primaryAnswer:"I’m still getting used to working from home.",acceptedAnswers:["I'm still getting accustomed to working from home.","I'm still adjusting to working from home.","I’m still getting used to working remotely."],mediumPrompt:"I’m still getting",note:"“Get used to” plus an -ing form means to become accustomed to something."},
{id:4,spanish:"Para cuando nos dimos cuenta del error, ya era demasiado tarde.",primaryAnswer:"By the time we realized the mistake, it was already too late.",acceptedAnswers:["By the time we noticed the mistake, it was already too late.","It was already too late by the time we realized the error.","By the time we became aware of the error, it was already too late."],mediumPrompt:"By the time",note:"“By the time” establishes the relationship between two events in the past."},
{id:5,spanish:"No tiene caso fingir que no pasó nada.",primaryAnswer:"There’s no point in pretending nothing happened.",acceptedAnswers:["There's no point pretending nothing happened.","There's no use pretending nothing happened.","It doesn't make sense to pretend nothing happened.","There is no point in pretending that nothing happened."],mediumPrompt:"There’s no point",note:"Use “there’s no point” plus an -ing form for an action that serves no purpose."},
{id:6,spanish:"¿Por qué no me dijiste que necesitabas ayuda?",primaryAnswer:"Why didn’t you tell me you needed help?",acceptedAnswers:["Why didn't you tell me that you needed help?","Why didn’t you let me know you needed help?","Why didn't you say you needed help?"],mediumPrompt:"Why didn’t you",note:"After “tell,” an embedded clause can report what someone needed."},
{id:7,spanish:"Llevo intentando comunicarme con él desde ayer.",primaryAnswer:"I’ve been trying to get in touch with him since yesterday.",acceptedAnswers:["I've been trying to contact him since yesterday.","I've been trying to reach him since yesterday.","I've been trying to get hold of him since yesterday.","I have been trying to get in touch with him since yesterday."],mediumPrompt:"I’ve been trying",note:"The present perfect continuous with “since” describes an ongoing effort from a starting point."},
{id:8,spanish:"Si hubiera prestado más atención, no habría cometido ese error.",primaryAnswer:"If I had paid more attention, I wouldn’t have made that mistake.",acceptedAnswers:["If I'd paid more attention, I wouldn't have made that mistake.","I wouldn’t have made that mistake if I had paid more attention.","Had I paid more attention, I wouldn’t have made that mistake.","If I had been paying more attention, I wouldn't have made that mistake."],mediumPrompt:"If I had",note:"The third conditional imagines a different past action and its past result."},
{id:9,spanish:"Parece que alguien dejó la puerta abierta toda la noche.",primaryAnswer:"It looks like someone left the door open all night.",acceptedAnswers:["It seems like someone left the door open all night.","It appears that someone left the door open all night.","It looks as though someone left the door open all night."],mediumPrompt:"It looks like",note:"“It looks like” introduces an impression based on available evidence."},
{id:10,spanish:"No estoy seguro de cuánto tiempo nos vaya a tomar terminar esto.",primaryAnswer:"I’m not sure how long it’s going to take us to finish this.",acceptedAnswers:["I'm not sure how long it will take us to finish this.","I’m not sure how much time it’s going to take us to finish this.","I'm not sure how long we'll need to finish this.","I don’t know how long it’s going to take us to finish this."],mediumPrompt:"I’m not sure",note:"In an indirect clause with “how long,” use statement word order."},
{id:11,spanish:"Por mucho que se lo expliques, nunca escucha.",primaryAnswer:"No matter how much you explain it to him, he never listens.",acceptedAnswers:["No matter how much you explain it to her, she never listens.","However much you explain it to him, he never listens.","However much you explain it to her, she never listens.","Even if you explain it to him repeatedly, he never listens.","Even if you explain it to her over and over, she never listens."],mediumPrompt:"No matter how",note:"“No matter how much” shows that changing the amount does not change the result."},
{id:12,spanish:"Me gustaría saber por qué cambiaron de opinión tan rápido.",primaryAnswer:"I’d like to know why they changed their minds so quickly.",acceptedAnswers:["I would like to know why they changed their minds so quickly.","I'd like to know why they changed their minds so fast.","I’d like to know why they changed their mind so quickly.","I wonder why they changed their minds so quickly."],mediumPrompt:"I’d like to",note:"“Would like to know” introduces a polite request for information."},
{id:13,spanish:"¿Cómo habría sido tu vida si hubieras crecido en otro país?",primaryAnswer:"What would your life have been like if you’d grown up in another country?",acceptedAnswers:["What would your life have been like if you had grown up in another country?","If you'd grown up in another country, what would your life have been like?","How would your life have been different if you’d grown up in another country?"],mediumPrompt:"What would your",note:"The third conditional imagines a different past and its hypothetical outcome."},
{id:14,spanish:"Se rumorea que la compañía está considerando vender el edificio.",primaryAnswer:"The company is rumored to be considering selling the building.",acceptedAnswers:["It's rumored that the company is considering selling the building.","There are rumors that the company is considering selling the building.","The company is said to be considering selling the building.","Rumor has it that the company is considering selling the building."],mediumPrompt:"The company is",note:"Passive reporting structures such as “is rumored to” report unconfirmed information."},
{id:15,spanish:"Apenas podía escuchar lo que decía por todo el ruido.",primaryAnswer:"I could barely hear what he was saying because of all the noise.",acceptedAnswers:["I could barely hear what she was saying because of all the noise.","I could hardly hear what he was saying because of all the noise.","I could hardly hear what she was saying because of all the noise.","Because of all the noise, I could barely hear what he was saying.","Because of all the noise, I could barely hear what she was saying."],mediumPrompt:"I could barely",note:"“Barely” means only just or almost not; Spanish leaves the speaker’s gender unspecified here."},
{id:16,spanish:"Nunca se me había ocurrido verlo de esa manera.",primaryAnswer:"It had never occurred to me to look at it that way.",acceptedAnswers:["It had never occurred to me to see it that way.","I'd never thought of looking at it that way.","I'd never thought about it that way.","It had never crossed my mind to look at it that way."],mediumPrompt:"It had never",note:"“It occurred to me” describes an idea coming into someone’s mind."},
{id:17,spanish:"Si vas a llegar tarde, por lo menos avísame.",primaryAnswer:"If you’re going to be late, at least let me know.",acceptedAnswers:["If you're going to arrive late, at least let me know.","At least let me know if you’re going to be late.","If you're going to be late, at least tell me.","If you’ll be late, at least give me a heads-up."],mediumPrompt:"If you’re going",note:"“Be going to” describes the expected situation, while “at least” sets a minimum request."},
{id:18,spanish:"No puedo creer que hayamos tardado tanto en encontrar una solución.",primaryAnswer:"I can’t believe it took us so long to find a solution.",acceptedAnswers:["I cannot believe it took us so long to find a solution.","I can't believe we took so long to find a solution.","I can’t believe it took us that long to find a solution.","I can't believe it took us so long to come up with a solution."],mediumPrompt:"I can’t believe",note:"Use “it takes” plus a person, time, and an infinitive to describe duration."},

{id:20,spanish:"Deberías haberme preguntado antes de tomar una decisión.",primaryAnswer:"You should have asked me before making a decision.",acceptedAnswers:["You should've asked me before making a decision.","You should have asked me before you made a decision.","You ought to have asked me before making a decision.","You should have checked with me before making a decision."],mediumPrompt:"You should have",note:"“Should have” plus a past participle expresses criticism of a past action."},

{id:3,level:"C1",spanish:"Aunque la propuesta parece viable, todavía quedan varios obstáculos por superar.",primaryAnswer:"Although the proposal seems feasible, there are still several obstacles to overcome.",acceptedAnswers:["Even though the proposal seems feasible, there are still several obstacles to overcome.","Although the proposal appears viable, there are still several obstacles to overcome.","The proposal seems feasible, but there are still several obstacles to overcome."],mediumPrompt:"Although the",note:"“Feasible” means realistically possible or practical."},

{id:5,level:"B2",spanish:"No habría cometido ese error si hubiera revisado las cifras con más cuidado.",primaryAnswer:"I wouldn't have made that mistake if I'd checked the figures more carefully.",acceptedAnswers:["I would not have made that mistake if I had checked the figures more carefully.","If I'd checked the figures more carefully, I wouldn't have made that mistake.","Had I checked the figures more carefully, I wouldn't have made that mistake."],mediumPrompt:"I wouldn't",note:"The third conditional imagines a different past action and result."},
{id:6,level:"C2",spanish:"Por muy convincente que parezca su argumento, no deja de basarse en una suposición difícil de justificar.",primaryAnswer:"However compelling his argument may seem, it is still based on an assumption that is difficult to justify.",acceptedAnswers:["However compelling her argument may seem, it is still based on an assumption that is difficult to justify.","However compelling their argument may seem, it is still based on an assumption that is difficult to justify.","No matter how compelling his argument may seem, it is still based on an assumption that is difficult to justify."],mediumPrompt:"However compelling",note:"“Compelling” means very convincing; an “assumption” is something accepted without proof."},

{id:8,level:"B1",spanish:"¿Podrías cuidar a mi perro mientras estoy fuera?",primaryAnswer:"Could you look after my dog while I'm away?",acceptedAnswers:["Could you take care of my dog while I'm away?","Can you look after my dog while I'm gone?","Would you mind taking care of my dog while I'm away?"],mediumPrompt:"Could you",note:"“Look after” is a phrasal verb meaning “take care of.”"},
{id:9,level:"A2",spanish:"Vamos a tener que salir más temprano si queremos llegar a tiempo.",primaryAnswer:"We're going to have to leave earlier if we want to get there on time.",acceptedAnswers:["We are going to have to leave earlier if we want to get there on time.","We'll have to leave earlier if we want to arrive on time.","We're going to need to leave earlier to get there on time."],mediumPrompt:"We're going",note:"“Be going to have to” expresses a future necessity; “on time” means not late."},
{id:10,level:"C1",spanish:"Me preocupa que estén pasando por alto un detalle que podría cambiar por completo el resultado.",primaryAnswer:"I'm concerned that they're overlooking a detail that could completely change the outcome.",acceptedAnswers:["I am concerned that they are overlooking a detail that could completely change the outcome.","I'm worried that they're overlooking a detail that could completely change the result.","I'm concerned they may be overlooking a detail that could change the outcome completely."],mediumPrompt:"I'm concerned",note:"“Overlook” means fail to notice; the “outcome” is the final result."},
{id:11,level:"B2",spanish:"Todavía no hemos confirmado una fecha definitiva para la reunión.",primaryAnswer:"We still haven't settled on a final date for the meeting.",acceptedAnswers:["We haven't settled on a final date for the meeting yet.","We still haven't agreed on a final date for the meeting.","We haven't decided on a final date for the meeting yet.","We still haven't confirmed a final date for the meeting."],mediumPrompt:"We still",note:"“Settle on” means reach a final decision or finally choose something."},

function addAlternativeVariants(sentence){
  const originals=[sentence.primaryAnswer,...sentence.acceptedAnswers];
  const variants=new Map(originals.map(answer=>[normalizeAlternative(answer),answer]));
  for(const answer of originals){
    for(const [pattern,replacement] of alternativeRules){
      pattern.lastIndex=0;
      if(!pattern.test(answer))continue;
      pattern.lastIndex=0;
      const variant=answer.replace(pattern,replacement);
      const key=normalizeAlternative(variant);
      if(!variants.has(key))variants.set(key,variant);
    }
  }
  sentence.acceptedAnswers=[...variants.values()].filter(answer=>normalizeAlternative(answer)!==normalizeAlternative(sentence.primaryAnswer));
}
function normalizeAlternative(value){return value.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[.,;:!?¿¡]/g," ").replace(/\s+/g," ").trim()}

const app=document.getElementById("app"),modalRoot=document.getElementById("modalRoot");const state={screen:"home",difficulty:null,setId:null,index:0,progress:{},review:false,magicMode:false,feedbackNonce:0};
const magicColors=["#DCE6F0","#E5DEEC","#DDE7DF","#EADDDD","#E9E2D5","#EEE8CF"];

const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[c]));
function normalizeAnswer(v){return String(v||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[¿?¡!]/g," ").replace(/[.,;]/g," ").replace(/\s+/g," ").trim()}
function stripPunctuationWords(text){return text.replace(/[’‘`´]/g,"'").replace(/[.,;:!?¿¡]/g,"").split(/\s+/).filter(Boolean)}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function setData(){return sets.find(s=>s.id===state.setId)||sets[0]}function sentence(){return setData().sentences[state.index]}function key(i=state.index){return `${state.difficulty}-${state.setId}-${i}`}function entry(i=state.index){const k=key(i);if(!state.progress[k])state.progress[k]={typed:"",chosen:[],bank:null,attempts:0,checked:false,correct:false,showAnswer:false};return state.progress[k]}
function valid(text,s,diff=state.difficulty){const answers=diff==="Easy"?[s.primaryAnswer]:[s.primaryAnswer,...s.acceptedAnswers];const n=normalizeAnswer(text);return answers.some(a=>normalizeAnswer(a)===n)}
function show(screen){state.screen=screen;render();window.scrollTo(0,0);applyBackgroundForSentence()}
function chooseDifficulty(d){state.difficulty=d;show("sets")}function startSet(id){state.setId=id;state.index=0;show("exercise")}function home(){state.difficulty=null;state.setId=null;show("home")}function goSets(){show("sets")}
function render(){app.innerHTML="";if(state.screen==="home")renderHome();else if(state.screen==="sets")renderSets();else if(state.screen==="exercise")renderExercise();else if(state.screen==="results")renderResults();else if(state.screen==="review")renderReview();applyBackgroundForSentence();syncMagicButton()}
function renderHome(){app.innerHTML=`<main class="screen active hero"><div class="wrap"><section class="panel center"><h1>Translation Challenge LIVE</h1><p class="subtitle">Choose difficulty</p><div class="grid">${[["Easy","Unscramble the words to build the translation."],["Medium","Complete the translation."],["Hard","Write the complete translation."]].map(x=>`<button class="choice" data-diff="${x[0]}"><strong>${x[0]}</strong><span>${x[1]}</span></button>`).join("")}</div></section></div></main>`;app.querySelectorAll("[data-diff]").forEach(b=>b.onclick=()=>chooseDifficulty(b.dataset.diff))}
function renderSets(){app.innerHTML=`<main class="screen active"><div class="wrap"><div class="topline"><button class="btn ghost" id="backHome">Back</button><span class="badge">Selected difficulty: ${esc(state.difficulty)}</span></div><section class="panel"><p class="brand-kicker">Translation Challenge LIVE</p><h2>Choose a set</h2><p class="subtitle">More sets can be added to the data array later.</p><div class="grid sets-grid">${sets.map(s=>`<button class="set-card" data-set="${s.id}"><strong>${s.title}</strong><span>${s.description}</span></button>`).join("")}</div></section></div></main>`;app.querySelector("#backHome").onclick=home;app.querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>startSet(+b.dataset.set))}
function renderExercise(){applyBackgroundForSentence();const s=sentence(),set=setData(),e=entry();if(state.difficulty==="Easy"&&!e.bank){const words=stripPunctuationWords(s.primaryAnswer).map((w,i)=>({id:i,word:w}));e.bank=shuffle(words);e.chosen=[]}const total=set.sentences.length,pct=((state.index+1)/total)*100;app.innerHTML=`<main class="exercise-shell"><header class="exercise-head"><div class="wrap"><div class="meta"><span>${set.title} · ${state.difficulty}</span><span>Sentence ${state.index+1} of ${total}</span></div><div class="progress" aria-label="Progress"><div class="bar" style="width:${pct}%"></div></div></div></header><section class="exercise-main"><div class="wrap"><article class="sentence-card"><p class="spanish">${esc(s.spanish)}</p><div id="exerciseUI"></div><div id="reveal" class="${e.showAnswer?'answer-reveal':'hidden'}"><strong>Answer:</strong> ${esc(s.primaryAnswer)}</div><div class="controls"><div><div id="feedback" class="feedback ${e.checked?(e.correct?'good':'bad'):''}" aria-live="polite">${e.checked?(e.correct?'Correct!':'Not quite. Try again.'):''}</div></div><div class="control-group"><button class="btn" id="prev" ${state.index===0?'disabled':''}>Previous sentence</button><button class="btn" id="backSets">Back to sets</button><button class="btn danger" id="restart">Restart set</button><button class="btn primary" id="check">Check answer</button><button class="btn" id="clear">${state.difficulty==='Easy'?'Reset':'Clear'}</button><button class="btn" id="alts" ${e.checked?'':'hidden'}>See alternatives</button><button class="btn primary" id="next">${state.index===total-1?'Finish set':'Next sentence'}</button></div></div><button class="btn ghost ${e.attempts>=2&&!e.correct&&!e.showAnswer?'':'hidden'}" id="showAns" style="margin-top:12px">Show answer</button></article></div></section></main>`;renderExerciseUI();bindExercise()}
function renderExerciseUI(){const s=sentence(),e=entry(),box=app.querySelector("#exerciseUI");if(state.difficulty==="Easy"){box.innerHTML=`<div class="answer-zone ${e.checked?(e.correct?'correct':'incorrect'):''}" aria-label="Built answer">${e.chosen.map((t,i)=>`<button class="word chosen" data-chosen="${i}">${esc(t.word)} <span class="move">↔</span></button>`).join("")||'<span style="color:var(--ep-muted)">Select words to build your answer.</span>'}</div><div class="word-bank" aria-label="Word bank">${e.bank.map((t,i)=>`<button class="word" data-bank="${i}">${esc(t.word)}</button>`).join("")}</div><p class="subtitle" style="font-size:.9rem">Tip: tap chosen words to return them. Use Shift+tap on a chosen word to move it left.</p>`;box.querySelectorAll("[data-bank]").forEach(b=>b.onclick=()=>{e.chosen.push(e.bank.splice(+b.dataset.bank,1)[0]);e.checked=false;renderExercise()});box.querySelectorAll("[data-chosen]").forEach(b=>b.onclick=ev=>{const i=+b.dataset.chosen;if(ev.shiftKey&&i>0){[e.chosen[i-1],e.chosen[i]]=[e.chosen[i],e.chosen[i-1]]}else e.bank.push(e.chosen.splice(i,1)[0]);e.checked=false;renderExercise()})}else if(state.difficulty==="Medium"){box.innerHTML=`<label class="sr-only" for="answerText">Complete the translation</label><div class="field-row"><span class="prompt" aria-label="Locked prompt">${esc(s.mediumPrompt)}...</span><input id="answerText" class="text-input medium-input" value="${esc(e.typed)}" autocomplete="off" placeholder="Complete the sentence"></div>`;box.querySelector("#answerText").oninput=ev=>e.typed=ev.target.value}else{box.innerHTML=`<label for="answerText" class="badge" style="margin-bottom:10px">Write the complete translation</label><textarea id="answerText" class="textarea hard-textarea ${e.checked?(e.correct?'correct':'incorrect'):''}" autocomplete="off" placeholder="Type your translation here">${esc(e.typed)}</textarea>`;box.querySelector("#answerText").oninput=ev=>{e.typed=ev.target.value;e.checked=false;e.correct=false}}}
function currentUserAnswer(){const s=sentence(),e=entry();if(state.difficulty==="Easy")return e.chosen.map(x=>x.word).join(" ");if(state.difficulty==="Medium")return `${s.mediumPrompt} ${e.typed}`.trim();return e.typed.trim()}
function bindExercise(){app.querySelector("#prev").onclick=()=>{if(state.index>0){state.index--;renderExercise()}};app.querySelector("#next").onclick=()=>{if(state.index>=setData().sentences.length-1)show("results");else{state.index++;renderExercise()}};app.querySelector("#backSets").onclick=goSets;app.querySelector("#restart").onclick=()=>confirmModal("Restart set?","This will erase your answers for this difficulty and set.",()=>{Object.keys(state.progress).forEach(k=>{if(k.startsWith(`${state.difficulty}-${state.setId}-`))delete state.progress[k]});state.index=0;renderExercise()});app.querySelector("#check").onclick=checkAnswer;app.querySelector("#clear").onclick=clearAnswer;app.querySelector("#alts").onclick=()=>showAlternatives(sentence());const sh=app.querySelector("#showAns");if(sh)sh.onclick=()=>{entry().showAnswer=true;renderExercise()}}

document.addEventListener("keydown",e=>{const typing=["INPUT","TEXTAREA"].includes(document.activeElement.tagName);if(e.key==="Escape")closeModal();if(typing)return;if(state.screen==="exercise"&&e.key==="Enter")checkAnswer();if(state.screen==="exercise"&&e.key==="ArrowLeft"&&state.index>0){state.index--;renderExercise()}if(state.screen==="exercise"&&e.key==="ArrowRight"){if(state.index<setData().sentences.length-1){state.index++;renderExercise()}else show("results")}});
