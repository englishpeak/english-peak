<style>
:root {

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  min-height: 100%;

  background: linear-gradient(135deg, var(--blue), var(--purple));
  color: var(--text);
}

#unscramble-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 42px 20px;
}

.container {
  max-width: 900px;
  margin: auto;
}

h1 {
  text-align: center;
  font-family: "Cormorant Garamond", Georgia, serif;
  font-size: 2.35rem;
  line-height: 1.1;
  margin-bottom: 10px;
  color: white;
}

.subtitle {
  text-align: center;
  color: var(--soft-text);
  margin-bottom: 24px;
}

.top-bar {
  display: flex;
  justify-content: center;
  margin-bottom: 24px;
}

.filter {
  position: relative;
}

.filter button,
button.action {
  background: var(--button);
  border: 1px solid rgba(255, 255, 255, 0.45);
  color: var(--button-text);
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  font-family: inherit;
}

.filter button:hover,
button.action:hover {
  background: white;
}

.filter-menu {
  position: absolute;
  top: 46px;
  left: 50%;
  transform: translateX(-50%);
  min-width: 150px;
  background: rgba(255, 255, 255, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.65);
  border-radius: 8px;
  padding: 12px;
  display: none;
  box-shadow: 0 18px 34px rgba(0, 0, 0, 0.24);
  z-index: 10;
}

.filter-menu label {
  display: block;
  color: #21304d;
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 7px;
  cursor: pointer;
}

.filter-menu label:last-child {
  margin-bottom: 0;
}

.card {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 12px;
  padding: 30px;
  box-shadow: 0 22px 55px rgba(0, 0, 0, 0.24);
}

.level-note {
  text-align: center;
  color: var(--soft-text);
  font-weight: 600;
  margin-bottom: 22px;
}

.blanks-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  margin-bottom: 28px;
}

.blanks {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.blank {
  min-width: 86px;
  min-height: 42px;
  padding: 10px 12px;
  text-align: center;
  border-bottom: 3px solid rgba(255, 255, 255, 0.82);
  color: white;
  font-weight: 700;
  cursor: pointer;
}

.blank:first-child {
  text-transform: capitalize;
}

.punctuation {
  font-size: 26px;
  font-weight: 800;
  color: white;
  margin-bottom: -8px;
}

.words {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.word {
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.92);
  color: #21304d;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 700;
  user-select: none;
  box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
}

.word:hover {
  background: white;
}

.controls {
  margin-top: 26px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
}

.feedback {
  text-align: center;
  font-weight: 800;
  margin-top: 18px;
  min-height: 24px;
}

.correct {
  color: #bbf7d0;
}

.incorrect {
  color: #fecaca;
}

@media (max-width: 640px) {
  #unscramble-wrap {
    padding: 30px 14px;
  }

  h1 {
    font-size: 2rem;
  }

  .card {
    padding: 22px 16px;
  }

  .blank {
    min-width: 72px;
  }
}
</style>
</head>

<body>
<div id="unscramble-wrap">
  <div class="container">
    <h1>❓ Unscramble the Questions</h1>
    <p class="subtitle">Put the words in the correct order to form a question.</p>

    <div class="top-bar">
      <div class="filter">
        <button type="button" onclick="toggleFilter()">Filter by level</button>
        <div class="filter-menu" id="filterMenu">
          <label><input type="checkbox" value="A1" checked onchange="loadQuestion()"> A1</label>
          <label><input type="checkbox" value="A2" checked onchange="loadQuestion()"> A2</label>
          <label><input type="checkbox" value="B1" checked onchange="loadQuestion()"> B1</label>
          <label><input type="checkbox" value="B2" checked onchange="loadQuestion()"> B2</label>
          <label><input type="checkbox" value="C1" checked onchange="loadQuestion()"> C1</label>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="level-note" id="levelNote"></div>
      <div class="blanks-wrapper">
        <div class="blanks" id="blanks"></div>
        <div class="punctuation" id="punctuation"></div>
      </div>
      <div class="words" id="words"></div>
      <div class="controls">
        <button class="action" type="button" onclick="checkAnswer()">Check answer</button>
        <button class="action" type="button" onclick="loadQuestion()">Next question</button>
      </div>
      <div class="feedback" id="feedback"></div>
    </div>
  </div>
</div>

  if (window.parent && window.parent !== window) {

      exerciseName: exerciseName,
      score: score,
      maxScore: maxScore

}

let currentQuestionParts = [];
let punctuationMark = "?";
let totalAnswers = 0;
let correctInBlock = 0;
let loggedSessions = 0;
const sessionSize = 5;

function toggleFilter() {
  const menu = document.getElementById("filterMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function getActiveLevels() {
  return Array.from(document.querySelectorAll(".filter-menu input:checked"))
    .map(function(checkbox) {
      return checkbox.value;
    });
}

function loadQuestion() {
  const activeLevels = getActiveLevels();
  const pool = questions.filter(function(question) {
    return activeLevels.includes(question.level);
  });

  if (!pool.length) {
    document.getElementById("levelNote").textContent = "Choose at least one level.";
    document.getElementById("blanks").innerHTML = "";
    document.getElementById("words").innerHTML = "";
    document.getElementById("punctuation").textContent = "";
    document.getElementById("feedback").textContent = "";
    return;
  }

  const chosen = pool[Math.floor(Math.random() * pool.length)];
  punctuationMark = chosen.text.slice(-1);
  currentQuestionParts = chosen.text.slice(0, -1).toLowerCase().split(" ");

  document.getElementById("levelNote").textContent = "Level: " + chosen.level;
  document.getElementById("punctuation").textContent = punctuationMark;
  document.getElementById("feedback").textContent = "";
  document.getElementById("feedback").className = "feedback";

  const blanks = document.getElementById("blanks");
  const words = document.getElementById("words");
  blanks.innerHTML = "";
  words.innerHTML = "";

  currentQuestionParts.forEach(function() {
    const blank = document.createElement("div");
    blank.className = "blank";
    blank.onclick = function() {
      if (blank.textContent) {
        addWord(blank.textContent.toLowerCase());
        blank.textContent = "";
      }
    };
    blanks.appendChild(blank);
  });

  shuffle(currentQuestionParts.slice()).forEach(function(word) {
    addWord(word);
  });
}

function addWord(word) {
  const wordButton = document.createElement("div");
  wordButton.className = "word";
  wordButton.textContent = word;
  wordButton.onclick = function() {
    placeWord(wordButton);
  };
  document.getElementById("words").appendChild(wordButton);
}

function placeWord(wordButton) {
  const blanks = document.querySelectorAll(".blank");

  for (let i = 0; i < blanks.length; i++) {
    if (!blanks[i].textContent) {
      blanks[i].textContent = wordButton.textContent;
      wordButton.remove();
      break;
    }
  }
}

function checkAnswer() {
  const attempt = Array.from(document.querySelectorAll(".blank"))
    .map(function(blank) {
      return blank.textContent.toLowerCase();
    })
    .join(" ");

  const feedback = document.getElementById("feedback");
  const isCorrect = attempt === currentQuestionParts.join(" ");

  if (isCorrect) {
    feedback.textContent = "Correct!";
    feedback.className = "feedback correct";
    correctInBlock++;
  } else {
    feedback.textContent = "Not quite. Try again!";
    feedback.className = "feedback incorrect";
  }

  totalAnswers++;
  if (totalAnswers % sessionSize === 0) {
    loggedSessions++;
    logActivity("Unscramble", "Questions Session " + loggedSessions, correctInBlock, sessionSize);
    correctInBlock = 0;
  }
}

function shuffle(items) {
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const temp = items[i];
    items[i] = items[j];
    items[j] = temp;
  }
  return items;
}
