<body style="margin:0;padding:0;background:#F0F4F8;">
<div id="english-flashcard-widget">
    <style>
        /* Estilos encapsulados para no afectar el resto de tu web en Hostinger */
        #english-flashcard-widget {
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F0F4F8; /* Fondo pastel inicial */
            transition: background-color 0.6s ease;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            border-radius: 12px;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        .fc-content {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Área de texto (Palabra y sinónimos) */
        .fc-text-area {
            text-align: center;
            opacity: 0; /* Oculto por defecto */
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            min-height: 80px; /* Mantiene el espacio aunque esté oculto */
            margin-bottom: 20px;
        }

        .fc-text-area.revealed {
            opacity: 1;
            visibility: visible;
        }

        .fc-main-word {
            color: #1a1a1a; /* Texto casi negro para contrastar con fondos claros */
            font-size: 42px;
            font-weight: 500;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .fc-also-text {
            color: #4a4a4a; /* Gris oscuro para los sinónimos */
            font-size: 14px;
            margin: 0;
        }

        /* Área del Emoji */
        .fc-emoji-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .fc-emoji {
            font-size: 110px;
            line-height: 1;
            user-select: none;
        }

        /* Controles (Botones y separador) */
        .fc-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .fc-btn {
            background: linear-gradient(90deg, #0D3B6F, #470074);
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.1s ease, filter 0.2s ease;
        }

        .fc-btn:hover {
            filter: brightness(1.2);
        }

        .fc-btn:active {
            transform: scale(0.95);
        }

        .fc-separator {
            color: #1a1a1a; /* Separador oscuro para que se vea en el fondo pastel */
            font-size: 24px;
            user-select: none;
        }

        /* Diseño Adaptativo para Celulares */
        @media (max-width: 600px) {
            #english-flashcard-widget {
                aspect-ratio: auto;
                min-height: 500px;
            }
            .fc-controls {
                flex-direction: column;
                gap: 10px;
            }
            .fc-separator {
                display: none; /* Ocultamos la línea divisoria en móvil */
            }
            .fc-btn {
                width: 100%;
                font-size: 18px;
            }
            .fc-emoji {
                font-size: 90px;
            }
        }
    </style>

        const synonymsEl = document.getElementById('fc-synonyms');

        const widgetContainer = document.getElementById('english-flashcard-widget');

        function revealEmojiText() {
            textArea.classList.add('revealed');
        }

        function generateNextEmoji() {
            // Ocultar texto
            textArea.classList.remove('revealed');

            // Elegir un emoji aleatorio diferente al actual
            let newIndex = currentCardIndex;
            while (newIndex === currentCardIndex) {
                newIndex = Math.floor(Math.random() * flashcardsData.length);
            }
            currentCardIndex = newIndex;

            // Elegir un color de fondo aleatorio diferente al actual
            let randomColor = backgroundColors[Math.floor(Math.random() * backgroundColors.length)];

            // Retraso ligero para que el texto se oculte antes de cambiar el contenido

                mainWordEl.innerText = card.word;
                synonymsEl.innerText = card.also;

            }, 300);
