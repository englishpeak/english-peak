    mc: [
      { q: "Long before the discovery of penicillin, ______ various plant extracts to treat infections.", o: ["ancient healers using", "when ancient healers used", "ancient healers who used", "ancient healers used"], a: 3, expl: "Main Clause Structure (B1): The sentence begins with a prepositional time phrase and requires a complete independent clause (Subject + Verb) to follow." },
      { q: "Mount Everest, ______, attracts hundreds of experienced mountaineers every spring.", o: ["is the world's highest peak", "where the world's highest peak", "the world's highest peak", "which the world's highest peak"], a: 2, expl: "Appositives (B2): A noun phrase set off by commas that renames the subject ('Mount Everest') functions as an appositive and does not require a verb." },
      { q: "______ primarily from volcanic rocks, the island's soil is exceptionally rich in minerals.", o: ["It was formed", "Formed", "Forming", "Formed it"], a: 1, expl: "Participle Phrases (B2): An initial past participle phrase ('Formed') acts as an adjective modifying the subject of the main clause ('the island's soil')." },
      { q: "Despite the rigorous testing phase, ______ guarantee that the software will function perfectly on all devices.", o: ["there is no", "is no", "no", "it has no"], a: 0, expl: "Expletives (B1): The dummy subject 'there' paired with the verb 'is' ('there is no') is required to indicate the existence (or lack thereof) of something." },
      { q: "The atmosphere of Venus is composed mainly of carbon dioxide and thick clouds ______ sulfuric acid.", o: ["they contain", "contained", "in which contain", "that contain"], a: 3, expl: "Relative Clauses (B1): The relative pronoun 'that' acts as the subject for the verb 'contain', properly modifying 'thick clouds'." },
      { q: "Dolphins navigate their underwater environments using echolocation, ______ bats.", o: ["so have", "similar", "as do", "which as"], a: 2, expl: "Comparisons and Similarity (C1): The formal structure 'as + auxiliary + subject' is used to show that a second subject performs the same action as the first." },
      { q: "The term 'symbiosis' generally refers to a situation ______ together in close association.", o: ["when two organisms living", "in which two organisms live", "that two organisms live", "two organisms live"], a: 1, expl: "Relative Clauses with Prepositions (B2): The preposition 'in' moves before the relative pronoun 'which' to describe a situation or environment." },
      { q: "Stalactites ______ mineral-rich water drips from the ceiling of a cave and leaves deposits.", o: ["form when", "when form", "they form when", "form that"], a: 0, expl: "Adverbial Clauses of Time (B1): The main verb 'form' must be followed by the conjunction 'when' to introduce the dependent clause explaining the timing." },
      { q: "The Rosetta Stone was the key artifact by which ancient Egyptian hieroglyphics ______.", o: ["finally deciphered", "had finally deciphered", "to be finally deciphered", "were finally deciphered"], a: 3, expl: "Passive Voice in Relative Clauses (B2): The hieroglyphics received the action of being deciphered, requiring the passive structure 'were deciphered'." },
      { q: "Cellular respiration is ______ generating usable energy from glucose.", o: ["for the process", "the process that", "the process for", "the process by"], a: 2, expl: "Prepositional Phrases (B1): The noun 'process' is idiomatically followed by the preposition 'for' and a gerund to describe its purpose." }
    ],
    ed: [
      { s: "One of the most important technological advancement of the 20th century was the invention of the microchip.", o: ["most important", "technological advancement", "century was", "invention of"], a: 1, expl: "Plural Nouns (B1): The phrase 'One of the' must always be followed by a plural noun ('advancements')." },
      { s: "Publishing in 1859, Charles Darwin's evolutionary theories fundamentally changed the way scientists view biological diversity.", o: ["Publishing", "evolutionary", "changed", "view"], a: 0, expl: "Participle Clauses (B2): The theories receive the action of being published. The passive past participle 'Published' is required, not the active gerund." },
      { s: "The new security protocol minimizes unauthorized access, protects sensitive data, and prevention network breaches.", o: ["new security", "minimizes", "protects", "prevention"], a: 3, expl: "Parallelism (B2): Items in a list must maintain grammatical symmetry. The noun 'prevention' must be changed to the present simple verb 'prevents' to match 'minimizes' and 'protects'." },
      { s: "Migratory birds rely on the Earth's magnetic field to navigate accurate across vast oceanic distances.", o: ["rely on", "magnetic field", "accurate", "oceanic"], a: 2, expl: "Adverbs (B1): An adverb is required to modify the action verb 'navigate'. The adjective 'accurate' must be changed to 'accurately'." },
      { s: "A catalyst is a chemical substance who increases the rate of a reaction without being consumed in the process.", o: ["chemical substance", "who", "rate", "consumed"], a: 1, expl: "Relative Pronouns (B1): The pronoun 'who' is exclusively for people. For inanimate objects ('a chemical substance'), 'which' or 'that' must be used." },
      { s: "The deep of the ocean dictates the specific types of marine life that can survive in that environment.", o: ["deep", "dictates", "types", "survive in"], a: 0, expl: "Word Form (B2): The sentence requires a noun as the subject. The adjective 'deep' must be changed to the noun 'depth'." },
      { s: "The primary function of red blood cells are to transport oxygen from the lungs to the rest of the body.", o: ["primary function", "are", "from", "the rest"], a: 1, expl: "Subject-Verb Agreement (B1): The true subject is 'function' (singular), not 'cells'. The verb must be 'is'." },
      { s: "The documentary series explores of the intricate relationship between urban development and wildlife conservation.", o: ["documentary", "explores of", "between", "conservation"], a: 1, expl: "Prepositions (B2): The verb 'explore' is transitive and takes a direct object. The preposition 'of' is redundant and ungrammatical." },
      { s: "Made from synthetic polymers, nylon possesses properties unique that make it ideal for manufacturing textiles.", o: ["Made from", "synthetic", "properties unique", "manufacturing"], a: 2, expl: "Adjective Order (A2): In English, adjectives must precede the noun they modify. It should be 'unique properties'." },
      { s: "There was in Philadelphia, Pennsylvania, that the Declaration of Independence was formally adopted in 1776.", o: ["There was", "that", "Independence", "formally adopted"], a: 0, expl: "Cleft Sentences / Expletives (B2): Emphatic cleft structures use the pronoun 'It' ('It was in Philadelphia... that...'), not the existential 'There'." }
    ]
  },

  26: {
    mc: [
      { q: "The committee has not yet decided ______ the new policy will be implemented next quarter.", o: ["that", "what", "whether", "which"], a: 2, expl: "Noun Clauses (B2): 'Whether' is used to introduce a noun clause expressing a choice, alternative, or uncertainty." },
      { q: "Not until the financial audit was completed ______ the true extent of the company's losses.", o: ["the board realized", "did the board realize", "the board had realized", "had the board realize"], a: 1, expl: "Negative Inversion (C1): Sentences starting with restrictive time phrases like 'Not until' require subject-auxiliary inversion in the main clause." },
      { q: "It is vital that every participant ______ a signed consent form before the clinical trial begins.", o: ["submits", "submitted", "submitting", "submit"], a: 3, expl: "Subjunctive Mood (C1): Adjectives of urgency like 'vital' require the base form of the verb ('submit') in the following 'that' clause." },
      { q: "The new architectural designs, ______ by a renowned international firm, will be unveiled tomorrow.", o: ["created", "were created", "creating", "which created"], a: 0, expl: "Reduced Relative Clauses (B2): The passive relative clause 'which were created' is properly reduced to the past participle 'created'." },
      { q: "The more thoroughly you prepare for the negotiation, ______ it is that you will achieve a favorable outcome.", o: ["most likely", "more likely", "the more likely", "the likely"], a: 2, expl: "Double Comparatives (B2): The structure requires 'The + comparative..., the + comparative...' to establish a parallel cause-and-effect relationship." },
      { q: "If the management team had invested in better infrastructure five years ago, the factory ______ efficiently today.", o: ["would operate", "operated", "will operate", "would have operated"], a: 0, expl: "Mixed Conditionals (C1): A past unreal condition ('had invested') affecting a present state ('today') requires 'would + base verb' in the result clause." },
      { q: "The ancient ruins are estimated ______ during the early Bronze Age.", o: ["to build", "building", "having built", "to have been built"], a: 3, expl: "Perfect Passive Infinitive (C1): To express a passive action completed before the time of the main verb ('are estimated'), use 'to have been + past participle'." },
      { q: "The marketing director had the graphic designer ______ the entire promotional brochure before the launch.", o: ["to redesign", "redesign", "redesigned", "redesigning"], a: 1, expl: "Causative Verbs (B2): The active causative structure 'have + person + base verb' is used when assigning a task to someone." },
      { q: "______ by the unexpected drop in sales, the executive board called an emergency meeting.", o: ["Alarmed", "Alarming", "To alarm", "Having alarm"], a: 0, expl: "Participle Phrases (B2): A past participle ('Alarmed') functions as an adjective indicating that the subject ('the executive board') received the feeling." },
      { q: "The city council strongly objected ______ the historic library to make way for a commercial complex.", o: ["to demolish", "demolish", "to demolishing", "for demolishing"], a: 2, expl: "Prepositional Verbs (C1): The verb phrase 'object to' uses 'to' as a preposition, which must strictly be followed by a gerund (-ing)." }
    ],
    ed: [
      { s: "The new wellness program encourages employees to eat healthily, exercise regularly, and getting enough sleep every night.", o: ["encourages", "to eat", "exercise", "getting"], a: 3, expl: "Parallelism (B2): Items in a series must maintain grammatical symmetry. 'getting' should be the bare infinitive 'get' to match 'eat' and 'exercise'." },
      { s: "The research team conducted the experiment very careful to avoid contaminating the delicate chemical samples.", o: ["conducted", "very careful", "to avoid", "contaminating"], a: 1, expl: "Adverbs (B1): An adverb is required to modify the action verb 'conducted'. The adjective 'careful' must be changed to 'carefully'." },
      { s: "The widespread use of artificial fertilizers have significantly altered the soil composition in the agricultural region.", o: ["widespread use", "artificial", "have", "altered"], a: 2, expl: "Subject-Verb Agreement (B2): The true subject of the sentence is 'use' (singular). The verb must be 'has', regardless of the plural noun in the prepositional phrase." },
      { s: "The professor provided several valuable advices regarding the publication of the final thesis.", o: ["valuable advices", "regarding", "publication of", "final thesis"], a: 0, expl: "Count/Uncount Nouns (B1): 'Advice' is an uncountable noun in English. It cannot be pluralized with an 's' or modified directly by 'several'." },
      { s: "By the time the rescue helicopters reached the stranded climbers, the severe storm already passed.", o: ["By the time", "reached", "stranded", "already passed"], a: 3, expl: "Past Perfect (B2): An action that was completed before a second past action ('reached') requires the past perfect tense ('had already passed')." },
      { s: "The newly upgraded servers are much more faster than the previous generation of hardware.", o: ["newly upgraded", "much", "more faster", "previous generation"], a: 2, expl: "Comparative Structures (B1): 'Faster' is already a comparative adjective. Adding 'more' creates an ungrammatical double comparative." },
      { s: "The regional manager is fully responsible of overseeing the daily operations of the flagship retail store.", o: ["regional manager", "is fully", "responsible of", "overseeing"], a: 2, expl: "Dependent Prepositions (B2): The adjective 'responsible' is idiomatically followed by the preposition 'for', not 'of'." },
      { s: "The complex software algorithm which the engineering team developed it last year has increased overall productivity.", o: ["complex software", "which the", "engineering team", "developed it"], a: 3, expl: "Intrusive Pronouns (B2): The relative pronoun 'which' already functions as the object of the clause. Adding 'it' is an ungrammatical repetition." },
      { s: "There was in 1969 that astronauts first walked on the surface of the moon during the Apollo 11 mission.", o: ["There was", "that", "first walked", "surface"], a: 0, expl: "Cleft Sentences (B2): Emphatic cleft structures highlighting a specific time or place require the dummy pronoun 'It' ('It was in 1969 that...'), not 'There'." },
      { s: "All sensitive medical records must securely store in the encrypted database to ensure patient privacy.", o: ["sensitive", "must securely store", "encrypted", "to ensure"], a: 1, expl: "Passive Modals (B2): The records receive the action (they do not store things themselves), requiring the passive layout 'must be securely stored'." }
    ]
  }



};

// ---------------- STATE & LOGIC ----------------

let currentTest = 1;
let index = 0;        
let score = 0;
let mistakes = []; 
let startTime;
let timerInterval;
let magicMode = false;
const magicColors = ["#F9D9D8", "#FCEED9", "#EBFEDB", "#DFFEEB", "#E5DFFF"];

function startTest(testNum) {
  currentTest = testNum;
  index = 0;
  score = 0;
  mistakes = [];
  startTime = Date.now();
  startTimerUI();
  render();
}

function startTimerUI() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    const display = document.getElementById("timer-display");
    if (display) display.innerText = `Time: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }, 1000);
}

function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

// Test 22 onward: place the four selectable error segments inside the sentence.
// Earlier tests continue to use the original multiple-choice presentation.
function renderInlineErrorSentence(q) {
  const matches = [];
  let searchFrom = 0;

  q.o.forEach((option, optionIndex) => {
    const start = q.s.indexOf(option, searchFrom);
    if (start === -1) return;
    matches.push({ start, end: start + option.length, option, optionIndex });
    searchFrom = start + option.length;
  });

  // Fall back to the existing layout if a future item does not contain all
  // four marked phrases verbatim in its sentence.
  if (matches.length !== q.o.length) return null;

  let cursor = 0;
  let html = "";
  matches.forEach(match => {
    html += escapeHTML(q.s.slice(cursor, match.start));
    const letter = String.fromCharCode(65 + match.optionIndex);
    html += `<button type="button" class="error-segment" aria-label="Option ${letter}: ${escapeHTML(match.option)}" onclick="check(${match.optionIndex}, ${q.a}, this)"><span class="error-label">(${letter})</span> ${escapeHTML(match.option)}</button>`;
    cursor = match.end;
  });
  html += escapeHTML(q.s.slice(cursor));
  return html;
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `<div id="timer-display">Time: 0:00</div>`;

  if (index === 20) {
    clearInterval(timerInterval);
    const totalTimeSec = Math.floor((Date.now() - startTime) / 1000);
    const avgTime = (totalTimeSec / 20).toFixed(1);

    let reviewHTML = "";
    if (mistakes.length > 0) {
      reviewHTML = `<div class="section-title">Mistake Review</div>`;
      mistakes.forEach(m => {
        const qText = m.q.q || m.q.s;
        const userChoice = m.q.o[m.userIdx];
        const correctChoice = m.q.o[m.q.a];
        reviewHTML += `
          <div class="review-card">
            <span class="review-q">${qText}</span>
            <div class="review-detail">
              <span class="wrong-text">Your Answer:</span> ${String.fromCharCode(97+m.userIdx)}. ${userChoice}<br>
              <span class="correct-text">Correct Answer:</span> ${String.fromCharCode(97+m.q.a)}. ${correctChoice}<br><br>
              <strong>Why?</strong> ${m.q.expl || "Explanation coming soon."}
            </div>
          </div>`;
      });
    } else {
      reviewHTML = `<p style="text-align:center;">🎯 Perfect Score!</p>`;
    }

    app.innerHTML = `
      <h2>🎉 Test Complete!</h2>
      <div class="stats-box">
        <div>Score: ${score}/20</div>
        <div>Total Time: ${Math.floor(totalTimeSec/60)}m ${totalTimeSec%60}s</div>
        <div>Avg: ${avgTime}s/q</div>
      </div>
      <div id="_itp_saved_msg"></div>
      ${reviewHTML}
      <button class="next-btn" onclick="backToMenu()">⬅ Back to Main Menu</button>
    `;

    // Report score to parent platform — before rendering so it fires even if render errors
    let _reported = false;
    if (window.parent && window.parent !== window) {
      try {
        window.parent.postMessage({
          type: 'exerciseComplete',
          exerciseType: _exerciseMode === 'general' ? 'General English' : 'TOEFL ITP',
          exerciseName: 'Test ' + currentTest,
          score: score,
          maxScore: 20
        }, window.location.origin);
        _reported = true;
      } catch(e) { console.error('postMessage error:', e); }
    }
    var savedMsg = document.getElementById('_itp_saved_msg');
    if (savedMsg) savedMsg.innerHTML = _reported
      ? '<p style="text-align:center;color:#1a7a4a;font-weight:600;font-size:0.9rem;">✅ Progress saved to My Progress</p>'
      : '';

    // Ensures the background reverts to white for the results screen
    applyMagicColor(); 
    return;
  }

  const currentData = tests[currentTest];
  const q = (index < 10) ? currentData.mc[index] : currentData.ed[index - 10];
  const text = q.q || q.s;
  const opts = q.o;
  const correct = q.a;

  const useInlineErrorDetection = currentTest >= 22 && index >= 10;
  const inlineSentence = useInlineErrorDetection ? renderInlineErrorSentence(q) : null;

  if (inlineSentence !== null) {
    app.innerHTML += `
      <div class="section-title">Error Detection</div>
      <div class="error-sentence">${inlineSentence}</div>
      <div class="footer">Question ${index + 1} of 20</div>
    `;
  } else {
    app.innerHTML += `
      <div class="section-title">${index < 10 ? "Multiple Choice" : "Error Detection"}</div>
      <div class="question">${text}</div>
      <div class="options">
        ${opts.map((o,i)=>`<button onclick="check(${i}, ${correct}, this)">${String.fromCharCode(97+i)}. ${o}</button>`).join("")}
      </div>
      <div class="footer">Question ${index + 1} of 20</div>
    `;
  }

  // CRITICAL: This is now safely at the very bottom, applying colors AFTER buttons exist
  applyMagicColor();
}

function check(choice, correct, btn) {
  const currentData = tests[currentTest];
  const qObj = (index < 10) ? currentData.mc[index] : currentData.ed[index - 10];
  
  document.querySelectorAll(".options button, .error-segment").forEach(b=>b.disabled=true);

  if (choice === correct) {
    score++;
    btn.classList.add("correct-choice");
    document.getElementById("app").innerHTML += `<div class="feedback">✅ Correct</div>`;
  } else {
    btn.classList.add("incorrect-choice");
    mistakes.push({ q: qObj, userIdx: choice });
    document.getElementById("app").innerHTML += `<div class="feedback">❌ Incorrect</div>`;
  }

  if (index === 9) {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="showTransition()">Next Section</button>`;
  } else if (index === 19) {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="index++; render()">Show Results</button>`;
  } else {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="index++; render()">Next Question</button>`;
  }
}

function showTransition() {
  index = 10;
applyMagicColor();
  document.getElementById("app").innerHTML = `
    <div id="timer-display"></div>
    <div class="question" style="text-align:center; margin-top:50px;">Ready for Section 2:<br><strong>Error Detection</strong></div>
    <button class="next-btn" onclick="render()">Start Section</button>
  `;
}

function backToMenu() {
  clearInterval(timerInterval);
  index = -1; applyMagicColor();
  var app = document.getElementById("app");
  app.innerHTML = '<div class="section-title">Select a Test</div>';
  Object.keys(tests).map(Number).sort(function(a,b){return a-b;}).forEach(function(num) {
    var btn = document.createElement('button');
    btn.className = 'next-btn'; btn.style.marginBottom = '10px';
    var isLocked = _allowedTests.indexOf(num) === -1;
    if (isLocked) {
      btn.textContent = '🔒 Test ' + num;
      btn.style.opacity = '0.45'; btn.style.background = '#888';
      btn.onclick = function(e) { e.preventDefault(); notifyUpgrade(); };
    } else {
      btn.textContent = 'Test ' + num;
      btn.onclick = (function(n){ return function(){ startTest(n); }; })(num);
    }
    app.appendChild(btn);
  });
}

_buildITPMenu();
function toggleMagicMode() {
  magicMode = !magicMode;
  const btn = document.getElementById("magic-toggle");
  if (magicMode) {
    btn.classList.add("active");
  } else {
    btn.classList.remove("active");
  }
  applyMagicColor();
}

function applyMagicColor() {
  if (magicMode && index >= 0 && index < 20) {
    // 1. Grab the specific color for this question
    const currentColor = magicColors[index % magicColors.length];
    
    // 2. Paint the background
    document.body.style.backgroundColor = currentColor;
    
    // 3. Paint the buttons the exact same color
    const optionBtns = document.querySelectorAll(".options button, .error-segment");
    optionBtns.forEach(btn => {
      btn.style.backgroundColor = currentColor;
    });
  } else {
    // Revert everything to white if the wand is off or we are on a menu
    document.body.style.backgroundColor = "#ffffff";
    const optionBtns = document.querySelectorAll(".options button, .error-segment");
    optionBtns.forEach(btn => {
      btn.style.backgroundColor = "#ffffff";
    });
  }  
}
</script>
