

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOEFL Practice Sessions</title>

<style>
body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; position: relative; transition: background-color 0.5s ease; }
header { background: #0D3B6F; color: white; padding: 30px; text-align: center; font-size: 32px; font-weight: bold; }
.container { max-width: 800px; margin: 50px auto; padding: 20px; position: relative; border: 1px solid #eee; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);max-height: 80vh; 
  overflow-y: auto; }
.section-title { font-size: 18px; color: #0D3B6F; text-align: center; margin-bottom: 30px; }
.question { font-size: 26px; margin-bottom: 35px; }
.options button { display: block; width: 100%; padding: 14px; margin-bottom: 12px; font-size: 18px; cursor: pointer; transition: 0.2s; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
.options button:hover:not(:disabled) { background: #f0f0f0; }
.error-sentence { font-size: 24px; line-height: 2.15; margin-bottom: 28px; }
.error-segment {
  display: inline;
  padding: 5px 7px;
  margin: 0 2px;
  font: inherit;
  line-height: inherit;
  color: inherit;
  background: #fff;
  border: 1px solid #b8c2cc;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s;
  box-decoration-break: clone;
  -webkit-box-decoration-break: clone;
}
.error-segment:hover:not(:disabled), .error-segment:focus-visible {
  background: #eef2f7;
  border-color: #0D3B6F;
  outline: none;
}
.error-label { color: #0D3B6F; font-weight: 700; }
.error-segment.correct-choice .error-label,
.error-segment.incorrect-choice .error-label { color: inherit; }
.error-segment:disabled { cursor: default; opacity: 1; }
.correct-choice { background-color: #2e7d32 !important; color: white; border-color: #1b5e20; }
.incorrect-choice { background-color: #c62828 !important; color: white; border-color: #b71c1c; }
.feedback { font-size: 20px; margin-top: 20px; text-align: center; font-weight: bold; }
.next-btn { margin: 30px auto 0; padding: 14px 28px; font-size: 18px; cursor: pointer; background: #470074; color: white; border: none; border-radius: 6px; display: block; }
.footer { margin-top: 40px; text-align: center; color: #555; font-size: 14px; }

/* Timer Style */
#timer-display { position: absolute; top: 10px; right: 20px; font-size: 16px; color: #666; font-family: monospace; }

/* Review Styling */
.review-card { background: #f9f9f9; border-left: 5px solid #c62828; padding: 15px; margin-bottom: 20px; text-align: left; border-radius: 4px; }
.review-q { font-weight: bold; font-size: 18px; margin-bottom: 10px; display: block; }
.review-detail { font-size: 15px; line-height: 1.5; color: #333; }
.correct-text { color: #2e7d32; font-weight: bold; }
.wrong-text { color: #c62828; font-weight: bold; }
.stats-box { background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 30px; display: flex; justify-content: space-around; font-weight: bold; color: #0D3B6F; }

#magic-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #fff;
  border: 2px solid #ccc;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  z-index: 1000;
  transition: 0.3s;
}
#magic-toggle.active {
  border-color: #470074;
  background: #eef2f7;
  box-shadow: 0 0 10px rgba(71, 0, 116, 0.5);
}
</style>

<style>
/* Responsive overrides */
@media (max-width: 768px) {
  header { font-size: 22px; padding: 18px; }
  .container { margin: 15px; padding: 15px; max-height: none; }
  .question { font-size: 20px; }
  .error-sentence { font-size: 19px; line-height: 2.25; }
  .options button { font-size: 16px; padding: 12px; }
  .next-btn { font-size: 16px; padding: 12px 24px; }
  .stats-box { flex-direction: column; gap: 8px; text-align: center; }
  #magic-toggle { width: 42px; height: 42px; font-size: 20px; }
}
@media (max-width: 480px) {
  header { font-size: 18px; padding: 14px; }
  .question { font-size: 17px; }
  .error-sentence { font-size: 17px; }
  .options button { font-size: 15px; }
}
</style>
<script>
var _allowedTests = [1, 2, 3];
var _exerciseMode = 'itp';
function notifyUpgrade() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({type:'showModal'}, window.location.origin);
  } else {
    window.location.href = '/';
  }
}
(function() {
  var params = new URLSearchParams(window.location.search);
  var allowedParam = params.get('allowed');
  if (allowedParam) _allowedTests = allowedParam.split(',').map(Number);
  if (params.get('mode') === 'general') _exerciseMode = 'general';
})();
function _buildITPMenu() {
  var menuDiv = document.getElementById('menu');
  if (!menuDiv) return;
  menuDiv.innerHTML = '<div class="section-title">Select a Test</div>';
  Object.keys(tests).map(Number).sort(function(a,b){return a-b;}).forEach(function(num) {
    var btn = document.createElement('button');
    btn.className = 'next-btn'; btn.style.marginBottom = '10px';
    var isLocked = _allowedTests.indexOf(num) === -1;
    if (isLocked) {
      btn.textContent = '🔒 Test ' + num;
      btn.style.opacity = '0.45'; btn.style.background = '#888';
      btn.onclick = function(e) { e.preventDefault(); notifyUpgrade(); };
    } else {
      btn.textContent = 'Test ' + num;
      btn.onclick = (function(n){ return function(){ startTest(n); }; })(num);
    }
    menuDiv.appendChild(btn);
  });
}
</script>
</head>

    ed: [
      { s: "Despite the heavy rain, neither of the delivery drivers were delayed on their routes.", o: ["Despite", "neither of", "were", "on their"], a: 2, expl: "Subject-Verb Agreement: 'Neither of' followed by a plural noun takes a singular verb. It should be 'was delayed'." },
      { s: "My morning routine? Well I used to wake up at 6 am. I have breakfast and take a shower. Then I’ll listen to a podcast or something on my way to work.", o: ["morning routine", "used to wake up", "have breakfast", "I’ll listen"], a: 1, expl: "Habits: 'Used to' describes a past habit. Since the context describes a current morning routine, the present simple ('usually wake up') is needed." },
      { s: "We didn’t know you were in town! Richard would invite you if he had known you were here!", o: ["didn’t know", "in town", "would invite", "if he had known"], a: 2, expl: "Third Conditional: A past unreal situation requires 'would have + past participle' in the result clause ('would have invited')." },
      { s: "The marketing team has finished the annual report yesterday evening just before the office closed.", o: ["has finished", "annual report", "just before", "closed"], a: 0, expl: "Past Simple vs. Present Perfect: The specific past time marker 'yesterday evening' requires the Past Simple ('finished')." },
      { s: "The new software updates run incredible smoothly on the older operating systems.", o: ["updates", "incredible", "smoothly", "older"], a: 1, expl: "Adverbs: An adverb is needed to modify another adverb ('smoothly'). It should be 'incredibly'." },
      { s: "The job requires managing social media, writing blog posts, and to coordinate with influencers.", o: ["requires", "managing", "writing", "to coordinate"], a: 3, expl: "Parallelism: Items in a series must be grammatically parallel. It should be the gerund 'coordinating'." },
      { s: "The manager was very impression by the candidate's extensive experience and fluent communication skills.", o: ["impression", "candidate's", "extensive", "fluent"], a: 0, expl: "Word Form: An adjective (past participle) is needed after the linking verb 'was'. It should be 'impressed'." },
      { s: "The more time you spend practicing the presentation, the least nervous you will feel on stage.", o: ["The more time", "practicing", "the least", "will feel"], a: 2, expl: "Double Comparatives: The structure is 'The + comparative... the + comparative'. It should be 'the less nervous'." },

      { s: "The instructions provided by the manufacturer were too much complicated for a beginner to understand.", o: ["provided by", "too much", "complicated", "to understand"], a: 1, expl: "Intensifiers: Use 'too' to modify an adjective ('complicated'). 'Too much' is used to modify nouns." }

  12: {

      { q: "The documentary features interviews with several scientists, most of ______ are leading experts in climate change.", o: ["which", "who", "whom", "them"], a: 2, expl: "Relative Clauses: When using quantifiers like 'most of' or 'some of' before a relative pronoun referring to people, 'whom' is required." },

      { q: "Monica eats and exercises regularly, but most of her sisters _________.", o: ["didn’t", "aren’t", "haven’t", "don’t"], a: 3, expl: "Auxiliary Verbs / Ellipsis: The first clause is in the present simple ('eats and exercises'), so the contrasting clause must use the present simple auxiliary 'don't'." },
      { q: "Marcos and Karla are going to _______ Germany or France.", o: ["whether", "nor", "either", "also"], a: 2, expl: "Correlative Conjunctions: 'Either' pairs with 'or' to present a choice between two alternatives." },

      { q: "Researchers are still trying to determine exactly ______ the ancient civilization managed to build such massive structures.", o: ["how did", "how", "the way how", "that how"], a: 1, expl: "Noun Clauses: Embedded questions act as the object of the verb and require statement word order, simply starting with the question word 'how'." }

      { s: "One of the biggest advantages of eating organic food is that is free of pesticides and chemicals.", o: ["the biggest", "advantages of", "eating organic food", "that is free of"], a: 3, expl: "Noun Clauses / Missing Subject: A noun clause requires a subject. It must be 'that IT is free of' (referring to the food)." },
      { s: "Two-words phrasal verbs are way more common than three-word ones. It's still important to know them, though.", o: ["Two-words phrasal verbs", "way more common", "three-word ones", "though"], a: 0, expl: "Compound Adjectives: When a number and a noun form a hyphenated adjective before another noun, the noun must be singular ('Two-word')." },
      { s: "There's a sale on the clothing store today. It's such a shame that I don't like to use those kinds of jeans.", o: ["a sale", "clothing store", "such a shame", "use"], a: 3, expl: "Vocabulary / Collocations: In English, you 'wear' clothing, jewelry, and perfume; you do not 'use' them." },
      { s: "The marketing team succeeded to launch the new advertising campaign a week ahead of the scheduled deadline.", o: ["succeeded", "to launch", "ahead of", "scheduled"], a: 1, expl: "Verb Patterns: The verb 'succeed' must be followed by the preposition 'in' plus a gerund ('in launching')." },
      { s: "Despite of the overwhelming evidence presented during the trial, the jury deliberated for several days before reaching a verdict.", o: ["Despite of", "presented", "deliberated for", "before reaching"], a: 0, expl: "Prepositions: The correct preposition is either 'Despite' (without 'of') or 'In spite of'." },
      { s: "The newly developed battery technology is significantly more better than anything previously available on the market.", o: ["newly developed", "significantly", "more better", "previously available"], a: 2, expl: "Comparatives: 'Better' is already the comparative form of 'good'. Adding 'more' creates an incorrect double comparative." },

      { s: "If the software developers caught the bug during the initial testing phase, the system would not have crashed yesterday.", o: ["caught", "during", "would not have crashed", "yesterday"], a: 0, expl: "Third Conditional: A past unreal condition requires the past perfect tense in the 'if' clause ('had caught')." },
      { s: "The vast majority of the information available on these websites are completely unverified and potentially misleading.", o: ["vast majority", "available on", "are", "potentially misleading"], a: 2, expl: "Subject-Verb Agreement: The subject 'information' is an uncountable noun and therefore takes a singular verb ('is')." },

  13: {
    mc: [

      { q: "You ____ the supervisor before changing the project parameters yesterday.", o: ["should consult", "ought to consult", "should have consulted", "must have consulted"], a: 2, expl: "Past Modals (B2/C1): To express criticism or regret about a past action that didn't happen, use 'should have + past participle'." },
      { q: "He’s been working ______ a teacher for 10 years.", o: ["in", "to", "like", "as"], a: 3, expl: "Prepositions (B1): Use 'as' to talk about a person's actual job, role, or function. 'Like' is used for comparisons." },
      { q: "We’re ______ late for the meeting, hurry up please!", o: ["running", "going", "arriving", "being"], a: 0, expl: "Collocations (B1): In English, the standard idiomatic expression for being behind schedule is 'running late'." },
      { q: "Poor sleep habits are often linked ____ low energy during the day.", o: ["up", "for", "to", "at"], a: 2, expl: "Dependent Prepositions (B2): The verb 'link' is consistently followed by the preposition 'to' when showing a connection." },
      { q: "The company decided to ____ by a professional design agency.", o: ["have its logo redesigned", "have redesigned its logo", "get its logo redesign", "make its logo redesigned"], a: 0, expl: "Causatives (B2): To express that you arranged for someone else to do a service for you, use 'have + object + past participle'." },
      { q: "We have arrived ______ Spain!", o: ["in", "to", "at", "on"], a: 0, expl: "Prepositions of Place (B1): Use 'arrive in' for countries, cities, and large regions. Use 'arrive at' for specific buildings or events." },
      { q: "The lecture on quantum mechanics was ____ complicated that most students gave up taking notes.", o: ["too", "such", "so", "very"], a: 2, expl: "Intensifiers (B1/B2): Use the structure 'so + adjective + that' to express a cause and its subsequent result." },
      { q: "The conference room, ____ the annual board meeting was held, lacked proper ventilation.", o: ["which", "in that", "where", "in where"], a: 2, expl: "Relative Adverbs (B2): Use 'where' to refer to a physical location. It replaces 'in which'." }
    ],
    ed: [
      { s: "Sometimes I think about all the mistakes I’ve made. I wish I can go back in time and change a few things.", o: ["Sometimes I", "the mistakes I’ve made", "I wish I can", "a few things"], a: 2, expl: "Wishes (B2): To express a wish about a present or future unreality, the modal 'can' must shift back to 'could' ('wish I could')." },
      { s: "It’s so frustrated working with Mark sometimes. I tried talking to him calmly, which I did do! I don’t know how to cope with him!", o: ["so frustrated", "tried talking", "I did do", "cope with him"], a: 0, expl: "-ED vs -ING Adjectives (B1): '-ed' adjectives describe feelings. '-ing' adjectives describe the cause of the feeling. The situation is 'frustrating'." },
      { s: "The laboratory recently purchased several new equipments to improve the accuracy of its chemical analyses.", o: ["recently purchased", "several new equipments", "to improve", "its chemical"], a: 1, expl: "Uncountable Nouns (B1/B2): 'Equipment' is an uncountable noun. It cannot be pluralized with an 's' or directly preceded by 'several'." },
      { s: "The new software update processes data significant faster than the previous version.", o: ["update", "processes", "significant", "previous"], a: 2, expl: "Adverbs (B1): An adverb is required to modify the comparative adjective 'faster'. It must be 'significantly'." },
      { s: "If a student wants to succeed in this intensive course, they must submit all of his assignments on time.", o: ["wants to succeed", "in this", "must submit", "his"], a: 3, expl: "Pronoun Agreement (B2): The singular 'they' is used as the subject, so the possessive pronoun later in the sentence must match ('their assignments')." },
      { s: "Did I tell you that Samantha is really good at what she do?", o: ["Did I tell you", "Samantha is", "good at", "she do"], a: 3, expl: "Subject-Verb Agreement (A2/B1): The third-person singular pronoun 'she' requires the verb 'does', not 'do'." },
      { s: "I felt kind of uncomfortable at the party. I would appreciate that you don’t say that again.", o: ["kind of uncomfortable", "at the party", "appreciate that", "don’t say that again"], a: 2, expl: "Verb Patterns (C1): 'Appreciate' cannot be followed by a 'that' clause in this way. The correct polite structure is 'I would appreciate it if you didn't...' or 'appreciate your not saying'." },

      { s: "After the meeting concluded, the executives returned back to their respective offices to review the quarterly reports.", o: ["concluded", "returned back", "respective", "to review"], a: 1, expl: "Redundancy (B2): The prefix 're-' in 'return' already means 'to go back'. Adding 'back' creates an unnecessary redundancy." },
      { s: "The IT technician asked me what was the problem with the network server.", o: ["asked me", "what", "was the problem", "with the"], a: 2, expl: "Indirect Questions (B2): Embedded questions do not use question word order. They require statement order (Subject + Verb): 'what the problem was'." }

  14: {

      { q: "____ from the hilltop, the valley looks incredibly beautiful during the autumn months.", o: ["Seen", "Seeing", "Saw", "See"], a: 0, expl: "Participle Phrases (B2): The passive past participle 'Seen' is used because the subject of the main clause (the valley) receives the action (it is seen)." },
      { q: "The new intern is highly motivated but doesn't have ____ to lead the international project yet.", o: ["experience enough", "enough experience", "many experience", "the enough experience"], a: 1, expl: "Word Order (B1): The quantifier 'enough' must be placed directly before a noun (enough experience) but after an adjective (good enough)." },
      { q: "Many residents strongly object ____ such a hefty fee for a parking service that is usually free.", o: ["to pay", "paying", "to paying", "for paying"], a: 2, expl: "Prepositional Verbs (C1): The phrase 'object to' uses 'to' as a preposition, not an infinitive marker. Therefore, it must be followed by a gerund (-ing)." },
      { q: "If the investors had approved the budget last week, the marketing team ____ the new campaign right now.", o: ["will launch", "would be launching", "would have launched", "launched"], a: 1, expl: "Mixed Conditionals (C1): A past unreal condition ('had approved') causing a present unreal result requires 'would + be + verb-ing' ('would be launching right now')." },
      { q: "____ the ancient civilization managed to transport the massive stones remains a mystery to archaeologists.", o: ["How", "What", "That", "Why did"], a: 0, expl: "Noun Clauses (B2): 'How' acts as the subject of the main verb 'remains'. Embedded questions use statement word order." },
      { q: "____ I want to do after this grueling week of final exams is sleep for twelve hours straight.", o: ["What", "That", "The thing", "All"], a: 3, expl: "Cleft Sentences (B2): 'All' can be used to mean 'The only thing that' in a cleft sentence to add emphasis." },
      { q: "Let’s review the quarterly financial reports before the board meeting begins, ____?", o: ["don't we", "shall we", "will we", "aren't we"], a: 1, expl: "Question Tags (B2): Sentences starting with the imperative 'Let's' (Let us) always take the tag 'shall we?'." },
      { q: "Before signing the agreement, we must ____ sure that all the legal requirements are met.", o: ["make", "do", "get", "take"], a: 0, expl: "Collocations (B1): In English, the correct idiomatic verb to use with 'sure' or 'certain' is 'make'." },
      { q: "The factory installed a new automated assembly line ____ the production process and reduce costs.", o: ["for speeding up", "to speed up", "speeding up", "to speeding up"], a: 1, expl: "Infinitives of Purpose (B1): To express the reason or purpose for doing something, use the to-infinitive ('to speed up')." },
      { q: "The hotel receptionist could not confirm ____ included in the standard room rate.", o: ["whether breakfast was", "whether was breakfast", "if was breakfast", "that breakfast was it"], a: 0, expl: "Embedded Questions (B2): Noun clauses embedded as objects lose their question word order and follow the standard Subject + Verb structure." }

      { s: "The amount of students enrolled in the advanced robotics course has doubled since last semester.", o: ["amount", "enrolled in", "has doubled", "since"], a: 0, expl: "Quantifiers (B1): 'Amount' is used for uncountable nouns. For plural countable nouns like 'students', use 'The number of'." },
      { s: "I will never forget to visit the Eiffel Tower for the first time when I was ten years old.", o: ["will never forget", "to visit", "for the first time", "when I was"], a: 1, expl: "Gerunds vs Infinitives (B2): 'Forget/Remember + gerund (-ing)' refers to a past memory. 'To visit' implies forgetting to do a future task. It should be 'visiting'." },
      { s: "A comprehensive collection of rare manuscripts and historical documents are currently on display at the university library.", o: ["comprehensive collection", "rare manuscripts", "are", "currently on display"], a: 2, expl: "Subject-Verb Agreement (B2): The true subject is the singular noun 'collection'. The prepositional phrase 'of rare manuscripts...' does not change it. Use 'is'." },
      { s: "The comprehensive report which the committee published it last week highlighted several critical issues.", o: ["comprehensive", "which", "published it", "highlighted"], a: 2, expl: "Intrusive Pronouns (B2): The relative pronoun 'which' already acts as the object. The additional pronoun 'it' is redundant and ungrammatical." },
      { s: "Neither the CEO or the board members were aware of the accounting errors until the independent audit was conducted.", o: ["or", "were aware of", "until", "was conducted"], a: 0, expl: "Correlative Conjunctions (B1): 'Neither' must always be paired with 'nor'. 'Either' is paired with 'or'." },
      { s: "The lead engineer who designed the new software architecture, he is going to deliver the keynote speech at the tech summit.", o: ["who designed", "architecture", "he", "to deliver"], a: 2, expl: "Redundant Subjects (B1): The subject 'The lead engineer' is already established. Adding the pronoun 'he' right before the main verb is redundant." },
      { s: "The detective realized that the suspect has left the building long before the police officers arrived at the scene.", o: ["realized", "has left", "long before", "arrived at"], a: 1, expl: "Past Perfect (B2): An action that was completed ('had left') prior to another action in the past ('realized / arrived') requires the Past Perfect." },

      { s: "The new safety regulations must strictly enforced by all department managers starting next Monday.", o: ["safety regulations", "must strictly enforced", "all department", "starting"], a: 1, expl: "Passive Modals (B2): The passive voice with a modal verb requires the pattern 'modal + be + past participle'. It should be 'must be strictly enforced'." }

  15: {

      { q: "I didn’t like the first design, that’s ______ I didn’t hire his services again.", o: ["why", "reason", "because", "for"], a: 0, expl: "Conjunctions: 'That's why' is a standard fixed phrase introducing the reason or result of the previous statement." },

      { q: "For the next two hours, we are going ________ some exclusive footage that has never been seen before.", o: ["to look", "to look at", "to be looking at", "to be looked at"], a: 2, expl: "Future Continuous (B2): 'Going to be looking at' emphasizes an action that will be in progress over a specific future duration ('For the next two hours')." },

      { q: "He got a bad elbow injury last night and will be out for the ______ of the playoffs.", o: ["remainder", "residue", "outcome", "remainings"], a: 0, expl: "Vocabulary (B2/C1): 'Remainder' is the correct formal noun used to describe the time, people, or things left over." },
      { q: "Not until the principal investigator reviewed the final data ________ the fundamental flaw in the initial hypothesis.", o: ["she realized", "did she realize", "she had realized", "has she realized"], a: 1, expl: "Negative Inversion (C1): When a sentence begins with a restrictive adverbial phrase like 'Not until...', the main clause requires subject-auxiliary inversion." },
      { q: "I’d rather you _______ go out tonight, it’s too cold.", o: ["didn’t", "don’t", "won’t", "haven’t"], a: 0, expl: "Preferences (B2): 'Would rather' followed by a different subject requires the past simple ('didn't') to express a present or future preference." },
      { q: "The courses were the first of ________ kind to be taught completely online.", o: ["its", "it’s", "their", "they’re"], a: 2, expl: "Pronoun Agreement: 'Courses' is a plural noun, so the possessive adjective must be the plural 'their'." },

    ed: [
      { s: "There are a lot of so-called experts who have access to big audiences. This people don’t know what they’re talking about.", o: ["There are a lot of", "so-called experts", "access to", "This people"], a: 3, expl: "Demonstrative Adjectives (B1): 'People' is a plural noun, so it requires the plural demonstrative 'These', not 'This'." },
      { s: "If you make early payments on this loan, you can choose either to lower your monthly payment amount nor shorten the remaining loan term.", o: ["early payments", "either to lower", "nor shorten", "the remaining"], a: 2, expl: "Correlative Conjunctions (B1): The word 'either' must always be paired with 'or'. ('Neither' is paired with 'nor')." },
      { s: "Experiencing that earthquake must have been terrible. Please tell me how do you feel.", o: ["Experiencing", "that earthquake", "must have been", "how do you feel"], a: 3, expl: "Indirect Questions (B2): Embedded questions lose their interrogative inversion and must take standard statement order ('how you feel')." },
      { s: "The candidate was so well prepared that she needn't have to worry about the difficult interview questions.", o: ["so well prepared", "needn't have to worry", "about the", "difficult interview"], a: 1, expl: "Past Modals (B2): To express that an action was unnecessary in the past, use 'needn't have + past participle' ('needn't have worried') or 'didn't need to worry'." },
      { s: "According to my schedule, I’ll have my next English exam tomorrow morning.", o: ["According to", "I’ll have", "English exam", "tomorrow morning"], a: 1, expl: "Future Forms (B1): Fixed schedules and timetables require the present simple ('I have') or present continuous ('I am having'), not the future 'will'." },
      { s: "Having studying the financial markets for a decade, the analyst accurately predicted the recent economic downturn.", o: ["Having studying", "for a decade", "accurately predicted", "recent economic"], a: 0, expl: "Participle Clauses (C1): The perfect participle is formed with 'Having + past participle' ('Having studied') to show an action completed before the main clause." },
      { s: "The new software system, which its main purpose is to automate data entry, will be launched next quarter.", o: ["software system", "which its", "to automate", "will be launched"], a: 1, expl: "Relative Pronouns (B2): To show possession within a relative clause, use 'whose', not the ungrammatical combination of 'which + its'." },
      { s: "In addition to his responsibilities at the hospital, the chief surgeon is also in charge to mentor junior staff.", o: ["In addition to", "responsibilities at", "in charge to", "junior staff"], a: 2, expl: "Prepositions (B2): The correct prepositional phrase is 'in charge of' followed by a gerund or noun ('in charge of mentoring')." },
      { s: "If the management team had secured the appropriate funding last year, the company will be expanding its operations right now.", o: ["had secured", "appropriate funding", "will be expanding", "right now"], a: 2, expl: "Mixed Conditionals (C1): A past unreal condition ('had secured') affecting a present unreal result requires 'would be + verb-ing' in the main clause." },

  16: {

      { q: "There are more trees on earth ______ stars in the Milky Way galaxy.", o: ["to", "which", "that", "than"], a: 3, expl: "Comparatives (A2/B1): The comparative word 'more' must always be paired with the conjunction 'than' when comparing two amounts." },
      { q: "I don’t mind ______ for her to reply.", o: ["waiting", "to wait", "wait", "waited"], a: 0, expl: "Verb Patterns (B1): The verb 'mind' (especially in negative/interrogative forms like 'don't mind') is always followed by a gerund (-ing)." },
      { q: "Bananas are naturally slightly radioactive _____ they contain small amounts of potassium-40.", o: ["while", "because", "because of", "therefore"], a: 1, expl: "Conjunctions (B1): Use 'because' to introduce a full clause (subject + verb) showing reason. 'Because of' must be followed by a noun phrase." },
      { q: "The Mona Lisa, ____ by Leonardo da Vinci in the early 16th century, is currently housed in the Louvre.", o: ["painted", "was painted", "which painted", "painting"], a: 0, expl: "Reduced Relative Clauses (B2): The passive clause 'which was painted' is reduced to the past participle 'painted'." },
      { q: "Not only ____ a brilliant scientist, but she was also a gifted musician.", o: ["Marie Curie was", "was Marie Curie", "did Marie Curie be", "Marie Curie has been"], a: 1, expl: "Negative Inversion (C1): When a sentence begins with 'Not only', the first clause requires subject-auxiliary inversion ('was she')." },
      { q: "By the time the software developers finish writing the code, the marketing team ____ the promotional materials.", o: ["will prepare", "will have prepared", "prepares", "are preparing"], a: 1, expl: "Future Perfect (B2): Shows that an action will be entirely completed before a specific point or action in the future." },
      { q: "We’ll have our soccer practice outside ________ it rains. We can’t miss a day of practice.", o: ["unless", "only if", "even if", "as long as"], a: 2, expl: "Conjunctions/Conditionals (B2): 'Even if' emphasizes that a particular condition (raining) will not change the outcome." },
      { q: "Suppose we ________ to the beach on vacation this year. Would you like that?", o: ["are going", "went", "go", "gone"], a: 1, expl: "Unreal Past (B2/C1): 'Suppose' or 'Imagine' followed by a new subject uses the past simple ('went') to propose a hypothetical situation for the present/future." },
      { q: "The board members could not agree on ____ should be appointed as the new Chief Executive Officer.", o: ["who", "whom", "whoever", "which"], a: 0, expl: "Noun Clauses (B2): Even though it follows a preposition ('on'), the pronoun acts as the subject of the embedded verb 'should be appointed', requiring 'who'." },
      { q: "The streets are soaking wet and there are puddles everywhere; it ____ heavily last night.", o: ["must rain", "should have rained", "must have rained", "couldn't have rained"], a: 2, expl: "Modals of Deduction (B2): To express strong logical certainty about a past event based on present evidence, use 'must have + past participle'." }
    ],
    ed: [
      { s: "Shakira was the first person from Colombia to perform at the Super Bowl, wasn’t her?", o: ["the first person", "to perform", "at the Super Bowl", "wasn’t her"], a: 3, expl: "Question Tags (B1): The pronoun in a question tag must be a subject pronoun. It should be 'wasn't she?'" },
      { s: "The new manager looks strict but I don’t mind. I’m used to work under pressure anyhow.", o: ["looks strict", "I don’t mind", "I’m used to work", "anyhow"], a: 2, expl: "Verb Patterns (B2): The structure 'be used to' (meaning accustomed to) takes a gerund because 'to' is a preposition here: 'used to working'." },
      { s: "Octopuses have three hearts and their blood is blue because it contain copper instead of iron.", o: ["have", "their blood", "it contain", "instead of"], a: 2, expl: "Subject-Verb Agreement (A2): The third-person singular pronoun 'it' requires the verb to have an -s ending ('it contains')." },
      { s: "Honey never really spoil — archaeologists have found edible honey in ancient Egyptian tombs that was thousands of years old.", o: ["spoil", "edible honey", "that was", "thousands of years old"], a: 0, expl: "Subject-Verb Agreement (A2/B1): The uncountable noun 'honey' takes a singular verb. It should be 'spoils'." },
      { s: "I don’t care if she apologized, I have no intention to go to the party, so don’t insist anymore.", o: ["if she apologized", "have no intention to go", "don’t insist", "anymore"], a: 1, expl: "Noun + Preposition Patterns (B2): The noun 'intention' is followed by the preposition 'of' and a gerund: 'intention of going'." },
      { s: "We want to go to Japan for vacation. We’re anxious to see the cherry blossom trees with our own eyes!", o: ["want to go", "for vacation", "anxious to see", "our own eyes"], a: 1, expl: "Collocations/Prepositions (B1): The standard English expression is to go 'on vacation', not 'for vacation'." },
      { s: "The committee recommended hiring a new consultant, increasing the budget, and to delay the product launch.", o: ["hiring", "increasing", "to delay", "launch"], a: 2, expl: "Parallelism (B2): Items in a list connected by 'and' must share the same grammatical form. It should be the gerund 'delaying'." },
      { s: "A day on Venus is actually longer than a year on Venus because the planet rotates extremely slow.", o: ["on Venus", "longer than", "the planet rotates", "slow"], a: 3, expl: "Adverbs (B1): An adverb is required to modify the verb 'rotates'. It must be 'slowly'." },
      { s: "The researchers gathered a massive amount of data, but they still lack concrete evidences to support their theory.", o: ["massive amount of", "they still lack", "concrete evidences", "to support"], a: 2, expl: "Uncountable Nouns (B1): 'Evidence' is an uncountable noun in English. It cannot be pluralized with an 's'." },
      { s: "Hardly no one attended the voluntary seminar because it was scheduled late on a Friday afternoon.", o: ["Hardly no one", "voluntary seminar", "was scheduled", "on a Friday"], a: 0, expl: "Double Negatives (B2): 'Hardly' is already a negative word. It must be paired with 'anyone', not 'no one', to avoid a double negative." }
    ]
  },

  17: {
    mc: [
      { q: "The financial report, ____ the board based its final decision, contained several critical inaccuracies.", o: ["which", "on which", "that", "where"], a: 1, expl: "Relative Clauses (B2): The preposition 'on' belongs to the verb phrase 'based on'. In formal English, the preposition moves before the relative pronoun 'which'." },
      { q: "Before the rescue team finally located the lost hikers, they ____ through the dense forest for over three days.", o: ["have wandered", "were wandering", "had been wandering", "wandered"], a: 2, expl: "Past Perfect Continuous (B2): Shows an action that was ongoing in the past up until another past action ('located') interrupted it." },
      { q: "____ the severe economic downturn, the tech startup managed to secure additional funding from investors.", o: ["Although", "However", "Despite", "While"], a: 2, expl: "Concessive Clauses (B1): 'Despite' is followed by a noun phrase ('the severe economic downturn'). 'Although' would require a full subject-verb clause." },
      { q: "If the lead architect ____ the structural flaws earlier, the collapse would not have happened.", o: ["noticed", "has noticed", "had noticed", "would notice"], a: 2, expl: "Third Conditional (B2): To express an unreal situation in the past, use the past perfect ('had noticed') in the 'if' clause." },
      { q: "The manager asked the team to come up with ____ solution since the first one was too expensive to implement.", o: ["other", "another", "others", "the others"], a: 1, expl: "Pronouns (A2/B1): 'Another' is used with a singular countable noun ('solution') to mean 'one more' or 'a different one'." },
      { q: "The strict supervisor made the new employees ____ a rigorous safety training program before entering the factory floor.", o: ["to attend", "attend", "attended", "attending"], a: 1, expl: "Causatives (B2): The causative verb 'make' (meaning to force or require) is followed by the object and the base form of the verb without 'to'." },
      { q: "The delicate negotiations reached a ____ when neither side was willing to compromise on the key issues.", o: ["breakthrough", "stalemate", "milestone", "resolution"], a: 1, expl: "Vocabulary (C1): 'Stalemate' refers to a situation where further action or progress by opposing or competing parties seems impossible." },
      { q: "Mary and Gina went to the party _________.", o: ["herself", "herselves", "by themselves", "themselves"], a: 2, expl: "Reflexive Pronouns (B1): 'By themselves' means they went alone, without anyone else accompanying them." },
      { q: "It _______ that three people were involved in the accident, but their identities haven’t been revealed.", o: ["knew", "knows", "is known", "know"], a: 2, expl: "Passive Reporting Verbs (B2): 'It is known that...' is a passive distancing structure used to state general facts without specifying who knows them." },
      { q: "Victor Wembanyama is so tall that he _______ even among NBA players.", o: ["wraps up", "stands out", "comes along", "winds up"], a: 1, expl: "Phrasal Verbs (B2): 'Stand out' means to be very easy to see or notice, often because of being different or superior." }
    ],
    ed: [
      { s: "Ludwig van Beethoven continued compose music even after becoming almost completely deaf.", o: ["continued compose music", "even after becoming", "almost", "completely deaf"], a: 0, expl: "Verb Patterns (B1): The verb 'continue' must be followed by an infinitive ('to compose') or a gerund ('composing')." },
      { s: "Titanic was the first movie ever released on VHS while still being showed in theaters.", o: ["Titanic was", "ever released", "on VHS", "being showed"], a: 3, expl: "Irregular Verbs / Passives (B1): The past participle of 'show' is 'shown'. It should be 'being shown'." },
      { s: "Blue whale hearts are such large that a human could theoretically crawl through one of their arteries.", o: ["Blue whale hearts", "such large", "a human could", "crawl through"], a: 1, expl: "Intensifiers (B1): Use 'so' before an adjective alone ('so large'). 'Such' requires an adjective + noun combination ('such a large heart')." },
      { s: "Water can boil and freeze in the same time under specific pressure conditions, called the “triple point.”", o: ["can boil", "in the same time", "pressure conditions", "called"], a: 1, expl: "Prepositions (A2): The correct fixed idiomatic prepositional phrase is 'at the same time'." },
      { s: "The newly installed security cameras operate extremely quiet, making them virtually undetectable to intruders.", o: ["newly installed", "operate", "quiet", "undetectable"], a: 2, expl: "Adverbs vs Adjectives (B1): An adverb is required to modify the action verb 'operate'. It should be 'quietly'." },
      { s: "The curious tourists asked the local guide what time did the museum close on Sundays.", o: ["curious tourists", "local guide", "did the museum close", "on Sundays"], a: 2, expl: "Indirect Questions (B2): Embedded questions do not use interrogative auxiliary verbs ('did'). They use statement word order: 'what time the museum closed'." },
      { s: "Because of the automated checkout systems, there are significantly less cashiers working at the grocery store today.", o: ["Because of", "significantly less", "working", "at the"], a: 1, expl: "Quantifiers (B1): 'Less' is used for uncountable nouns. For plural countable nouns like 'cashiers', 'fewer' must be used." },
      { s: "To prevent data loss, the IT department advises employees to avoid to click on suspicious email links.", o: ["To prevent", "advises employees", "to avoid", "to click"], a: 3, expl: "Verb Patterns (B1): The verb 'avoid' is strictly followed by a gerund. It should be 'avoid clicking'." },
      { s: "The complex instructions provided in the technical manual were extremely confused for the new operators.", o: ["provided in", "extremely confused", "for the", "new operators"], a: 1, expl: "-ED vs -ING Adjectives (B1): '-ed' describes a feeling. The instructions themselves cause the feeling, so they are 'confusing'." },
      { s: "The groundbreaking historical documentary will officially premiere in the evening of October 15th.", o: ["groundbreaking", "will officially premiere", "in the evening", "October 15th"], a: 2, expl: "Prepositions of Time (B1): While we say 'in the evening', if a specific date or day is attached ('of October 15th'), the preposition 'on' must be used: 'on the evening of'." }
    ]
  },

  18: {
    mc: [
      { q: "During the call, the client asked who would take responsibility ___ updating the contract.", o: ["of", "for", "about", "with"], a: 1, expl: "Dependent Prepositions (B2): The noun 'responsibility' is conventionally followed by the preposition 'for' when referring to an action." },
      { q: "By the end of the month, our team __ three new international clients.", o: ["signs", "signing", "will have signed", "sign"], a: 2, expl: "Future Perfect (B2): Used to express an action that will be completed before a specified time in the future ('By the end of the month')." },
      { q: "I didn’t expect the interview __ that formal, so I was a little nervous.", o: ["be", "has been", "to be", "been"], a: 2, expl: "Verb Patterns (B1): The verb 'expect' follows the pattern 'expect + object + to-infinitive'." },
      { q: "Hardly had we finished the presentation when the internet ___.", o: ["goes down", "had gone down", "went down", "has gone down"], a: 2, expl: "Negative Inversion / Narrative Tenses (C1): 'Hardly had + past participle' is followed by 'when + past simple' to show one event happened immediately after another." },
      { q: "The lawyer recommended that the agreement ___ reviewed one more time before signing it.", o: ["is", "be", "was", "being"], a: 1, expl: "Subjunctive Mood (C1): Verbs of recommendation ('recommended that') require the base form of the verb ('be') in the subordinate clause." },
      { q: "All protective gear ____ at all times while visiting the manufacturing floor.", o: ["must be worn", "must wear", "has to wear", "is wearing"], a: 0, expl: "Passive Modals (B2): When the subject receives the action of a modal verb, the structure is 'modal + be + past participle'." },
      { q: "____ the weather improves significantly, the outdoor charity event will have to be rescheduled.", o: ["Provided that", "Unless", "If", "As long as"], a: 1, expl: "Conditionals (B2): 'Unless' means 'if not' and logically connects the negative condition to the rescheduling of the event." },
      { q: "The police finally identified the ______ responsible for the series of burglaries.", o: ["witness", "suspect", "culprit", "victim"], a: 2, expl: "Vocabulary (B2): A 'culprit' is the person responsible for a crime or misdeed." },
      { q: "There was a lot of traffic today in the morning, _______?", o: ["no", "weren’t there", "there wasn’t", "wasn’t there"], a: 3, expl: "Question Tags (B1): Sentences starting with 'There was' take the tag 'wasn't there?' to ask for confirmation." },
      { q: "They promised that my car _____ be ready to pick up today.", o: ["could", "would", "should", "will"], a: 1, expl: "Reported Speech / Future in the Past (B2): The original promise ('will be ready') shifts to 'would' when reported with a past tense reporting verb ('promised')." }
    ],
    ed: [
      { s: "A lot of people were eligible for the foundation scholarship. But some of them decided don’t take it.", o: ["A lot of people", "eligible for", "foundation scholarship", "decided don’t take it"], a: 3, expl: "Verb Patterns (B1): The negative infinitive is formed with 'not to' + base verb ('decided not to take it')." },
      { s: "Are you sure you want to go ahead with the plan? We would need your signature for tomorrow morning.", o: ["Are you sure", "go ahead", "would need", "for tomorrow"], a: 3, expl: "Prepositions of Time (B1): Deadlines require the preposition 'by' ('by tomorrow morning'), not 'for'." },
      { s: "The controversial new rule triggered a lot of criticism. A lot of people are doing negative comments on Facebook on the matter.", o: ["triggered", "a lot of criticism", "doing negative comments", "on the matter"], a: 2, expl: "Collocations (B1/B2): In English, one 'makes' comments, rather than 'doing' them ('making negative comments')." },
      { s: "In the modern society, smartphones and tablets have become essential tools for daily communication and business.", o: ["the modern society", "have become", "essential tools", "for daily"], a: 0, expl: "Articles (B2): Abstract nouns or concepts spoken of in a general sense (like 'modern society') do not take the definite article 'the'." },
      { s: "The new warehouse facility is not enough spacious to accommodate the upcoming inventory delivery next week.", o: ["new warehouse facility", "enough spacious", "to accommodate", "upcoming"], a: 1, expl: "Adverb Placement (B1): The word 'enough' must follow the adjective it modifies ('spacious enough')." },
      { s: "The marketing team is entirely responsible of creating the new advertising campaign for the holiday season.", o: ["entirely", "responsible of", "creating", "advertising campaign"], a: 1, expl: "Dependent Prepositions (B2): The adjective 'responsible' is always followed by the preposition 'for', not 'of'." },
      { s: "The international passengers were told that they could only bring two heavy luggages onto the airplane.", o: ["international passengers", "could only bring", "heavy luggages", "onto the"], a: 2, expl: "Count/Uncount Nouns (B1): 'Luggage' is uncountable and cannot be pluralized. Use 'pieces of luggage' or 'bags'." },
      { s: "The board of directors rejected completely the original proposal because the financial risks were too high.", o: ["rejected completely", "original proposal", "because", "were too high"], a: 0, expl: "Adverb Placement (B1): An adverb of manner ('completely') should not be placed directly between a verb ('rejected') and its direct object ('the proposal'). It should be 'completely rejected'." },
      { s: "The regional manager is working at this specific branch since the company first opened it in 2015.", o: ["is working", "at this", "since", "first opened"], a: 0, expl: "Present Perfect Continuous (B1): An action that started in the past and continues into the present requires 'has been working'." },
      { s: "If the demanding client will accept the revised contract terms, we can proceed with the negotiations tomorrow.", o: ["will accept", "revised contract terms", "can proceed", "with the"], a: 0, expl: "First Conditional (B1): The 'if' clause of a first conditional sentence must use the present simple ('accepts'), not the future 'will'." }
    ]
  },

  19: {
    mc: [
      { q: "It was not until the regional manager arrived ____ the emergency meeting officially began.", o: ["that", "when", "than", "and"], a: 0, expl: "Cleft Sentences (B2): The structure 'It was not until... that...' is used to emphasize the specific time an event occurred." },
      { q: "____ all the historical data, the researchers published their final conclusions in the academic journal.", o: ["Analyze", "To analyze", "Having analyzed", "Analyzed"], a: 2, expl: "Participle Clauses (C1): 'Having + past participle' creates a perfect participle clause, showing an action completed before the main clause." },
      { q: "The museum recently acquired a ____ vase from the Ming Dynasty.", o: ["beautiful old Chinese", "Chinese old beautiful", "old beautiful Chinese", "beautiful Chinese old"], a: 0, expl: "Adjective Order (B1/B2): Multiple adjectives generally follow the order of Opinion (beautiful), Age (old), and Origin (Chinese)." },
      { q: "Under no circumstances ____ authorized to share the client's private financial data with external parties.", o: ["employees are", "are employees", "employees will be", "have employees"], a: 1, expl: "Negative Inversion (C1): Sentences starting with restrictive phrases like 'Under no circumstances' require subject-auxiliary inversion." },
      { q: "The facility manager had the broken ventilation system ____ immediately after the health inspector's visit.", o: ["repair", "to repair", "repairing", "repaired"], a: 3, expl: "Causatives (B2): The passive causative structure 'have + object + past participle' is used when arranging for a service to be done to an object." },
      { q: "The government imposed stricter safety regulations on imported ______ after several shipments were found to be contaminated.", o: ["merchandise", "vegetation", "livestock", "foodstuffs"], a: 3, expl: "Vocabulary (C1): 'Foodstuffs' is a formal collective noun referring to items that are consumed as food, particularly in commercial or regulatory contexts." },
      { q: "The brilliant scientist, ____ groundbreaking research revolutionized renewable energy, was awarded the Nobel Prize.", o: ["who", "which", "that", "whose"], a: 3, expl: "Relative Clauses (B2): The relative pronoun 'whose' is required to show possession (the research belonging to the scientist)." },
      { q: "Too much ____ of salt is linked with high blood pressure.", o: ["appetite", "consumption", "supply", "having"], a: 1, expl: "Vocabulary / Collocations (B2): 'Consumption' is the formal and accurate term for the intake or eating of a specific substance." },
      { q: "Have you ever been to Italy? Or would you like _______?", o: ["be", "to", "it", "that"], a: 1, expl: "Ellipsis (B1/B2): 'To' acts as a substitute for the entire omitted infinitive phrase ('to go there') to avoid unnecessary repetition." },
      { q: "The tech billionaire spent millions on public relations campaigns to ______ voters and gain support for the project.", o: ["coerce", "woo", "reprimand", "evade"], a: 1, expl: "Vocabulary (C1): To 'woo' means to seek the favor, support, or custom of someone, especially in a political or business context." }
    ],
    ed: [
      { s: "Would working overtime be fine with you? Let us to know as soon as you can, please.", o: ["Would working", "fine with you", "Let us to know", "as soon as"], a: 2, expl: "Verb Patterns (B1): The causative verb 'let' is followed by an object and the bare infinitive (without 'to'). It should simply be 'Let us know'." },
      { s: "We went to the store and I decided you to get a new parrot as a pet! What do you think of the idea?", o: ["went to the store", "I decided you to get", "as a pet", "think of"], a: 1, expl: "Verb Patterns (B2): The verb 'decide' cannot be followed directly by an object + to-infinitive. It must be phrased as 'decided to get you' or 'decided you should get'." },
      { s: "The committee worked hardly throughout the weekend to ensure the charity gala was a complete success.", o: ["worked hardly", "throughout the weekend", "to ensure", "complete success"], a: 0, expl: "Adverbs (B1): The adverb form of 'hard' (meaning with a lot of effort) is 'hard'. 'Hardly' means 'almost not at all'." },
      { s: "What would you say if I said that I don’t want to work here anymore? Suppose if I quit tomorrow.", o: ["would you say", "if I said", "don’t want to work", "Suppose if I quit"], a: 3, expl: "Redundancy / Conditionals (B2): 'Suppose' and 'if' serve the exact same grammatical function here. Using both together is redundant; it should be 'Suppose I quit'." },
      { s: "To maintaining a healthy work-life balance is absolutely crucial for long-term career success and mental well-being.", o: ["To maintaining", "absolutely crucial", "long-term", "mental well-being"], a: 0, expl: "Gerunds as Subjects (B1): When a verb acts as the subject of a sentence, it must be in the gerund form ('Maintaining') or the standard infinitive ('To maintain')." },
      { s: "The human resources department needs to purchase several new furnitures for the expanded office space.", o: ["human resources", "needs to purchase", "new furnitures", "expanded office"], a: 2, expl: "Count/Uncount Nouns (B1): 'Furniture' is an uncountable noun in English and cannot be pluralized with an 's'." },
      { s: "Nobody submitted the quarterly financial report before the strict Friday deadline, didn't they?", o: ["Nobody submitted", "quarterly financial", "strict Friday deadline", "didn't they"], a: 3, expl: "Question Tags (B2): Words with negative meanings like 'nobody', 'never', or 'nothing' make the main clause negative, so the tag must be positive ('did they?')." },
      { s: "The startup company cannot afford risking its fragile reputation by launching an untested and unverified software product.", o: ["cannot afford", "risking", "fragile reputation", "untested and unverified"], a: 1, expl: "Verb Patterns (B1): The verb phrase 'afford' is strictly followed by a to-infinitive, not a gerund. It should be 'afford to risk'." },
      { s: "Despite the final contract was already signed, the client requested several major revisions to the initial terms.", o: ["Despite", "was already signed", "requested several", "initial terms"], a: 0, expl: "Conjunctions (B2): 'Despite' must be followed by a noun or gerund phrase. Because there is a full clause (subject + verb), the conjunction 'Although' must be used." },
      { s: "The newly developed mobile application is designed to be fast, highly reliable, and user-friendliness for all demographics.", o: ["newly developed", "is designed", "highly reliable", "user-friendliness"], a: 3, expl: "Parallelism (B2): Items in a list must be grammatically parallel. To match the adjectives 'fast' and 'reliable', the final item must be the adjective 'user-friendly'." }
    ]
  },

  20: {
    mc: [
      { q: "Nobody _________ reading the newspaper anymore. It’s such a shame that we’re losing that old tradition.", o: ["liking", "liked", "likes", "like"], a: 2, expl: "Subject-Verb Agreement (B1): Indefinite pronouns such as 'nobody', 'everybody', and 'someone' always take a singular verb ('likes')." },
      { q: "This time next year, the company ____ its operations to three new European countries.", o: ["expands", "will be expanding", "has expanded", "will have been expanding"], a: 1, expl: "Future Continuous (B2): Used to describe an action that will be in progress at a specific, stated time in the future ('This time next year')." },
      { q: "____ in the 18th century, the historic mansion was recently restored to its original glory.", o: ["Built", "Building", "To build", "Was built"], a: 0, expl: "Participle Clauses (B2): The past participle 'Built' functions as a reduced passive clause (short for 'Because it was built')." },
      { q: "The CEO promised that the new employee benefits package ____ rolled out by the end of the quarter.", o: ["will be", "is", "would be", "has been"], a: 2, expl: "Reported Speech / Future in the Past (B2): The future auxiliary 'will' shifts back to 'would' after a past reporting verb ('promised')." },
      { q: "Deborah was so lucky when she got the audition to star the movie! She was in the right place ____ the right time!", o: ["at", "in", "on", "by"], a: 0, expl: "Prepositions of Time (A2/B1): The correct fixed idiom in English is to be somewhere 'at the right time'." },
      { q: "Did you take a walk by the beach in the morning? There were ______ turtles by the shore!", o: ["uncountable", "countless", "much", "major"], a: 1, expl: "Vocabulary / Quantifiers (B2): 'Countless' is an adjective meaning 'too many to be counted,' properly modifying the plural noun 'turtles'." },
      { q: "There’s a good _______ of rain this afternoon, so don’t forget your umbrella.", o: ["chance", "probability", "likely", "possibility"], a: 0, expl: "Collocations (B1): In meteorology and everyday English, the standard collocation is 'a good chance of rain'." },
      { q: "The old photograph immediately ______ memories of summers spent at my grandparents’ house.", o: ["rely on", "came up with", "put together", "conjured up"], a: 3, expl: "Phrasal Verbs (C1): To 'conjure up' means to make a picture, image, or memory appear in someone's mind." },
      { q: "Soap is one of the most underrated products ever created. It’s really important that it ____ available in every house and building to maintain high hygiene standards.", o: ["there be", "was", "is", "be"], a: 3, expl: "Subjunctive Mood (C1): Adjectives of urgency or importance ('It is important that...') require the base form of the verb ('be') in the subordinate clause." },
      { q: "She _____ a lot of satisfaction out of helping others solve difficult problems.", o: ["has", "makes", "does", "gets"], a: 3, expl: "Collocations (B1): The correct idiomatic verb to use with deriving pleasure or fulfillment from an activity is 'get' ('get satisfaction out of')." }
    ],
    ed: [
      { s: "A thousand dollars are a lot of money to spend of one dress. Don’t you think?", o: ["A thousand dollars", "are", "a lot of money", "Don’t you think?"], a: 1, expl: "Subject-Verb Agreement (B1): Amounts of money, distances, and periods of time are treated as single units and require a singular verb ('is')." },
      { s: "Stretching regularly can help with reduce fatigue by improving blood circulation and relieving muscle tension.", o: ["Stretching", "with reduce", "by improving", "muscle tension"], a: 1, expl: "Verb Patterns (B1): A preposition ('with') must be followed by a gerund ('reducing'). Alternatively, use the bare infinitive after help: 'help reduce'." },
      { s: "No way I would enter that haunted house again! I got so scared that I didn’t sleep well for five straight nights!", o: ["I would enter", "haunted house", "so scared that I", "sleep well"], a: 0, expl: "Negative Inversion (C1): Sentences starting with negative or restrictive phrases like 'No way' require subject-auxiliary inversion ('would I enter')." },
