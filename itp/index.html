<title>TOEFL Practice Sessions</title>

<style>
body { font-family: Arial, sans-serif; background: #ffffff; margin: 0; position: relative; transition: background-color 0.5s ease; }
header { background: #0D3B6F; color: white; padding: 30px; text-align: center; font-size: 32px; font-weight: bold; }
.container { max-width: 800px; margin: 50px auto; padding: 20px; position: relative; border: 1px solid #eee; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);max-height: 80vh; 
  overflow-y: auto; }
.section-title { font-size: 18px; color: #0D3B6F; text-align: center; margin-bottom: 30px; }
.question { font-size: 26px; margin-bottom: 35px; }
.options button { display: block; width: 100%; padding: 14px; margin-bottom: 12px; font-size: 18px; cursor: pointer; transition: 0.2s; border: 1px solid #ccc; background: #fff; border-radius: 4px; }
.options button:hover:not(:disabled) { background: #f0f0f0; }
.correct-choice { background-color: #2e7d32 !important; color: white; border-color: #1b5e20; }
.incorrect-choice { background-color: #c62828 !important; color: white; border-color: #b71c1c; }
.feedback { font-size: 20px; margin-top: 20px; text-align: center; font-weight: bold; }
.next-btn { margin: 30px auto 0; padding: 14px 28px; font-size: 18px; cursor: pointer; background: #470074; color: white; border: none; border-radius: 6px; display: block; }
.footer { margin-top: 40px; text-align: center; color: #555; font-size: 14px; }

/* Timer Style */
#timer-display { position: absolute; top: 10px; right: 20px; font-size: 16px; color: #666; font-family: monospace; }

/* Review Styling */
.review-card { background: #f9f9f9; border-left: 5px solid #c62828; padding: 15px; margin-bottom: 20px; text-align: left; border-radius: 4px; }
.review-q { font-weight: bold; font-size: 18px; margin-bottom: 10px; display: block; }
.review-detail { font-size: 15px; line-height: 1.5; color: #333; }
.correct-text { color: #2e7d32; font-weight: bold; }
.wrong-text { color: #c62828; font-weight: bold; }
.stats-box { background: #eef2f7; padding: 15px; border-radius: 8px; margin-bottom: 30px; display: flex; justify-content: space-around; font-weight: bold; color: #0D3B6F; }

#magic-toggle {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: #fff;
  border: 2px solid #ccc;
  border-radius: 50%;
  width: 50px;
  height: 50px;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  z-index: 1000;
  transition: 0.3s;
}
#magic-toggle.active {
  border-color: #470074;
  background: #eef2f7;
  box-shadow: 0 0 10px rgba(71, 0, 116, 0.5);
}
</style>

<style>
/* Responsive overrides */
@media (max-width: 768px) {
  header { font-size: 22px; padding: 18px; }
  .container { margin: 15px; padding: 15px; max-height: none; }
  .question { font-size: 20px; }
  .options button { font-size: 16px; padding: 12px; }
  .next-btn { font-size: 16px; padding: 12px 24px; }
  .stats-box { flex-direction: column; gap: 8px; text-align: center; }
  #magic-toggle { width: 42px; height: 42px; font-size: 20px; }
}
@media (max-width: 480px) {
  header { font-size: 18px; padding: 14px; }
  .question { font-size: 17px; }
  .options button { font-size: 15px; }
}
</style>
<script>
// Read allowed tests from URL parameter ?allowed=1,2,3
(function() {
  var params = new URLSearchParams(window.location.search);
  var allowedParam = params.get('allowed');
  if (allowedParam) {
    _allowedTests = allowedParam.split(',').map(Number);
  }
})();
document.addEventListener('DOMContentLoaded', function() {
  var menuDiv = document.getElementById('menu');
  if (!menuDiv) return;
  var buttons = menuDiv.querySelectorAll('button');
  buttons.forEach(function(btn) {
    var match = btn.getAttribute('onclick') && btn.getAttribute('onclick').match(/startTest\((\d+)\)/);
    if (match) {
      var testNum = parseInt(match[1]);
      if (_allowedTests.indexOf(testNum) === -1) {
        btn.style.opacity = '0.45';
        btn.style.background = '#888';
        btn.style.cursor = 'pointer';
        btn.textContent = '🔒 ' + btn.textContent.trim();
        btn.setAttribute('onclick', 'window.parent.postMessage({type:"showModal"}, "*")');
      }
    }
  });
});
</script>

      { q: "If she had accepted the job offer, she ____ in New York today.", o: ["will be", "would be", "is", "would have been"], a: 1, expl: "Mixed Conditional: Past unreal condition (had accepted) affecting present state (would be)." },
      { q: "We ________ the training course tomorrow, we're having a meeting with a potential client.", o: ["not attend", "won't be attending", "won't attend", "not going to attend"], a: 1, expl: "You can use the future continuous to talk about plans already made." }
    ],
    ed: [
      { s: "A number of students has registered for the advanced photography course this semester.", o: ["A number of", "has registered", "advanced", "this semester"], a: 1, expl: "S-V Agreement: 'A number of' is plural; use 'have registered'." },
      { s: "The students were given an assignments to complete over the weekend.", o: ["students", "given", "an", "complete"], a: 2, expl: "Articles: 'Assignments' is plural; you cannot use the singular article 'an' with plural nouns." },
      { s: "The principal of the school gave the student some helpful advise about her career.", o: ["principal", "gave", "helpful", "advise"], a: 3, expl: "Word Form: 'Advise' is a verb. The noun form 'advice' is required here." },
      { s: "While the team analyzed the data, they had discovered a significant error in the calculations.", o: ["While", "analyzed", "had discovered", "significant"], a: 2, expl: "Narrative Tense: Use simple past 'discovered' for a sudden interruption." },
      { s: "The manager suggested to postpone the meeting until all members could attend.", o: ["suggested", "to postpone", "until", "could"], a: 1, expl: "Verb Pattern: 'Suggest' must be followed by a gerund ('postponing')." },
      { s: "The internship involves attending meetings, answering phones, and to assist the senior staff.", o: ["involves", "attending", "answering", "to assist"], a: 3, expl: "Parallelism: All items in the list must be gerunds ('assisting')." },
      { s: "The tourist asked where could he find the nearest currency exchange office.", o: ["asked", "where", "could he find", "nearest"], a: 2, expl: "Indirect Question: Use statement order ('where he could find')." },
      { s: "Between the three applicants, the committee found it difficult to choose the best one.", o: ["Between", "applicants", "difficult", "best one"], a: 0, expl: "Prepositions: Use 'Among' for three or more choices." },
      { s: "The company reported that its quarterly earnings were extreme low this year.", o: ["reported", "its", "quarterly", "extreme"], a: 3, expl: "Adjective vs Adverb: Use the adverb 'extremely' to modify the adjective 'low'." },
      { s: "Each of the candidates were required to submit a portfolio of their recent work.", o: ["Each of", "were", "required", "their"], a: 1, expl: "S-V Agreement: 'Each' is always singular; use 'was'." }
    ]
  },

  // 📖📖📖 QUESTIONS CODE (START) 📖📖📖
  
  // 7️⃣ PASTE HERE CODE FOR TEST 7 ---- ▶️

7: {
    mc: [
      { q: "That’s the key to _______ a solution.", o: ["founded", "found", "find", "finding"], a: 3, expl: "After the phrase 'the key to', the 'to' is a preposition, so it must be followed by a gerund (-ing)." },
      { q: "Before 2011, people were _________ to smoke in restaurants, cafés, and schools. Today, it is prohibited.", o: ["required", "not allowed", "allowed", "supposed"], a: 2, expl: "Vocabulary: The context contrast ('Today you can't') implies that in the past, it was permitted (allowed)." },
      { q: "He spends a lot of time __________.", o: ["cooking and cleaning", "to cooking and to cleaning", "to cook and clean", "cook and clean"], a: 0, expl: "Verb Pattern: The verb 'spend' (time) is followed by a gerund (-ing)." },
      { q: "She let her kids ________ up late when they were a bit older.", o: ["staying", "to stay", "stay", "stayed"], a: 2, expl: "Causative: The verb 'let' is followed by the object and the base form of the verb without 'to'." },
      { q: "The director had the assistant _______ the report before the board meeting.", o: ["print", "to print", "printed", "printing"], a: 0, expl: "Causative: 'Have + person + base verb' is used when someone is assigned a task." },
      { q: "It is widely believed that ______ honesty is the best policy in professional relationships.", o: ["a", "an", "the", "(no article)"], a: 3, expl: "Articles: Abstract nouns used in a general sense (like honesty) do not take an article." },
      { q: "_______ for the final exam required more effort than he had originally anticipated.", o: ["Study", "Studied", "Studying", "To studying"], a: 2, expl: "Gerund as Subject: Use the -ing form when the action itself is the subject of the sentence." },
      { q: "The scientist ______ research led to the discovery was awarded a prestigious prize.", o: ["who", "whom", "whose", "which"], a: 2, expl: "Relative Pronouns: Use 'whose' to show possession (the research of the scientist)." },
      { q: "The manager was highly _______ of the team's performance during the recent crisis.", o: ["appreciate", "appreciation", "appreciative", "appreciatively"], a: 2, expl: "Word Form: After the linking verb 'was' and adverb 'highly', the adjective 'appreciative' is needed." },
      { q: "She arrived late to the seminar _______ the heavy traffic on the main highway.", o: ["because", "although", "because of", "despite"], a: 2, expl: "Conjunctions: Use 'because of' before a noun phrase (the heavy traffic)." }
    ],
    ed: [
      { s: "The police are looking for however robbed the bank during the holiday weekend.", o: ["looking for", "however", "robbed", "during"], a: 1, expl: "Relative Pronouns: Use 'whoever' to refer to a person; 'however' is used for manner or contrast." },
      { s: "There are mouses in the kitchen, so we need to set traps immediately.", o: ["There are", "mouses", "so", "to set"], a: 1, expl: "Irregular Plurals: The plural of 'mouse' is 'mice'." },
      { s: "Neither the manager nor the employees has been informed about the upcoming changes.", o: ["Neither", "nor", "has been", "about"], a: 2, expl: "Subject-Verb Agreement: With 'neither/nor', the verb agrees with the closest subject (employees), so it should be 'have been'." },
      { s: "The new software is much more faster than the previous version we used last year.", o: ["much", "more faster", "than", "version"], a: 1, expl: "Comparatives: 'Faster' is already a comparative; adding 'more' is redundant and incorrect." },
      { s: "The professor spoke very clear about the complex biological process.", o: ["spoke", "very", "clear", "complex"], a: 2, expl: "Adjectives vs. Adverbs: Use the adverb 'clearly' to modify the verb 'spoke'." },
      { s: "He is a best student in the class, always achieving top marks on every exam.", o: ["a", "best", "in the class", "achieving"], a: 0, expl: "Superlatives: Use the definite article 'the' with superlative adjectives like 'best'." },
      { s: "The team is interested on learning more about ancient civilizations in South America.", o: ["is", "interested on", "learning", "about"], a: 1, expl: "Prepositions: The correct adjective + preposition combination is 'interested in'." },
      { s: "She enjoys swimming, hiking, and to ride her bicycle in the park on weekends.", o: ["enjoys", "hiking", "to ride", "on weekends"], a: 2, expl: "Parallelism: The list uses gerunds (swimming, hiking), so the third item must be 'riding'." },
      { s: "I don't have many informations about the upcoming international conference.", o: ["don't have", "many", "informations", "upcoming"], a: 2, expl: "Count/Uncount Nouns: 'Information' is uncountable; it cannot be plural and should use 'much' instead of 'many'." },
      { s: "Could you please tell me where is the library located in this building?", o: ["please", "tell me", "where is the library", "located"], a: 2, expl: "Indirect Questions: Use statement word order ('where the library is') when the question is embedded in a statement." }
    ]
  },

  // 📖📖📖 QUESTIONS CODE (START) 📖📖📖
  
  // 8️⃣ PASTE HERE CODE FOR TEST 8 ---- ▶️

8: {
    mc: [
      { q: "If the committee had reviewed the proposal more thoroughly, they ____ the obvious flaws.", o: ["will notice", "would notice", "would have noticed", "had noticed"], a: 2, expl: "Third Conditional: A past unreal situation ('had reviewed') requires 'would have + past participle' in the result clause." },
      { q: "The new environmental regulations are expected ____ into effect by the end of the year.", o: ["to put", "to be put", "putting", "being put"], a: 1, expl: "Passive Infinitive: The regulations do not put themselves into effect; they are 'to be put' into effect by an authority." },
      { q: "By the time the rescue team finally arrived, the stranded hikers ____ their food supplies.", o: ["exhausted", "exhaust", "were exhausting", "had exhausted"], a: 3, expl: "Past Perfect: Use 'had exhausted' to show that the action of finishing the food happened before the past action of the rescue team arriving." },
      { q: "The more densely populated a city becomes, ____ it is to maintain adequate public transportation.", o: ["the more difficult", "more difficult", "it is more difficult", "the most difficult"], a: 0, expl: "Double Comparative: The structure requires 'The + comparative..., the + comparative...' to show cause and effect." },
      { q: "The board members were highly ____ to the proposed changes, leading to a swift approval.", o: ["received", "reception", "comprehensively", "receptive"], a: 3, expl: "Vocabulary/Word Form: Use the adjective 'receptive' (meaning willing to consider new ideas) after the linking verb 'were'." },
      { q: "This ancient artifact is believed to be significantly older ____ previously estimated by archaeologists.", o: ["than", "as was", "than was", "from what"], a: 2, expl: "Comparatives/Passives: The structure compares the age now to what it was thought to be before ('older than [it] was estimated')." },
      { q: "I remember _____ my parents when I went to study abroad.", o: ["to call", "calling", "call", "called"], a: 1, expl: "Verb Patterns: 'Remember' + gerund (-ing) refers to a memory of a past action. You remember doing it." },
      { q: "My brother is going to _______ me his suit because I don’t own one.", o: ["borrow", "present", "wear", "lend"], a: 3, expl: "Vocabulary: 'Lend' means to give something temporarily. 'Borrow' means to take something temporarily." },
      { q: "I started playing well but near the end I _____ focus and made a few mistakes.", o: ["was", "got", "lost", "gave"], a: 2, expl: "Collocations: The correct idiomatic combination is 'to lose focus'." },
      { q: "____ you require further assistance with your application, please do not hesitate to contact our office.", o: ["Should", "If", "Were", "Had"], a: 0, expl: "Conditionals/Inversion: 'Should you require' is a formal inversion of the first conditional 'If you should require' or 'If you require'." }
    ],
    ed: [
      { s: "The researchers realized that they made a critical error in their calculations before publishing the study.", o: ["made", "realized that", "calculations", "before publishing"], a: 0, expl: "Past Perfect: The error happened before they realized it. It should be 'had made'." },
      { s: "Of the two candidates interviewed for the managerial position, Mr. Davis is undoubtedly the most qualified.", o: ["Of the two", "interviewed for", "undoubtedly", "the most"], a: 3, expl: "Comparatives: When comparing exactly two things or people, use the comparative form ('the more qualified'), not the superlative." },
      { s: "The newly constructed bridge was designing to withstand earthquakes of up to 8.0 on the Richter scale.", o: ["newly constructed", "to withstand", "of up to", "designing"], a: 3, expl: "Passive Voice: The bridge receives the action. It should be the past participle 'designed'." },
      { s: "The severe weather conditions had a devastating affect on the region's agricultural output.", o: ["severe", "devastating", "affect", "agricultural"], a: 2, expl: "Vocabulary: 'Affect' is a verb. The noun form required here is 'effect' (to have an effect on)." },
      { s: "If the government will implement stricter tax laws, many small businesses will struggle to survive.", o: ["will implement", "stricter", "will struggle", "to survive"], a: 0, expl: "First Conditional: The 'if' clause must be in the present simple tense ('implements'), not the future tense." },
      { s: "The famous novel was translated to over fifty languages within a decade of its initial publication.", o: ["famous", "was translated", "to", "within"], a: 2, expl: "Prepositions: The correct collocation is 'translated into' a language, not 'to'." },
      { s: "Despite the efforts, they took the decision to stop working late and concentrate on their studies.", o: ["Despite the efforts", "took the decision", "stop working", "concentrate on"], a: 1, expl: "Collocations: In English, you 'make a decision', you do not 'take a decision'." },
      { s: "The climate in the southern region is much more humid than the north.", o: ["The climate", "in the", "much more", "than the north"], a: 3, expl: "Logical Comparisons: You must compare climate to climate. It should be 'than that of the north' or 'than the north's'." },
      { s: "The orchestra had been practiced for months before their opening night performance at the national theater.", o: ["The orchestra", "for months", "had been practiced", "opening night"], a: 2, expl: "Past Perfect Continuous: The orchestra was actively doing the practicing. It should be the active 'had been practicing'." },
      { s: "The CEO was completely oblivious of the growing dissatisfaction among the lower-level employees.", o: ["oblivious of", "completely", "growing", "among"], a: 0, expl: "Prepositions/Collocations: The correct adjective + preposition combination is 'oblivious to'." }
    ]
  },

  // 📖📖📖 QUESTIONS CODE (START) 📖📖📖
  
  // 9️⃣ PASTE HERE CODE FOR TEST 9 ---- ▶️
  // 🔟 PASTE HERE CODE FOR TEST 10 ---- ▶️

  // 9️⃣ PASTE HERE CODE FOR TEST 9 ---- ▶️
  
  // 📖📖📖 QUESTIONS CODE (END) 📖📖📖

  // 8️⃣ PASTE HERE CODE FOR TEST 8 ---- ▶️
  
  // 📖📖📖 QUESTIONS CODE (END) 📖📖📖

  // 📖📖📖 QUESTIONS CODE (START) 📖📖📖
  
  // 7️⃣ PASTE HERE CODE FOR TEST 7 ---- ▶️
  // 8️⃣ PASTE HERE CODE FOR TEST 8 ---- ▶️
  // 9️⃣ PASTE HERE CODE FOR TEST 9 ---- ▶️
  
  // 📖📖📖 QUESTIONS CODE (END) 📖📖📖

};

// ---------------- STATE & LOGIC ----------------

let currentTest = 1;
let index = 0;        
let score = 0;
let mistakes = []; 
let startTime;
let timerInterval;
let magicMode = false;
const magicColors = ["#F9D9D8", "#FCEED9", "#EBFEDB", "#DFFEEB", "#E5DFFF"];

function startTest(testNum) {
  currentTest = testNum;
  index = 0;
  score = 0;
  mistakes = [];
  startTime = Date.now();
  startTimerUI();
  render();
}

function startTimerUI() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    const display = document.getElementById("timer-display");
    if (display) display.innerText = `Time: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }, 1000);
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `<div id="timer-display">Time: 0:00</div>`;

  if (index === 20) {
    clearInterval(timerInterval);
    const totalTimeSec = Math.floor((Date.now() - startTime) / 1000);
    const avgTime = (totalTimeSec / 20).toFixed(1);

    let reviewHTML = "";
    if (mistakes.length > 0) {
      reviewHTML = `<div class="section-title">Mistake Review</div>`;
      mistakes.forEach(m => {
        const qText = m.q.q || m.q.s;
        const userChoice = m.q.o[m.userIdx];
        const correctChoice = m.q.o[m.q.a];
        reviewHTML += `
          <div class="review-card">
            <span class="review-q">${qText}</span>
            <div class="review-detail">
              <span class="wrong-text">Your Answer:</span> ${String.fromCharCode(97+m.userIdx)}. ${userChoice}<br>
              <span class="correct-text">Correct Answer:</span> ${String.fromCharCode(97+m.q.a)}. ${correctChoice}<br><br>
              <strong>Why?</strong> ${m.q.expl || "Explanation coming soon."}
            </div>
          </div>`;
      });
    } else {
      reviewHTML = `<p style="text-align:center;">🎯 Perfect Score!</p>`;
    }

    app.innerHTML = `
      <h2>🎉 Test Complete!</h2>
      <div class="stats-box">
        <div>Score: ${score}/20</div>
        <div>Total Time: ${Math.floor(totalTimeSec/60)}m ${totalTimeSec%60}s</div>
        <div>Avg: ${avgTime}s/q</div>
      </div>
      ${reviewHTML}
      <button class="next-btn" onclick="backToMenu()">⬅ Back to Main Menu</button>
    `;
    
    // Ensures the background reverts to white for the results screen
    applyMagicColor(); 
    return;
  }

  const currentData = tests[currentTest];
  const q = (index < 10) ? currentData.mc[index] : currentData.ed[index - 10];
  const text = q.q || q.s;
  const opts = q.o;
  const correct = q.a;

  app.innerHTML += `
    <div class="section-title">${index < 10 ? "Multiple Choice" : "Error Detection"}</div>
    <div class="question">${text}</div>
    <div class="options">
      ${opts.map((o,i)=>`<button onclick="check(${i}, ${correct}, this)">${String.fromCharCode(97+i)}. ${o}</button>`).join("")}
    </div>
    <div class="footer">Question ${index + 1} of 20</div>
  `;

  // CRITICAL: This is now safely at the very bottom, applying colors AFTER buttons exist
  applyMagicColor();
}

function check(choice, correct, btn) {
  const currentData = tests[currentTest];
  const qObj = (index < 10) ? currentData.mc[index] : currentData.ed[index - 10];
  
  document.querySelectorAll(".options button").forEach(b=>b.disabled=true);

  if (choice === correct) {
    score++;
    btn.classList.add("correct-choice");
    document.getElementById("app").innerHTML += `<div class="feedback">✅ Correct</div>`;
  } else {
    btn.classList.add("incorrect-choice");
    mistakes.push({ q: qObj, userIdx: choice });
    document.getElementById("app").innerHTML += `<div class="feedback">❌ Incorrect</div>`;
  }

  if (index === 9) {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="showTransition()">Next Section</button>`;
  } else if (index === 19) {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="index++; render()">Show Results</button>`;
  } else {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="index++; render()">Next Question</button>`;
  }
}

function showTransition() {
  index = 10;
applyMagicColor();
  document.getElementById("app").innerHTML = `
    <div id="timer-display"></div>
    <div class="question" style="text-align:center; margin-top:50px;">Ready for Section 2:<br><strong>Error Detection</strong></div>
    <button class="next-btn" onclick="render()">Start Section</button>
  `;
}

function backToMenu() {
  clearInterval(timerInterval);
index = -1; applyMagicColor();
  document.getElementById("app").innerHTML = `
    <div class="section-title">Select a Test</div>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(1)">Test 1</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(2)">Test 2</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(3)">Test 3</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(4)">Test 4</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(5)">Test 5</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(6)">Test 6</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(7)">Test 7</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(8)">Test 8</button>
    `;
  applyMenuLocks();
}
function applyMenuLocks() {
  var menuBtns = document.querySelectorAll('#app button');
  menuBtns.forEach(function(btn) {
    var match = btn.getAttribute('onclick') && btn.getAttribute('onclick').match(/startTest\((\d+)\)/);
    if (match) {
      var testNum = parseInt(match[1]);
      if (_allowedTests.indexOf(testNum) === -1) {
        btn.style.opacity = '0.45';
        btn.style.background = '#888';
        btn.style.cursor = 'pointer';
        if (!btn.textContent.startsWith('🔒')) btn.textContent = '🔒 ' + btn.textContent.trim();
        btn.setAttribute('onclick', 'window.parent.postMessage({type:"showModal"}, "*")');
      }
    }
  });
}
function toggleMagicMode() {
  magicMode = !magicMode;
  const btn = document.getElementById("magic-toggle");
  if (magicMode) {
    btn.classList.add("active");
  } else {
    btn.classList.remove("active");
  }
  applyMagicColor();
}

function applyMagicColor() {
  if (magicMode && index >= 0 && index < 20) {
    // 1. Grab the specific color for this question
    const currentColor = magicColors[index % magicColors.length];
    
    // 2. Paint the background
    document.body.style.backgroundColor = currentColor;
    
    // 3. Paint the buttons the exact same color
    const optionBtns = document.querySelectorAll(".options button");
    optionBtns.forEach(btn => {
      btn.style.backgroundColor = currentColor;
    });
  } else {
    // Revert everything to white if the wand is off or we are on a menu
    document.body.style.backgroundColor = "#ffffff";
    const optionBtns = document.querySelectorAll(".options button");
    optionBtns.forEach(btn => {
      btn.style.backgroundColor = "#ffffff";
    });
  }  
}
</script>

<style>

<script>
// Read allowed tests from URL parameter ?allowed=1,2,3
(function() {
  var params = new URLSearchParams(window.location.search);
  var allowedParam = params.get('allowed');
  if (allowedParam) {
    _allowedTests = allowedParam.split(',').map(Number);

      { q: "_______ for the final exam required more effort than he had originally anticipated.", o: ["Study", "Studied", "Studying", "To studying"], a: 2, expl: "Gerund as Subject: Use the -ing form when the action itself is the subject of the sentence." },
      { q: "The scientist ______ research led to the discovery was awarded a prestigious prize.", o: ["who", "whom", "whose", "which"], a: 2, expl: "Relative Pronouns: Use 'whose' to show possession (the research of the scientist)." },
      { q: "The manager was highly _______ of the team's performance during the recent crisis.", o: ["appreciate", "appreciation", "appreciative", "appreciatively"], a: 2, expl: "Word Form: After the linking verb 'was' and adverb 'highly', the adjective 'appreciative' is needed." },
      { q: "She arrived late to the seminar _______ the heavy traffic on the main highway.", o: ["because", "although", "because of", "despite"], a: 2, expl: "Conjunctions: Use 'because of' before a noun phrase (the heavy traffic)." }
    ],
    ed: [
      { s: "The police are looking for however robbed the bank during the holiday weekend.", o: ["looking for", "however", "robbed", "during"], a: 1, expl: "Relative Pronouns: Use 'whoever' to refer to a person; 'however' is used for manner or contrast." },
      { s: "There are mouses in the kitchen, so we need to set traps immediately.", o: ["There are", "mouses", "so", "to set"], a: 1, expl: "Irregular Plurals: The plural of 'mouse' is 'mice'." },
      { s: "Neither the manager nor the employees has been informed about the upcoming changes.", o: ["Neither", "nor", "has been", "about"], a: 2, expl: "Subject-Verb Agreement: With 'neither/nor', the verb agrees with the closest subject (employees), so it should be 'have been'." },
      { s: "The new software is much more faster than the previous version we used last year.", o: ["much", "more faster", "than", "version"], a: 1, expl: "Comparatives: 'Faster' is already a comparative; adding 'more' is redundant and incorrect." },
      { s: "The professor spoke very clear about the complex biological process.", o: ["spoke", "very", "clear", "complex"], a: 2, expl: "Adjectives vs. Adverbs: Use the adverb 'clearly' to modify the verb 'spoke'." },
      { s: "He is a best student in the class, always achieving top marks on every exam.", o: ["a", "best", "in the class", "achieving"], a: 0, expl: "Superlatives: Use the definite article 'the' with superlative adjectives like 'best'." },
      { s: "The team is interested on learning more about ancient civilizations in South America.", o: ["is", "interested on", "learning", "about"], a: 1, expl: "Prepositions: The correct adjective + preposition combination is 'interested in'." },
      { s: "She enjoys swimming, hiking, and to ride her bicycle in the park on weekends.", o: ["enjoys", "hiking", "to ride", "on weekends"], a: 2, expl: "Parallelism: The list uses gerunds (swimming, hiking), so the third item must be 'riding'." },
      { s: "I don't have many informations about the upcoming international conference.", o: ["don't have", "many", "informations", "upcoming"], a: 2, expl: "Count/Uncount Nouns: 'Information' is uncountable; it cannot be plural and should use 'much' instead of 'many'." },
      { s: "Could you please tell me where is the library located in this building?", o: ["please", "tell me", "where is the library", "located"], a: 2, expl: "Indirect Questions: Use statement word order ('where the library is') when the question is embedded in a statement." }
    ]
  },

  // 📖📖📖 QUESTIONS CODE (START) 📖📖📖
  
  // 8️⃣ PASTE HERE CODE FOR TEST 8 ---- ▶️

8: {
    mc: [
      { q: "If the committee had reviewed the proposal more thoroughly, they ____ the obvious flaws.", o: ["will notice", "would notice", "would have noticed", "had noticed"], a: 2, expl: "Third Conditional: A past unreal situation ('had reviewed') requires 'would have + past participle' in the result clause." },
      { q: "The new environmental regulations are expected ____ into effect by the end of the year.", o: ["to put", "to be put", "putting", "being put"], a: 1, expl: "Passive Infinitive: The regulations do not put themselves into effect; they are 'to be put' into effect by an authority." },
      { q: "By the time the rescue team finally arrived, the stranded hikers ____ their food supplies.", o: ["exhausted", "exhaust", "were exhausting", "had exhausted"], a: 3, expl: "Past Perfect: Use 'had exhausted' to show that the action of finishing the food happened before the past action of the rescue team arriving." },
      { q: "The more densely populated a city becomes, ____ it is to maintain adequate public transportation.", o: ["the more difficult", "more difficult", "it is more difficult", "the most difficult"], a: 0, expl: "Double Comparative: The structure requires 'The + comparative..., the + comparative...' to show cause and effect." },
      { q: "The board members were highly ____ to the proposed changes, leading to a swift approval.", o: ["received", "reception", "comprehensively", "receptive"], a: 3, expl: "Vocabulary/Word Form: Use the adjective 'receptive' (meaning willing to consider new ideas) after the linking verb 'were'." },
      { q: "This ancient artifact is believed to be significantly older ____ previously estimated by archaeologists.", o: ["than", "as was", "than was", "from what"], a: 2, expl: "Comparatives/Passives: The structure compares the age now to what it was thought to be before ('older than [it] was estimated')." },
      { q: "I remember _____ my parents when I went to study abroad.", o: ["to call", "calling", "call", "called"], a: 1, expl: "Verb Patterns: 'Remember' + gerund (-ing) refers to a memory of a past action. You remember doing it." },
      { q: "My brother is going to _______ me his suit because I don’t own one.", o: ["borrow", "present", "wear", "lend"], a: 3, expl: "Vocabulary: 'Lend' means to give something temporarily. 'Borrow' means to take something temporarily." },
      { q: "I started playing well but near the end I _____ focus and made a few mistakes.", o: ["was", "got", "lost", "gave"], a: 2, expl: "Collocations: The correct idiomatic combination is 'to lose focus'." },
      { q: "____ you require further assistance with your application, please do not hesitate to contact our office.", o: ["Should", "If", "Were", "Had"], a: 0, expl: "Conditionals/Inversion: 'Should you require' is a formal inversion of the first conditional 'If you should require' or 'If you require'." }
    ],
    ed: [
      { s: "The researchers realized that they made a critical error in their calculations before publishing the study.", o: ["made", "realized that", "calculations", "before publishing"], a: 0, expl: "Past Perfect: The error happened before they realized it. It should be 'had made'." },
      { s: "Of the two candidates interviewed for the managerial position, Mr. Davis is undoubtedly the most qualified.", o: ["Of the two", "interviewed for", "undoubtedly", "the most"], a: 3, expl: "Comparatives: When comparing exactly two things or people, use the comparative form ('the more qualified'), not the superlative." },
      { s: "The newly constructed bridge was designing to withstand earthquakes of up to 8.0 on the Richter scale.", o: ["newly constructed", "to withstand", "of up to", "designing"], a: 3, expl: "Passive Voice: The bridge receives the action. It should be the past participle 'designed'." },
      { s: "The severe weather conditions had a devastating affect on the region's agricultural output.", o: ["severe", "devastating", "affect", "agricultural"], a: 2, expl: "Vocabulary: 'Affect' is a verb. The noun form required here is 'effect' (to have an effect on)." },
      { s: "If the government will implement stricter tax laws, many small businesses will struggle to survive.", o: ["will implement", "stricter", "will struggle", "to survive"], a: 0, expl: "First Conditional: The 'if' clause must be in the present simple tense ('implements'), not the future tense." },
      { s: "The famous novel was translated to over fifty languages within a decade of its initial publication.", o: ["famous", "was translated", "to", "within"], a: 2, expl: "Prepositions: The correct collocation is 'translated into' a language, not 'to'." },
      { s: "Despite the efforts, they took the decision to stop working late and concentrate on their studies.", o: ["Despite the efforts", "took the decision", "stop working", "concentrate on"], a: 1, expl: "Collocations: In English, you 'make a decision', you do not 'take a decision'." },
      { s: "The climate in the southern region is much more humid than the north.", o: ["The climate", "in the", "much more", "than the north"], a: 3, expl: "Logical Comparisons: You must compare climate to climate. It should be 'than that of the north' or 'than the north's'." },
      { s: "The orchestra had been practiced for months before their opening night performance at the national theater.", o: ["The orchestra", "for months", "had been practiced", "opening night"], a: 2, expl: "Past Perfect Continuous: The orchestra was actively doing the practicing. It should be the active 'had been practicing'." },
      { s: "The CEO was completely oblivious of the growing dissatisfaction among the lower-level employees.", o: ["oblivious of", "completely", "growing", "among"], a: 0, expl: "Prepositions/Collocations: The correct adjective + preposition combination is 'oblivious to'." }
    ]
  },

  // 📖📖📖 QUESTIONS CODE (START) 📖📖📖
  
  // 9️⃣ PASTE HERE CODE FOR TEST 9 ---- ▶️

  // 📖📖📖 QUESTIONS CODE (START) 📖📖📖
  
  // 7️⃣ PASTE HERE CODE FOR TEST 7 ---- ▶️
  // 8️⃣ PASTE HERE CODE FOR TEST 8 ---- ▶️
  // 9️⃣ PASTE HERE CODE FOR TEST 9 ---- ▶️
  
  // 📖📖📖 QUESTIONS CODE (END) 📖📖📖

};

// ---------------- STATE & LOGIC ----------------

let currentTest = 1;
let index = 0;        
let score = 0;
let mistakes = []; 
let startTime;
let timerInterval;
let magicMode = false;
const magicColors = ["#F9D9D8", "#FCEED9", "#EBFEDB", "#DFFEEB", "#E5DFFF"];

function startTest(testNum) {
  currentTest = testNum;
  index = 0;
  score = 0;
  mistakes = [];
  startTime = Date.now();
  startTimerUI();
  render();
}

function startTimerUI() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = Math.floor(elapsed / 60);
    const secs = elapsed % 60;
    const display = document.getElementById("timer-display");
    if (display) display.innerText = `Time: ${mins}:${secs < 10 ? '0' : ''}${secs}`;
  }, 1000);
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = `<div id="timer-display">Time: 0:00</div>`;

  if (index === 20) {
    clearInterval(timerInterval);
    const totalTimeSec = Math.floor((Date.now() - startTime) / 1000);
    const avgTime = (totalTimeSec / 20).toFixed(1);

    let reviewHTML = "";
    if (mistakes.length > 0) {
      reviewHTML = `<div class="section-title">Mistake Review</div>`;
      mistakes.forEach(m => {
        const qText = m.q.q || m.q.s;
        const userChoice = m.q.o[m.userIdx];
        const correctChoice = m.q.o[m.q.a];
        reviewHTML += `
          <div class="review-card">
            <span class="review-q">${qText}</span>
            <div class="review-detail">
              <span class="wrong-text">Your Answer:</span> ${String.fromCharCode(97+m.userIdx)}. ${userChoice}<br>
              <span class="correct-text">Correct Answer:</span> ${String.fromCharCode(97+m.q.a)}. ${correctChoice}<br><br>
              <strong>Why?</strong> ${m.q.expl || "Explanation coming soon."}
            </div>
          </div>`;
      });
    } else {
      reviewHTML = `<p style="text-align:center;">🎯 Perfect Score!</p>`;
    }

    app.innerHTML = `
      <h2>🎉 Test Complete!</h2>
      <div class="stats-box">
        <div>Score: ${score}/20</div>
        <div>Total Time: ${Math.floor(totalTimeSec/60)}m ${totalTimeSec%60}s</div>
        <div>Avg: ${avgTime}s/q</div>
      </div>
      ${reviewHTML}
      <button class="next-btn" onclick="backToMenu()">⬅ Back to Main Menu</button>
    `;
    
    // Ensures the background reverts to white for the results screen
    applyMagicColor(); 
    return;
  }

  const currentData = tests[currentTest];
  const q = (index < 10) ? currentData.mc[index] : currentData.ed[index - 10];
  const text = q.q || q.s;
  const opts = q.o;
  const correct = q.a;

  app.innerHTML += `
    <div class="section-title">${index < 10 ? "Multiple Choice" : "Error Detection"}</div>
    <div class="question">${text}</div>
    <div class="options">
      ${opts.map((o,i)=>`<button onclick="check(${i}, ${correct}, this)">${String.fromCharCode(97+i)}. ${o}</button>`).join("")}
    </div>
    <div class="footer">Question ${index + 1} of 20</div>
  `;

  // CRITICAL: This is now safely at the very bottom, applying colors AFTER buttons exist
  applyMagicColor();
}

function check(choice, correct, btn) {
  const currentData = tests[currentTest];
  const qObj = (index < 10) ? currentData.mc[index] : currentData.ed[index - 10];
  
  document.querySelectorAll(".options button").forEach(b=>b.disabled=true);

  if (choice === correct) {
    score++;
    btn.classList.add("correct-choice");
    document.getElementById("app").innerHTML += `<div class="feedback">✅ Correct</div>`;
  } else {
    btn.classList.add("incorrect-choice");
    mistakes.push({ q: qObj, userIdx: choice });
    document.getElementById("app").innerHTML += `<div class="feedback">❌ Incorrect</div>`;
  }

  if (index === 9) {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="showTransition()">Next Section</button>`;
  } else if (index === 19) {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="index++; render()">Show Results</button>`;
  } else {
    document.getElementById("app").innerHTML += `<button class="next-btn" onclick="index++; render()">Next Question</button>`;
  }
}

function showTransition() {
  index = 10;
applyMagicColor();
  document.getElementById("app").innerHTML = `
    <div id="timer-display"></div>
    <div class="question" style="text-align:center; margin-top:50px;">Ready for Section 2:<br><strong>Error Detection</strong></div>
    <button class="next-btn" onclick="render()">Start Section</button>
  `;
}

function backToMenu() {
  clearInterval(timerInterval);
index = -1; applyMagicColor();
  document.getElementById("app").innerHTML = `
    <div class="section-title">Select a Test</div>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(1)">Test 1</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(2)">Test 2</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(3)">Test 3</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(4)">Test 4</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(5)">Test 5</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(6)">Test 6</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(7)">Test 7</button>
    <button class="next-btn" style="margin-bottom: 10px;" onclick="startTest(8)">Test 8</button>
    `;
  applyMenuLocks();
}
function applyMenuLocks() {
  var menuBtns = document.querySelectorAll('#app button');
  menuBtns.forEach(function(btn) {
    var match = btn.getAttribute('onclick') && btn.getAttribute('onclick').match(/startTest\((\d+)\)/);
    if (match) {
      var testNum = parseInt(match[1]);
      if (_allowedTests.indexOf(testNum) === -1) {
        btn.style.opacity = '0.45';
        btn.style.background = '#888';
        btn.style.cursor = 'pointer';
        if (!btn.textContent.startsWith('🔒')) btn.textContent = '🔒 ' + btn.textContent.trim();
        btn.setAttribute('onclick', 'window.parent.postMessage({type:"showModal"}, "*")');
      }
    }
  });
}
function toggleMagicMode() {
  magicMode = !magicMode;
  const btn = document.getElementById("magic-toggle");
  if (magicMode) {
    btn.classList.add("active");
  } else {
    btn.classList.remove("active");
  }
  applyMagicColor();
}

function applyMagicColor() {
  if (magicMode && index >= 0 && index < 20) {
    // 1. Grab the specific color for this question
    const currentColor = magicColors[index % magicColors.length];
    
    // 2. Paint the background
    document.body.style.backgroundColor = currentColor;
    
    // 3. Paint the buttons the exact same color
    const optionBtns = document.querySelectorAll(".options button");
    optionBtns.forEach(btn => {
      btn.style.backgroundColor = currentColor;
    });
  } else {
    // Revert everything to white if the wand is off or we are on a menu
    document.body.style.backgroundColor = "#ffffff";
    const optionBtns = document.querySelectorAll(".options button");
    optionBtns.forEach(btn => {
      btn.style.backgroundColor = "#ffffff";
    });
  }  
}
</script>
