<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ePeak Irregular Verbs Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0D3B6F;
      --navy-2: #0A315D;
      --purple: #470074;
      --purple-2: #5E1490;
      --soft-purple: #F4ECFA;
      --soft-blue-2: #EAF3FF;
      --ink: #1F2937;
      --muted: #64748B;
      --bg: #F7F9FC;
      --surface: #FFFFFF;
      --border: #E5E7EB;
      --soft-blue: #EEF4FF;
      --blue: #0D3B6F;
      --green: #16A34A;
      --amber: #F59E0B;
      --red: #DC2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }

    .app {
      min-height: 100vh;
    }

    main {
      padding: 34px;
      max-width: 1120px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 32px;
      line-height: 1.1;
      color: var(--navy);
      font-weight: 800;
    }

    .subtitle {
      margin: 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(88px, 1fr));
      gap: 10px;
      min-width: 300px;
    }

    .stat {
      min-height: 72px;
      padding: 13px 14px;
      background: var(--surface);
      border: 1px solid rgba(71, 0, 116, 0.13);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .stat strong {
      display: block;
      color: var(--navy);
      font-size: 22px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .practice-card {
      max-width: 980px;
      background: var(--surface);
      border: 1px solid rgba(71, 0, 116, 0.16);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(71, 0, 116, 0.13);
      background: linear-gradient(90deg, var(--soft-blue-2), var(--soft-purple));
    }

    .card-title {
      margin: 0;
      color: var(--navy);
      font-size: 18px;
      font-weight: 800;
    }

    .mode-badge {
      border-radius: 999px;
      padding: 6px 10px;
      background: #fff;
      color: var(--purple);
      border: 1px solid rgba(71, 0, 116, 0.14);
      font-size: 12px;
      font-weight: 800;
    }

    .question {
      padding: 34px 28px 30px;
    }

    .verb-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
      align-items: end;
    }

    .form-slot {
      min-width: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .shown-form,
    input {
      width: 100%;
      min-height: 62px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font: inherit;
      font-size: 22px;
      font-weight: 700;
    }

    .shown-form {
      display: flex;
      align-items: center;
      padding: 14px 16px;
      background: linear-gradient(135deg, var(--soft-blue-2), var(--soft-purple));
      border-color: rgba(71, 0, 116, 0.2);
      color: var(--navy);
    }

    input {
      padding: 14px 16px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }

    input:focus {
      border-color: var(--purple-2);
      box-shadow: 0 0 0 4px rgba(13, 59, 111, 0.12), 0 0 0 1px rgba(71, 0, 116, 0.1);
    }

    input.correct {
      border-color: rgba(22, 163, 74, 0.7);
      background: rgba(22, 163, 74, 0.06);
    }

    input.incorrect {
      border-color: rgba(220, 38, 38, 0.7);
      background: rgba(220, 38, 38, 0.06);
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 22px;
    }

    button {
      min-height: 44px;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      border: 1px solid var(--navy);
      box-shadow: 0 8px 18px rgba(13, 59, 111, 0.18);
    }

    .btn-primary:hover {
      background: var(--purple);
      border-color: var(--purple);
    }

    .btn-secondary {
      background: #fff;
      color: var(--navy);
      border: 1px solid rgba(13, 59, 111, 0.22);
    }

    .btn-secondary:hover {
      background: var(--soft-blue-2);
    }

    .feedback {
      min-height: 58px;
      margin-top: 18px;
      padding: 13px 15px;
      border-radius: 8px;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.45;
    }

    .feedback.success {
      color: #166534;
      background: rgba(22, 163, 74, 0.08);
      border-color: rgba(22, 163, 74, 0.18);
    }

    .feedback.error {
      color: #991b1b;
      background: rgba(220, 38, 38, 0.08);
      border-color: rgba(220, 38, 38, 0.18);
    }

    .answer-key {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .answer-chip {
      border-radius: 999px;
      padding: 7px 10px;
      background: var(--soft-purple);
      border: 1px solid rgba(71, 0, 116, 0.14);
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
    }

    @media (max-width: 860px) {
      main {
        padding: 22px 16px;
      }

      .topbar {
        flex-direction: column;
      }

      .stats {
        width: 100%;
        min-width: 0;
      }
    }

    @media (max-width: 680px) {
      h1 {
        font-size: 28px;
      }

      .verb-grid {
        grid-template-columns: 1fr;
      }

      .question {
        padding: 24px 18px;
      }

      .shown-form,
      input {
        min-height: 56px;
        font-size: 20px;
      }

      .actions {
        align-items: stretch;
      }

      button {
        flex: 1;
        padding: 0 12px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <main>
      <section class="topbar" aria-labelledby="page-title">
        <div>
          <h1 id="page-title">Irregular Verbs Practice</h1>
          <p class="subtitle">Complete the two missing forms. Some verbs accept more than one correct answer, including alternate spellings and the present forms of be.</p>
        </div>
        <div class="stats" aria-label="Practice progress">
          <div class="stat">
            <strong id="attemptedCount">0</strong>
            <span>Attempted</span>
          </div>
          <div class="stat">
            <strong id="correctCount">0</strong>
            <span>Correct</span>
          </div>
          <div class="stat">
            <strong id="verbCount">0</strong>
            <span>Verbs</span>
          </div>
        </div>
      </section>

      <section class="practice-card" aria-live="polite">
        <div class="card-header">
          <h2 class="card-title">Current verb</h2>
          <span class="mode-badge" id="shownMode">Shuffled form</span>
        </div>
        <div class="question">
          <div class="verb-grid" id="verbGrid"></div>
          <div class="actions">
            <button class="btn-primary" id="checkButton" type="button">Check answers</button>
            <button class="btn-secondary" id="nextButton" type="button">Next verb</button>
          </div>
          <div class="feedback" id="feedback">Type the missing forms, then check your answers.</div>
          <div class="answer-key" id="answerKey" hidden></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const verbs = [
      { base: ["be", "am", "is", "are"], past: ["was", "were"], participle: ["been"] },
      { base: ["beat"], past: ["beat"], participle: ["beaten"] },
      { base: ["become"], past: ["became"], participle: ["become"] },
      { base: ["begin"], past: ["began"], participle: ["begun"] },
      { base: ["bend"], past: ["bent"], participle: ["bent"] },
      { base: ["bet"], past: ["bet"], participle: ["bet"] },
      { base: ["bite"], past: ["bit"], participle: ["bitten"] },
      { base: ["blow"], past: ["blew"], participle: ["blown"] },
      { base: ["break"], past: ["broke"], participle: ["broken"] },
      { base: ["bring"], past: ["brought"], participle: ["brought"] },
      { base: ["broadcast"], past: ["broadcast"], participle: ["broadcast"] },
      { base: ["build"], past: ["built"], participle: ["built"] },
      { base: ["burst"], past: ["burst"], participle: ["burst"] },
      { base: ["buy"], past: ["bought"], participle: ["bought"] },
      { base: ["catch"], past: ["caught"], participle: ["caught"] },
      { base: ["choose"], past: ["chose"], participle: ["chosen"] },
      { base: ["come"], past: ["came"], participle: ["come"] },
      { base: ["cost"], past: ["cost"], participle: ["cost"] },
      { base: ["creep"], past: ["crept"], participle: ["crept"] },
      { base: ["cut"], past: ["cut"], participle: ["cut"] },
      { base: ["deal"], past: ["dealt"], participle: ["dealt"] },
      { base: ["dig"], past: ["dug"], participle: ["dug"] },
      { base: ["do"], past: ["did"], participle: ["done"] },
      { base: ["draw"], past: ["drew"], participle: ["drawn"] },
      { base: ["drink"], past: ["drank"], participle: ["drunk"] },
      { base: ["drive"], past: ["drove"], participle: ["driven"] },
      { base: ["eat"], past: ["ate"], participle: ["eaten"] },
      { base: ["fall"], past: ["fell"], participle: ["fallen"] },
      { base: ["feed"], past: ["fed"], participle: ["fed"] },
      { base: ["feel"], past: ["felt"], participle: ["felt"] },
      { base: ["fight"], past: ["fought"], participle: ["fought"] },
      { base: ["find"], past: ["found"], participle: ["found"] },
      { base: ["flee"], past: ["fled"], participle: ["fled"] },
      { base: ["fly"], past: ["flew"], participle: ["flown"] },
      { base: ["forbid"], past: ["forbade"], participle: ["forbidden"] },
      { base: ["forget"], past: ["forgot"], participle: ["forgotten"] },
      { base: ["forgive"], past: ["forgave"], participle: ["forgiven"] },
      { base: ["freeze"], past: ["froze"], participle: ["frozen"] },
      { base: ["get"], past: ["got"], participle: ["gotten"] },
      { base: ["give"], past: ["gave"], participle: ["given"] },
      { base: ["go"], past: ["went"], participle: ["gone"] },
      { base: ["grow"], past: ["grew"], participle: ["grown"] },
      { base: ["hang"], past: ["hung"], participle: ["hung"] },
      { base: ["have"], past: ["had"], participle: ["had"] },
      { base: ["hear"], past: ["heard"], participle: ["heard"] },
      { base: ["hide"], past: ["hid"], participle: ["hidden"] },
      { base: ["hit"], past: ["hit"], participle: ["hit"] },
      { base: ["hold"], past: ["held"], participle: ["held"] },
      { base: ["hurt"], past: ["hurt"], participle: ["hurt"] },
      { base: ["keep"], past: ["kept"], participle: ["kept"] },
      { base: ["kneel"], past: ["knelt"], participle: ["knelt"] },
      { base: ["know"], past: ["knew"], participle: ["known"] },
      { base: ["lay"], past: ["laid"], participle: ["laid"] },
      { base: ["lead"], past: ["led"], participle: ["led"] },
      { base: ["learn"], past: ["learned", "learnt"], participle: ["learned", "learnt"] },
      { base: ["leave"], past: ["left"], participle: ["left"] },
      { base: ["lend"], past: ["lent"], participle: ["lent"] },
      { base: ["let"], past: ["let"], participle: ["let"] },
      { base: ["lie"], past: ["lay"], participle: ["lain"] },
      { base: ["light"], past: ["lit"], participle: ["lit"] },
      { base: ["lose"], past: ["lost"], participle: ["lost"] },
      { base: ["make"], past: ["made"], participle: ["made"] },
      { base: ["mean"], past: ["meant"], participle: ["meant"] },
      { base: ["meet"], past: ["met"], participle: ["met"] },
      { base: ["pay"], past: ["paid"], participle: ["paid"] },
      { base: ["put"], past: ["put"], participle: ["put"] },
      { base: ["read"], past: ["read"], participle: ["read"] },
      { base: ["ride"], past: ["rode"], participle: ["ridden"] },
      { base: ["ring"], past: ["rang"], participle: ["rung"] },
      { base: ["rise"], past: ["rose"], participle: ["risen"] },
      { base: ["run"], past: ["ran"], participle: ["run"] },
      { base: ["say"], past: ["said"], participle: ["said"] },
      { base: ["see"], past: ["saw"], participle: ["seen"] },
      { base: ["seek"], past: ["sought"], participle: ["sought"] },
      { base: ["sell"], past: ["sold"], participle: ["sold"] },
      { base: ["send"], past: ["sent"], participle: ["sent"] },
      { base: ["set"], past: ["set"], participle: ["set"] },
      { base: ["sew"], past: ["sewed"], participle: ["sewn", "sewed"] },
      { base: ["shake"], past: ["shook"], participle: ["shaken"] },
      { base: ["shine"], past: ["shone"], participle: ["shone"] },
      { base: ["shoot"], past: ["shot"], participle: ["shot"] },
      { base: ["show"], past: ["showed"], participle: ["shown", "showed"] },
      { base: ["shrink"], past: ["shrank"], participle: ["shrunk"] },
      { base: ["shut"], past: ["shut"], participle: ["shut"] },
      { base: ["sing"], past: ["sang"], participle: ["sung"] },
      { base: ["sink"], past: ["sank"], participle: ["sunk"] },
      { base: ["sit"], past: ["sat"], participle: ["sat"] },
      { base: ["sleep"], past: ["slept"], participle: ["slept"] },
      { base: ["slide"], past: ["slid"], participle: ["slid"] },
      { base: ["speak"], past: ["spoke"], participle: ["spoken"] },
      { base: ["spend"], past: ["spent"], participle: ["spent"] },
      { base: ["spit"], past: ["spat"], participle: ["spat"] },
      { base: ["split"], past: ["split"], participle: ["split"] },
      { base: ["spread"], past: ["spread"], participle: ["spread"] },
      { base: ["spring"], past: ["sprang"], participle: ["sprung"] },
      { base: ["stand"], past: ["stood"], participle: ["stood"] },
      { base: ["steal"], past: ["stole"], participle: ["stolen"] },
      { base: ["stick"], past: ["stuck"], participle: ["stuck"] },
      { base: ["sting"], past: ["stung"], participle: ["stung"] },
      { base: ["stink"], past: ["stank"], participle: ["stunk"] },
      { base: ["strike"], past: ["struck"], participle: ["struck"] },
      { base: ["swear"], past: ["swore"], participle: ["sworn"] },
      { base: ["sweep"], past: ["swept"], participle: ["swept"] },
      { base: ["swim"], past: ["swam"], participle: ["swum"] },
      { base: ["swing"], past: ["swung"], participle: ["swung"] },
      { base: ["take"], past: ["took"], participle: ["taken"] },
      { base: ["teach"], past: ["taught"], participle: ["taught"] },
      { base: ["tear"], past: ["tore"], participle: ["torn"] },
      { base: ["tell"], past: ["told"], participle: ["told"] },
      { base: ["think"], past: ["thought"], participle: ["thought"] },
      { base: ["throw"], past: ["threw"], participle: ["thrown"] },
      { base: ["understand"], past: ["understood"], participle: ["understood"] },
      { base: ["wake"], past: ["woke"], participle: ["woken"] },
      { base: ["wear"], past: ["wore"], participle: ["worn"] },
      { base: ["weep"], past: ["wept"], participle: ["wept"] },
      { base: ["win"], past: ["won"], participle: ["won"] },
      { base: ["write"], past: ["wrote"], participle: ["written"] }
    ];

    const labels = {
      base: "Base form",
      past: "Simple past",
      participle: "Past participle"
    };
    const forms = ["base", "past", "participle"];
    const verbGrid = document.querySelector("#verbGrid");
    const feedback = document.querySelector("#feedback");
    const answerKey = document.querySelector("#answerKey");
    const shownMode = document.querySelector("#shownMode");
    const attemptedCount = document.querySelector("#attemptedCount");
    const correctCount = document.querySelector("#correctCount");
    const verbCount = document.querySelector("#verbCount");
    const checkButton = document.querySelector("#checkButton");
    const nextButton = document.querySelector("#nextButton");

    let current = null;
    let attempted = 0;
    let correct = 0;
    let checkedThisRound = false;

    function normalize(value) {
      return value
        .toLowerCase()
        .trim()
        .replace(/[’']/g, "")
        .replace(/\s*\/\s*/g, "/")
        .replace(/\s+/g, " ");
    }

    function acceptedAnswers(verb, form) {
      const answers = verb[form].flatMap((answer) => {
        const normalized = normalize(answer);
        return normalized.includes("/") ? normalized.split("/") : [normalized];
      });

      if (answers.length > 1) {
        answers.push(answers.join("/"));
        answers.push(answers.join(" "));
      }

      return new Set(answers);
    }

    function displayAnswer(values) {
      return values.join(" / ");
    }

    function sample(items) {
      return items[Math.floor(Math.random() * items.length)];
    }

    function makePrompt() {
      const verb = sample(verbs);
      const shownForm = sample(forms);
      const shownValue = sample(verb[shownForm]);
      return { verb, shownForm, shownValue };
    }

    function renderPrompt() {
      current = makePrompt();
      checkedThisRound = false;
      feedback.className = "feedback";
      feedback.textContent = "Type the missing forms, then check your answers.";
      answerKey.hidden = true;
      answerKey.innerHTML = "";
      shownMode.textContent = `${labels[current.shownForm]} shown`;

      verbGrid.innerHTML = forms.map((form) => {
        if (form === current.shownForm) {
          return `
            <div class="form-slot">
              <label>${labels[form]}</label>
              <div class="shown-form">${current.shownValue}</div>
            </div>
          `;
        }

        return `
          <div class="form-slot">
            <label for="${form}Input">${labels[form]}</label>
            <input id="${form}Input" name="${form}" autocomplete="off" inputmode="text" aria-label="${labels[form]} answer">
          </div>
        `;
      }).join("");

      const firstInput = verbGrid.querySelector("input");
      if (firstInput) firstInput.focus();
    }

    function showAnswerKey() {
      answerKey.innerHTML = forms.map((form) => `
        <span class="answer-chip">${labels[form]}: ${displayAnswer(current.verb[form])}</span>
      `).join("");
      answerKey.hidden = false;
    }

    function checkAnswers() {
      const inputs = Array.from(verbGrid.querySelectorAll("input"));
      const results = inputs.map((input) => {
        const form = input.name;
        const isCorrect = acceptedAnswers(current.verb, form).has(normalize(input.value));
        input.classList.toggle("correct", isCorrect);
        input.classList.toggle("incorrect", !isCorrect);
        return isCorrect;
      });

      const allCorrect = results.every(Boolean);

      if (!checkedThisRound) {
        attempted += 1;
        if (allCorrect) correct += 1;
        checkedThisRound = true;
        attemptedCount.textContent = attempted;
        correctCount.textContent = correct;

        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({
              type: "exerciseComplete",
              exerciseType: "Irregular Verbs",
              exerciseName: "Practice Round",
              score: allCorrect ? 1 : 0,
              maxScore: 1,
              details: {
                shownForm: labels[current.shownForm],
                shownValue: current.shownValue,
                verb: current.verb.base[0]
              }
            }, window.location.origin);
          }
        } catch (error) {}
      }

      if (allCorrect) {
        feedback.className = "feedback success";
        feedback.textContent = "Correct. Nice work.";
        answerKey.hidden = true;
      } else {
        feedback.className = "feedback error";
        feedback.textContent = "Check the highlighted answer. Accepted forms are shown below.";
        showAnswerKey();
      }
    }

    checkButton.addEventListener("click", checkAnswers);
    nextButton.addEventListener("click", renderPrompt);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && document.activeElement && document.activeElement.tagName === "INPUT") {
        checkAnswers();
      }
    });

    verbCount.textContent = verbs.length;
    renderPrompt();
  </script>
</body>
</html>
