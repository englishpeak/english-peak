<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listen and Write | English Peak</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles/brand-tokens.css">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--ep-bg);color:var(--ep-ink);font-family:var(--ep-font-sans)}button,input,textarea{font:inherit}.shell{max-width:860px;margin:auto;padding:32px 20px 72px}.hero{background:var(--ep-gradient-brand);color:#fff;border-radius:24px;padding:32px;margin-bottom:22px;box-shadow:var(--ep-shadow-card)}h1,h2{font-family:var(--ep-font-serif);margin:0}.hero h1{font-size:clamp(2.2rem,7vw,3.5rem)}.hero p{margin:8px 0 0;opacity:.82}.panel{background:#fff;border:1.5px solid var(--ep-border);border-radius:24px;padding:28px;box-shadow:0 12px 36px rgba(13,59,111,.07)}[hidden]{display:none!important}.set-card,.mode{border:1.5px solid var(--ep-border);border-radius:18px;padding:20px;background:#fff}.set-row,.modes,.actions,.stats{display:grid;gap:14px}.set-card{display:flex;align-items:center;justify-content:space-between;gap:20px}.badge{display:inline-block;background:rgba(26,122,74,.12);color:var(--ep-success);border-radius:99px;padding:5px 10px;font-size:.75rem;font-weight:700}.btn{border:1.5px solid var(--ep-border);border-radius:12px;padding:12px 18px;background:#fff;color:var(--ep-navy);font-weight:700;cursor:pointer}.btn.primary,.play{background:var(--ep-gradient-brand);color:#fff;border:0;box-shadow:0 3px 12px rgba(13,59,111,.2)}.btn:disabled{opacity:.5;cursor:not-allowed}.modes{grid-template-columns:repeat(3,1fr);margin:20px 0}.mode{text-align:left;cursor:pointer}.mode strong{display:block;color:var(--ep-navy);font-size:1.05rem}.mode span{color:var(--ep-muted);font-size:.85rem}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.track{height:8px;background:var(--ep-card-soft);border-radius:99px;overflow:hidden;margin-bottom:26px}.track span{display:block;height:100%;background:var(--ep-gradient-brand)}.play{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;border-radius:18px;font-size:1.1rem;font-weight:700;cursor:pointer}.prompt{margin-top:22px;padding:22px;background:var(--ep-card-soft);border-radius:18px;min-height:120px}.word-bank,.answer-zone{display:flex;flex-wrap:wrap;gap:10px;min-height:58px;padding:12px;border:1.5px dashed rgba(13,59,111,.25);border-radius:14px;margin:10px 0}.word{padding:9px 12px;border:1px solid var(--ep-border);border-radius:10px;background:#fff;color:var(--ep-navy);font-weight:600;cursor:pointer}.blank{width:clamp(100px,20vw,150px);border:0;border-bottom:2px solid var(--ep-navy);background:#fff;padding:6px;margin:4px;text-align:center}.full{width:100%;min-height:110px;border:1.5px solid var(--ep-border);border-radius:14px;padding:14px;resize:vertical}.actions{grid-template-columns:1fr 1fr;margin-top:18px}.feedback{margin-top:16px;padding:14px;border-radius:12px;font-weight:700}.feedback.good{background:rgba(26,122,74,.12);color:var(--ep-success)}.feedback.bad{background:rgba(198,40,40,.1);color:var(--ep-error)}.stats{grid-template-columns:repeat(3,1fr);margin:22px 0}.stat{background:var(--ep-card-soft);border-radius:14px;padding:16px;text-align:center}.stat strong{display:block;font-size:1.45rem;color:var(--ep-navy)}.review li{margin:8px 0;color:var(--ep-error)}@media(max-width:640px){.shell{padding:16px 12px 48px}.hero,.panel{padding:20px}.modes,.stats{grid-template-columns:1fr}.set-card{align-items:flex-start;flex-direction:column}.set-card .btn,.actions .btn{width:100%}.actions{grid-template-columns:1fr}.prompt{padding:15px}}
</style></head><body><main class="shell"><header class="hero"><h1>Listen and Write</h1><p>Build listening comprehension, spelling, grammar, and vocabulary through focused dictation.</p></header>
<section id="landing" class="panel"><h2>Choose a set</h2><p>Each set has 10 short audio exercises.</p><div id="sets" class="set-row"></div></section>
<section id="difficulty" class="panel" hidden><button class="btn" data-back>← All sets</button><h2 style="margin-top:20px">Choose your difficulty</h2><div class="modes"><button class="mode" data-mode="easy"><strong>Easy</strong><span>Unscramble the words</span></button><button class="mode" data-mode="medium"><strong>Medium</strong><span>Fill in missing words</span></button><button class="mode" data-mode="hard"><strong>Hard</strong><span>Write the entire sentence</span></button></div></section>
<section id="exercise" class="panel" hidden><div class="topline"><strong id="count"></strong><span id="modeLabel"></span></div><div class="track"><span id="bar"></span></div><button id="play" class="play" type="button">▶ Play</button><audio id="audio" preload="metadata"></audio><div id="prompt" class="prompt"></div><div class="actions"><button id="check" class="btn primary">Check Answer</button><button id="next" class="btn" hidden>Next →</button></div><div id="feedback" aria-live="polite"></div></section>
<section id="results" class="panel" hidden><h2 id="score"></h2><div class="stats"><div class="stat"><strong id="correct"></strong>Correct answers</div><div class="stat"><strong id="incorrect"></strong>Incorrect answers</div><div class="stat"><strong id="completedMode"></strong>Difficulty</div></div><div id="review" class="review"></div><div class="actions"><button id="retry" class="btn primary">Try Again</button><button class="btn" data-back>Back to Listen and Write</button></div></section></main><script type="module" src="/listen-and-write/app.js"></script></body></html>
