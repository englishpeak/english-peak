<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Unscramble the Sentence – English Peak Practice</title>

<style>
/* ── VARS ── */
:root {
  --navy: #0D3B6F;
  --purple: #470074;
  --bg: #ffffff;
  --card: #f4f6fb;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--navy);
}

/* ── UNSCRAMBLE STYLES ── */
#unscramble-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 20px;
}

.container { max-width: 900px; margin: auto; }

h1 { text-align: center; margin-bottom: 6px; }

.top-bar {
  display: flex;
  justify-content: center;
  margin-bottom: 25px;
}

.filter { position: relative; }

.filter button {
  background: none;
  border: 1px solid var(--navy);
  color: var(--navy);
  padding: 8px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 500;
  font-family: inherit;
}

.filter-menu {
  position: absolute;
  top: 45px;
  left: 0;
  background: white;
  border: 1px solid var(--purple);
  border-radius: 10px;
  padding: 12px;
  display: none;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  z-index: 10;
}

.filter-menu label {
  display: block;
  font-size: 14px;
  margin-bottom: 6px;
  cursor: pointer;
}

.card {
  background: var(--card);
  border-radius: 16px;
  padding: 28px;
}

.blanks-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  margin-bottom: 25px;
}

.blanks {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.blank {
  min-width: 90px;
  padding: 10px 12px;
  text-align: center;
  border-bottom: 3px solid var(--purple);
  font-weight: 600;
  cursor: pointer;
}

.blank:first-child { text-transform: capitalize; }

.punctuation {
  font-size: 24px;
  font-weight: 600;
  margin-bottom: -10px;
}

.words {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.word {
  padding: 10px 16px;
  background: linear-gradient(135deg, var(--navy), var(--purple));
  color: white;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  user-select: none;
}

.controls {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 14px;
}

button.action {
  background: var(--navy);
  color: white;
  border: none;
  padding: 10px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: 600;
  font-family: inherit;
}

.feedback {
  text-align: center;
  font-weight: 700;
  margin-top: 18px;
  min-height: 24px;
}

.correct { color: #1a7f37; }
.incorrect { color: #b42318; }
</style>
</head>

  if (window.parent && window.parent !== window) {

      type: 'exerciseComplete',
      exerciseType: exerciseType,
      exerciseName: exerciseName,
      score: score,
      maxScore: maxScore
    }, window.location.origin);
  }
}

// ── LOGIC ──
let currentSentenceParts = [];
let punctuationMark = "";
let _unscTotal = 0;
let _unscBlockCorrect = 0;
let _unscLoggedSessions = 0;
const _UNSC_SESSION_SIZE = 5;

function toggleFilter() {
  const menu = document.getElementById("filterMenu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function getActiveLevels() {
  return [...document.querySelectorAll(".filter-menu input:checked")]
    .map(cb => cb.value);
}

function loadSentence() {
  const pool = sentences.filter(s => getActiveLevels().includes(s.level));
  if (!pool.length) return;

  const chosen = pool[Math.floor(Math.random() * pool.length)];
  punctuationMark = chosen.text.slice(-1);
  const cleanText = chosen.text.slice(0, -1).toLowerCase();
  currentSentenceParts = cleanText.split(" ");

  document.getElementById("feedback").textContent = "";
  document.getElementById("punctuation").textContent = punctuationMark;

  const blanks = document.getElementById("blanks");
  const words = document.getElementById("words");
  blanks.innerHTML = "";
  words.innerHTML = "";

  currentSentenceParts.forEach(() => {
    const b = document.createElement("div");
    b.className = "blank";
    b.onclick = () => {
      if (b.textContent) {
        addWord(b.textContent.toLowerCase());
        b.textContent = "";
      }
    };
    blanks.appendChild(b);
  });

  shuffle([...currentSentenceParts]).forEach(w => addWord(w));
}

function addWord(word) {
  const el = document.createElement("div");
  el.className = "word";
  el.textContent = word;
  el.onclick = () => placeWord(el);
  document.getElementById("words").appendChild(el);
}

function placeWord(el) {
  const blanks = document.querySelectorAll(".blank");
  for (let b of blanks) {
    if (!b.textContent) {
      b.textContent = el.textContent;
      el.remove();
      break;
    }
  }
}

function checkAnswer() {
  const attempt = [...document.querySelectorAll(".blank")]
    .map(b => b.textContent.toLowerCase())
    .join(" ");
  const feedback = document.getElementById("feedback");
  const isCorrect = attempt === currentSentenceParts.join(" ");
  if (isCorrect) {
    feedback.textContent = "✅ Correct!";
    feedback.className = "feedback correct";
    _unscBlockCorrect++;
  } else {
    feedback.textContent = "❌ Not quite. Try again!";
    feedback.className = "feedback incorrect";
  }
  _unscTotal++;
  if (_unscTotal % _UNSC_SESSION_SIZE === 0) {
    _unscLoggedSessions++;
    logActivity('Unscramble', 'Session ' + _unscLoggedSessions, _unscBlockCorrect, _UNSC_SESSION_SIZE);
    _unscBlockCorrect = 0;
  }
}

function shuffle(arr) {
  return arr.sort(() => Math.random() - 0.5);
}
