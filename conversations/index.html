        html, body {

            font-family: "Georgia", serif;
            font-weight: 400;
            overflow: hidden;
            background-color: #F0F4EF;
        }

        .dropdown {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            text-align: center;
        }

        .dropbtn {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0,0,0,0.1);
            padding: 8px 20px;
            font-size: 0.75rem;
            border-radius: 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: "Georgia", serif;
            transition: background 0.3s;
        }

        .dropbtn:hover { background: rgba(255, 255, 255, 0.6); }

        .dropdown-content {
            display: none;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.98);
            min-width: 260px;
            box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            border-radius: 12px;
            margin-top: 8px;
            overflow: hidden;
        }

        .dropdown-content button {
            color: #333;
            padding: 12px 16px;
            display: block;
            width: 100%;
            border: none;
            background: none;
            text-align: center;
            font-family: "Georgia", serif;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .dropdown-content button:hover { background-color: #f1f1f1; }
        .show { display: block; }

        #presentation-space {
            width: 90vw;
            max-width: 1000px;
            aspect-ratio: 16 / 9;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center;
            padding: 5% 10%; 
            box-sizing: border-box;
            position: relative;
        }

        #question-display {
            font-size: clamp(1.3rem, 3.6vw, 2.34rem);
            color: #2c3e50;
            margin-bottom: 40px; 
            line-height: 1.5;
            font-style: italic;
            opacity: 1;
            transition: opacity 0.4s ease;
            max-width: 92%;
        }

        #main-next-btn {
            padding: 8px 24px;
            font-size: 0.7rem;
            font-family: "Georgia", serif;
            color: white;
            background: linear-gradient(135deg, #0D3B6F 0%, #470074 100%);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 12px rgba(13, 59, 111, 0.15);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #main-next-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(71, 0, 116, 0.25); }

        @media (max-width: 768px) {
            #presentation-space { aspect-ratio: auto; min-height: 60vh; }
            .dropdown { top: 15px; }
        }

<script>
var _allowBusiness = false;
(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('business') === '1') _allowBusiness = true;
})();
window.addEventListener('load', function() {
  if(!_allowBusiness){
    document.querySelectorAll('.dropdown-content button, .dropdown-content a').forEach(function(btn){
      if((btn.textContent||'').toLowerCase().indexOf('business')!==-1){
        btn.onclick = function(e) {
          e.preventDefault();
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({type:'showModal'}, window.location.origin);
          } else {
            window.location.href = '/';
          }
        };
        btn.style.opacity='0.5';
        if(btn.textContent.indexOf('🔒')===-1) btn.textContent='🔒 '+btn.textContent;
      }
    });
  }
});
</script></head>

    let currentFilter = 'general';

    function toggleDropdown() { document.getElementById("myDropdown").classList.toggle("show"); }

    function setFilter(filterName, label) {
        currentFilter = filterName;
        const buttonLabel = (label === 'General') ? 'General questions' : label + ' questions';
        document.getElementById("current-filter-label").innerText = buttonLabel;
        document.getElementById("myDropdown").classList.remove("show");
        generateNew();
    }

function generateNew() {
        const activePool = pools[currentFilter];
        if (activePool.length === 0) { document.getElementById('question-display').innerText = "Coming Soon!"; return; }
        
        let randomIndex;
        do { randomIndex = Math.floor(Math.random() * activePool.length); } 
        while (randomIndex === lastIndex && activePool.length > 1);
        lastIndex = randomIndex;
        
        const display = document.getElementById('question-display');
        display.style.opacity = 0;
        
        setTimeout(() => {
            display.innerText = activePool[randomIndex];
            display.style.opacity = 1;
        }, 300);

        // NEW COLOR LOGIC
        let nextColor;
        if (currentFilter === 'business') {
            nextColor = "#FFFFFF"; // Solid white for business
        } else {
            nextColor = colors[Math.floor(Math.random() * colors.length)]; // Random for others
        }
        
        document.body.style.backgroundColor = nextColor;
        document.documentElement.style.backgroundColor = nextColor;
    }

    window.onclick = function(event) {
        if (!event.target.matches('.dropbtn')) {
            var dropdowns = document.getElementsByClassName("dropdown-content");
            for (var i = 0; i < dropdowns.length; i++) {
                if (dropdowns[i].classList.contains('show')) dropdowns[i].classList.remove('show');
            }
        }
    }
    window.onload = generateNew;
