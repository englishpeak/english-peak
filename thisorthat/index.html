<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>This or That? | English Peak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/brand-tokens.css">
  <style>
    html,body{min-height:100%;margin:0}body{min-height:100vh;background:#f0f4ef;color:var(--ep-ink);font-family:"Georgia",serif;transition:background-color 1.2s ease-out;overflow:hidden}
    .activity{width:100%;min-height:100vh;box-sizing:border-box;padding:5vh 5vw;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:inherit;transition:background-color 1.2s ease-out;position:relative}
    .activity-meta{position:absolute;top:25px;left:50%;transform:translateX(-50%);display:flex;align-items:center;white-space:nowrap}
    .eyebrow{padding:8px 20px;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.1);border-radius:20px;font-size:.75rem;font-weight:400;letter-spacing:1px;text-transform:uppercase;color:#2c3e50}
    .presentation-space{width:90vw;max-width:1000px;aspect-ratio:16/9;box-sizing:border-box;padding:5% 10%;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .question{max-width:92%;margin:0 0 40px;font-family:"Georgia",serif;font-size:clamp(1.3rem,3.6vw,2.34rem);font-style:italic;font-weight:400;line-height:1.5;color:#2c3e50;text-wrap:balance;opacity:1;transition:opacity .4s ease}
    .question.changing{opacity:0}
    .controls{display:flex;flex-direction:column-reverse;align-items:center;justify-content:center;gap:10px}
    button{font-family:"Georgia",serif;cursor:pointer}
    .next{padding:8px 24px;background:var(--ep-gradient-brand);color:#fff;border:0;border-radius:50px;font-size:.7rem;box-shadow:0 4px 12px rgba(13,59,111,.15);letter-spacing:1px;text-transform:uppercase;transition:transform .2s,box-shadow .3s}
    .next:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(71,0,116,.25)}
    .previous{padding:7px 10px;background:transparent;color:rgba(44,62,80,.7);border:0;border-radius:20px;font-size:.7rem;text-decoration:underline;text-decoration-color:rgba(44,62,80,.25);text-underline-offset:3px;transition:color .2s,background .2s}
    .previous:hover:not(:disabled){color:#2c3e50;background:rgba(255,255,255,.25)}.previous:disabled{opacity:.3;cursor:not-allowed}
    @media(max-width:768px){.activity{padding:28px 20px}.activity-meta{top:15px;flex-direction:column;gap:7px}.presentation-space{width:100%;min-height:60vh;aspect-ratio:auto;padding:70px 0 20px}.question{max-width:94%;font-size:clamp(1.3rem,7vw,2.15rem);margin-bottom:34px}.next{min-width:140px}}
    @media(prefers-reduced-motion:reduce){body,.activity,.question,.next{transition:none}}
  </style>
</head>
<body>
  <main class="activity" aria-labelledby="question-display">
    <div class="activity-meta">
      <div class="eyebrow">This or That?</div>
    </div>
    <div class="presentation-space">
      <h1 class="question" id="question-display">...</h1>
      <div class="controls">
        <button class="previous" id="previous" type="button">Previous</button>
        <button class="next" id="next" type="button">Next Question</button>
      </div>
    </div>
  </main>

    function shuffle(items) {
      const result = items.slice();
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    let sequence = shuffle(QUESTIONS);
    const BACKGROUNDS = ['#e8f1f5', '#e2f0ed', '#e8f1e3', '#eee9f4', '#f7e9df', '#f6f1d8', '#f3e4e8', '#e7ecdf'];

    function createBackgroundSequence(length) {
      const result = [];
      while (result.length < length) {
        const batch = shuffle(BACKGROUNDS);
        if (result.length && batch[0] === result[result.length - 1]) [batch[0], batch[1]] = [batch[1], batch[0]];
        result.push(...batch);
      }
      return result.slice(0, length);
    }

    let backgroundSequence = createBackgroundSequence(QUESTIONS.length);
    let position = 0;
    const activity = document.querySelector('.activity');
    const questionDisplay = document.getElementById('question-display');
    const previousButton = document.getElementById('previous');

    function render(animate) {
      const update = function() {
        questionDisplay.textContent = sequence[position];
        document.body.style.backgroundColor = backgroundSequence[position];
        activity.style.backgroundColor = backgroundSequence[position];
        previousButton.disabled = position === 0;
        questionDisplay.classList.remove('changing');
      };
      if (animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        questionDisplay.classList.add('changing');
        window.setTimeout(update, 200);
      } else update();
    }

    function nextQuestion() {
      if (position < sequence.length - 1) position += 1;
      else { sequence = shuffle(QUESTIONS); backgroundSequence = createBackgroundSequence(QUESTIONS.length); position = 0; }
      render(true);
    }

    function previousQuestion() {
      if (position === 0) return;
      position -= 1;
      render(true);
    }

    document.getElementById('next').addEventListener('click', nextQuestion);
    previousButton.addEventListener('click', previousQuestion);
    render(false);
  </script>
</body>
</html>
