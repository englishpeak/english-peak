            { type: 'academic-reading', title: 'Task 20: Academic Talk - Fresco Painting', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/bqpp1tbdg6rod8lmalnm1/Task-20.mp3?rlkey=skz08k13fz23d7uhtih00b5jn&st=axci3nzn&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today we will examine the ancient artistic technique known as fresco painting. The word \'fresco\' comes from the Italian word for \'fresh\'. In this method, the artist applies water-based pigments directly onto a layer of wet, fresh plaster on a wall or ceiling. As the plaster dries, a chemical reaction binds the pigment to the surface, making the painting an actual, physical part of the wall rather than just resting on top of it. Because the plaster dries rapidly, artists must work quickly and accurately, painting only small sections at a time."</div>', questions: [

            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"We are currently discussing modern corporate structures. Do you believe that companies should allow all their employees to work from home permanently, or is maintaining a physical office space essential for a successful business?\"\n\n<b>Student A (David):</b>\n\"I strongly support working from home. It saves employees time and money since they don't have to commute, which leads to higher job satisfaction. Plus, the company saves a fortune on renting office space and paying utility bills.\"\n\n<b>Student B (Sarah):</b>\n\"I think physical offices are necessary. When people work from home, it's very hard to collaborate creatively or build a strong team culture. Spontaneous conversations in the hallway often lead to the best ideas, and you lose that entirely through video calls.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with David, Sarah, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: Geothermal Energy', canSkip: true, text: 'Geothermal energy is a renewable resource derived from the Earth\'s internal heat. This heat originates from the radioactive decay of minerals deep within the planet\'s core. To harness this power, deep wells are drilled into underground reservoirs of hot water and steam. The high-pressure steam is then piped to the surface, where it spins a turbine connected to an electrical generator. Unlike solar or wind power, which are dependent on weather conditions and time of day, geothermal power plants can operate continuously, providing a stable and reliable baseload of electricity. However, the geographic availability of geothermal energy is limited, as plants must be built near tectonic plate boundaries where the Earth\'s crust is thin enough to easily access the heat.', questions: [{ q: "What is the original source of the heat used in geothermal energy?", options: ["Friction from ocean currents.", "Heat absorbed from the sun.", "Burning fossil fuels underground.", "The radioactive decay of minerals in the Earth's core."], correct: 3 }, { q: "What is a major advantage of geothermal energy over solar and wind power?", options: ["It operates continuously regardless of weather or time.", "It is much cheaper to build the facilities.", "It can be installed in absolutely any location.", "It requires absolutely zero drilling."], correct: 0 }, { q: "Why is the geographic availability of geothermal energy limited?", options: ["Governments heavily restrict where plants can be built.", "It requires massive amounts of empty desert land.", "Plants must be built near tectonic plate boundaries.", "The necessary drilling equipment is very rare."], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 23: The Printing Press', canSkip: true, text: 'The invention of the mechanical movable type printing press by Johannes Gutenberg in the 15th century is widely considered one of the most important events in human history. Prior to this invention, books were painstakingly copied by hand, making them incredibly expensive and accessible only to the wealthy elite and the clergy. Gutenberg\'s press utilized metal alloy type blocks and an oil-based ink to rapidly stamp pages, dramatically reducing the cost and time required to produce literature. This mass production of books led to an unprecedented spread of knowledge across Europe. It fueled the Renaissance, accelerated scientific discovery by allowing scholars to easily share their findings, and significantly increased literacy rates among the general public.', questions: [{ q: "How were books primarily produced before the invention of the printing press?", options: ["They were carved into stone tablets.", "They were painstakingly copied by hand.", "They were printed using wooden blocks.", "They were dictated verbally and never written down."], correct: 1 }, { q: "What materials did Gutenberg use to make his printing press successful?", options: ["Silk paper and water-based paints.", "Heated clay and pressed charcoal.", "Digital screens and laser technology.", "Metal alloy type blocks and oil-based ink."], correct: 3 }, { q: "What was a major societal impact of the mass production of books?", options: ["It significantly increased literacy rates among the public.", "It caused a massive economic depression.", "It led to the immediate collapse of the Roman Empire.", "It stopped the progress of scientific discovery."], correct: 0 }] },
            { type: 'academic-reading', title: 'Task 24: Echolocation in Bats', canSkip: true, text: 'Bats are the only mammals capable of sustained flight, but their most remarkable adaptation is echolocation. To navigate and hunt in total darkness, a bat emits high-frequency sound waves from its mouth or nose. These sound waves travel through the air until they hit an object, at which point they bounce back as echoes. By processing the exact time it takes for the echo to return and the shift in the sound\'s pitch, the bat\'s highly developed brain can instantly determine the size, shape, distance, and even the texture of the object. This biological sonar system is so precise that a bat can detect an insect as thin as a human hair while flying at top speed through a dense forest.', questions: [{ q: "How do bats create the sound waves used for echolocation?", options: ["By rapidly flapping their wings together.", "By scratching their claws against tree bark.", "By emitting high-frequency sounds from their mouth or nose.", "By vibrating their tail muscles."], correct: 2 }, { q: "What information does a bat gain by analyzing returning echoes?", options: ["The exact age of the object it is sensing.", "The size, shape, distance, and texture of an object.", "The color and brightness of the insect.", "The temperature of the surrounding air."], correct: 1 }, { q: "How precise is a bat's echolocation system according to the text?", options: ["It can only detect objects larger than a bird.", "It fails when the bat is flying at top speed.", "It only works in completely open fields.", "It can detect an insect as thin as a human hair."], correct: 3 }] },

            // LISTEN TO AN ACADEMIC TALK
            { type: 'academic-reading', title: 'Task 19: Academic Talk - Bioluminescence', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/r876yu110zc34wwrd56fq/Task-19.mp3?rlkey=xbbuxubuq56bzd1cztgqi1295&st=8ddk4vmj&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today we are looking at bioluminescence, the fascinating ability of certain organisms to produce and emit light. This phenomenon occurs widely in marine vertebrates and invertebrates. It is primarily driven by a chemical reaction involving a light-emitting molecule called luciferin. In the deep ocean, where sunlight cannot reach, creatures use this self-generated light for various survival strategies. Some use it to attract mates, others use it to lure unsuspecting prey, and some even use sudden flashes of light to startle and evade dangerous predators."</div>', questions: [
                { q: "What is the primary chemical component responsible for bioluminescence?", options: ["A light-emitting molecule called luciferin.", "Photosynthetic algae.", "A heavy metal element found in ocean rock.", "Electric currents generated by ocean friction."], correct: 0 },
                { q: "According to the professor, why might a deep-ocean creature use a sudden flash of light?", options: ["To heat the surrounding water.", "To startle and evade dangerous predators.", "To navigate through narrow caves.", "To communicate with surface ships."], correct: 1 }
            ]},
            
            { type: 'academic-reading', title: 'Task 20: Academic Talk - History of Photography', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/hy4ncs5gvl9krn3jshrqi/Task-20.mp3?rlkey=rsgro4bwvvn29d5eyzmoj3bek&st=gnh17fgr&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s discuss the early history of photography, specifically the daguerreotype. Introduced in 1839 by Louis Daguerre, this was the first publicly available photographic process. Unlike modern photos, a daguerreotype was a unique image on a silvered copper plate; it could not be reproduced or printed multiple times. The subject had to sit completely still for several minutes because the exposure times were incredibly long. Despite these limitations, it was revolutionary, allowing middle-class families to have portraits made for the first time, a privilege previously reserved only for the wealthy who could afford painted portraits."</div>', questions: [
                { q: "What was a major limitation of the daguerreotype process?", options: ["It required incredibly expensive modern printing machines.", "The photos would instantly fade in sunlight.", "It could not be reproduced or printed multiple times.", "It only worked for landscape photography."], correct: 2 },
                { q: "Why did subjects have to sit completely still for several minutes?", options: ["Because the silvered copper plate was fragile.", "Because the exposure times were incredibly long.", "To avoid distracting the photographer.", "Because the flash was extremely bright."], correct: 1 }
            ]},

            // ACADEMIC DISCUSSION (Writing)
            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"Today, space agencies spend billions of dollars on missions to explore Mars and the deeper solar system. Do you think this massive financial investment in space exploration is justified, or should that money be redirected to solve pressing problems here on Earth?\"\n\n<b>Student A (Michael):</b>\n\"I believe space exploration is entirely justified. The technologies we invent to survive in space often lead to massive breakthroughs on Earth, like improved solar panels and medical imaging. Plus, finding new resources in space might eventually save humanity.\"\n\n<b>Student B (Jessica):</b>\n\"I strongly disagree. We have critical problems on Earth right now, like climate change, poverty, and ocean pollution. Spending billions to send a robot to a dead planet feels irresponsible when we haven't even fixed our own home yet.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Michael, Jessica, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The Rosetta Stone', canSkip: true, text: 'The Rosetta Stone is one of the most famous archaeological discoveries in history. Found by French soldiers in Egypt in 1799, the stone is a fragment of a larger stele that displays a decree issued in 196 BCE. What makes the stone extraordinarily valuable is that the exact same decree is inscribed in three different scripts: Ancient Egyptian hieroglyphs, Demotic script, and Ancient Greek. Prior to its discovery, the ability to read hieroglyphs had been lost for over a thousand years. By using the known Greek text as a comparative key, scholars, most notably Jean-François Champollion, were finally able to decipher the hieroglyphs, unlocking the secrets of ancient Egyptian history, culture, and literature.', questions: [{ q: "Who originally discovered the Rosetta Stone in 1799?", options: ["Jean-François Champollion.", "British archaeologists.", "French soldiers.", "Ancient Greek historians."], correct: 2 }, { q: "Why was the stone so extraordinarily valuable to historians?", options: ["It was made of solid gold.", "It contained the same text in three different scripts.", "It held a map to hidden pharaoh tombs.", "It was the oldest rock ever found on Earth."], correct: 1 }, { q: "What did deciphering the stone ultimately allow scholars to do?", options: ["Unlock the secrets of ancient Egyptian history and culture.", "Predict future eclipses and astronomical events.", "Translate the lost Demotic language into English.", "Discover the exact location of the lost city of Atlantis."], correct: 0 }] },
            { type: 'academic-reading', title: 'Task 23: The Great Barrier Reef', canSkip: true, text: 'Located off the coast of Queensland, Australia, the Great Barrier Reef is the world\'s largest coral reef system, stretching for over 2,300 kilometers. It is so massive that it can actually be seen from outer space. The reef is incredibly biologically diverse, serving as a critical habitat for thousands of species of fish, mollusks, sea turtles, and sharks. However, the reef currently faces severe environmental threats. Rising ocean temperatures caused by global climate change lead to coral bleaching, a stress response where corals expel the symbiotic algae living in their tissues, turning them completely white and leaving them vulnerable to starvation and disease.', questions: [{ q: "What geographic distinction does the Great Barrier Reef hold?", options: ["It is the world's largest coral reef system.", "It is the deepest trench in the global ocean.", "It is the only reef system in the Southern Hemisphere.", "It is completely man-made."], correct: 0 }, { q: "Which of the following is cited as a severe threat to the reef?", options: ["Overpopulation of sea turtles.", "Rising ocean temperatures caused by climate change.", "An increase in deep-sea volcanic eruptions.", "Excessive algae growth blocking the sunlight."], correct: 1 }, { q: "What happens during coral bleaching?", options: ["Corals absorb too much sunlight and turn black.", "Corals expel their symbiotic algae and turn white.", "Corals migrate to colder waters.", "Corals rapidly reproduce to fight off disease."], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 24: The Industrial Revolution', canSkip: true, text: 'The Industrial Revolution, which began in Britain in the late 18th century, marked a profound transition from agrarian, hand-craft economies to machine-driven manufacturing. Central to this transformation was the invention and refinement of the steam engine. Originally developed to pump water out of coal mines, the steam engine was soon adapted to power massive textile mills and, eventually, locomotives and steamships. This shift allowed goods to be produced on a massive scale at significantly lower costs. While it led to unprecedented economic growth and the rise of modern capitalism, it also resulted in severe social consequences, including harsh working conditions, rapid urbanization, and significant environmental pollution.', questions: [{ q: "What characterized the shift during the Industrial Revolution?", options: ["A transition from machine manufacturing to agriculture.", "A move towards exclusive hand-crafted goods.", "A transition from agrarian economies to machine-driven manufacturing.", "A sudden focus on global digital trade."], correct: 2 }, { q: "What was the original purpose of the early steam engine?", options: ["To power massive textile mills.", "To propel river steamships.", "To pump water out of coal mines.", "To operate early passenger trains."], correct: 2 }, { q: "Which of the following was a negative social consequence of the Industrial Revolution?", options: ["Harsh working conditions and significant environmental pollution.", "A massive decrease in overall economic growth.", "The collapse of modern capitalism.", "A return to feudal farming systems."], correct: 0 }] },

            { type: 'academic-reading', title: 'Task 19: Academic Talk - Astronomy', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/epnu0y9pstbco340896qp/Task-19.mp3?rlkey=ztrd8nspcl7ny2hrqine9bxon&st=uoevnh2a&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today we will discuss exoplanets, which are planets that orbit stars outside our own solar system. Detecting them is incredibly difficult because they are completely obscured by the blinding light of their host stars. Therefore, astronomers typically use the transit method. They monitor a star\'s brightness over time. If a star dims slightly at regular intervals, it indicates that an exoplanet is passing directly in front of it, blocking a tiny fraction of its light."</div>', questions: [
                { q: "Why is it incredibly difficult to detect exoplanets?", options: ["They are always located behind black holes.", "They move too fast for modern telescopes to track.", "They are completely obscured by the blinding light of their host stars.", "They are made of dark matter that absorbs all light."], correct: 2 },
                { q: "How does the 'transit method' help astronomers find exoplanets?", options: ["By listening for radio signals from alien civilizations.", "By monitoring a star's brightness over time to see if it dims.", "By launching probes to orbit the host star.", "By measuring the gravitational pull on nearby moons."], correct: 1 }
            ]},
            
            { type: 'academic-reading', title: 'Task 20: Academic Talk - Botany', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/ixas7c1gpjzapx5ghukqk/Task-20.mp3?rlkey=3jmsc2vex4fxlvo5ufcwws1q8&st=ftuf4tib&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s explore the hidden world beneath our feet: mycorrhizal networks. Often called the \'wood wide web,\' this is a complex, symbiotic network of fungi that connects the roots of different trees in a forest. The trees provide the fungi with liquid sugar produced through photosynthesis. In return, the fungi scavenge the soil for essential nutrients like phosphorus and nitrogen, delivering them back to the trees. Remarkably, older trees can even use this network to send emergency nutrients to younger, struggling saplings."</div>', questions: [

                { q: "What remarkable ability do older trees have thanks to this network?", options: ["They can physically move their roots to find better soil.", "They can block sunlight from reaching rival trees.", "They can send emergency nutrients to struggling saplings.", "They can produce their own fungi without soil."], correct: 2 }
            ]},

            // ACADEMIC DISCUSSION (Writing)
            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"We are exploring economic policies this week. Some economists propose a 'Universal Basic Income' (UBI), where the government gives a set amount of money to every citizen regularly, regardless of their employment status. Do you believe implementing a UBI is a positive step for society?\"\n\n<b>Student A (Alex):</b>\n\"I think UBI is a fantastic idea. It guarantees that nobody falls below the poverty line. People would have a safety net, allowing them to go back to school, start small businesses, or take care of sick relatives without the constant fear of starvation or eviction.\"\n\n<b>Student B (Rachel):</b>\n\"I disagree. Handing out free money removes the incentive to work. If everyone gets a basic income, a lot of people will just quit their jobs, which would crush the economy. Furthermore, the taxes required to fund such a massive program would be astronomically high.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Alex, Rachel, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The Invention of the Airplane', canSkip: true, text: 'On December 17, 1903, Orville and Wilbur Wright achieved the first successful flight of a powered, controlled, and heavier-than-air airplane. Before their breakthrough, many inventors had attempted flight using gliders or steam-powered machines that were either impossible to steer or too heavy to lift off. The Wright brothers solved the issue of control by inventing "wing-warping," a system that slightly twisted the wings to steer the craft and maintain balance in the wind. Furthermore, they spent years testing their designs in a custom-built wind tunnel and developed their own lightweight, gas-powered engine. Their meticulous engineering changed the course of global transportation forever.', questions: [{ q: "What specific problem did the Wright brothers solve with their 'wing-warping' system?", options: ["The problem of building a strong enough engine.", "The issue of steering and maintaining balance in the wind.", "The difficulty of landing safely on water.", "The challenge of carrying heavy passenger luggage."], correct: 1 }, { q: "How did the brothers test their designs before attempting a real flight?", options: ["They attached models to fast-moving trains.", "They threw paper prototypes from tall cliffs.", "They tested them in a custom-built wind tunnel.", "They hired professional pilots to fly their gliders."], correct: 2 }, { q: "Why did previous inventors fail at achieving powered flight according to the text?", options: ["They lacked government funding.", "Their machines were impossible to steer or too heavy.", "They refused to use gasoline engines.", "They only attempted flights at night."], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 23: The Sahara Desert\'s Past', canSkip: true, text: 'Today, the Sahara is the largest hot desert in the world, stretching across Northern Africa. However, archaeological and geological evidence proves it wasn\'t always a barren wasteland. Around 10,000 to 5,000 years ago, during a period known as the African Humid Period, the Sahara was a lush, green landscape characterized by massive lakes, sprawling grasslands, and diverse wildlife including hippos and crocodiles. This dramatic shift in climate was caused by subtle changes in the Earth\'s orbit, which altered the angle of solar radiation and brought heavy monsoon rains further north into Africa. As the Earth\'s orbit eventually shifted back, the rains retreated, and the region rapidly dried into the desert we see today.', questions: [{ q: "What was the environment of the Sahara like during the African Humid Period?", options: ["It was completely covered by a thick sheet of ice.", "It was a lush, green landscape with lakes and wildlife.", "It was a barren desert, much like it is today.", "It was a massive, deep-ocean trench."], correct: 1 }, { q: "What caused the heavy monsoon rains to move further north into Africa thousands of years ago?", options: ["Subtle changes in the Earth's orbit.", "The sudden eruption of a massive volcano.", "Human agricultural activities.", "A massive asteroid impact in the Atlantic Ocean."], correct: 0 }, { q: "What happened when the Earth's orbit eventually shifted back?", options: ["The Sahara froze over completely.", "The region rapidly dried into the desert we see today.", "The monsoon rains became permanently heavier.", "The entire continent sank below sea level."], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 24: Deep Sea Hydrothermal Vents', canSkip: true, text: 'In 1977, scientists exploring the deep ocean floor near the Galápagos Islands made a discovery that fundamentally changed the field of biology: hydrothermal vents. These are essentially underwater geysers that spew superheated, mineral-rich water from beneath the Earth\'s crust into the freezing ocean. Prior to this discovery, scientists believed that all life on Earth relied strictly on sunlight and photosynthesis. However, completely cut off from the sun, thriving ecosystems exist around these vents. The foundation of this unique food web is a process called chemosynthesis, where specialized bacteria convert the toxic hydrogen sulfide erupting from the vents into usable energy, supporting bizarre creatures like giant tube worms and ghost crabs.', questions: [{ q: "What are deep sea hydrothermal vents?", options: ["Underwater geysers that spew superheated, mineral-rich water.", "Frozen pillars of ice located near the North Pole.", "Man-made structures used for mining gold.", "Underwater caves that trap sunlight."], correct: 0 }, { q: "What did scientists believe about life on Earth prior to 1977?", options: ["That life could easily exist without any energy source.", "That life relied strictly on sunlight and photosynthesis.", "That the ocean floor was completely devoid of minerals.", "That bacteria could only survive in boiling water."], correct: 1 }, { q: "How do bacteria at the bottom of the ocean create energy without sunlight?", options: ["They absorb heat directly from passing fish.", "They consume the giant tube worms.", "They rise to the surface every day to collect sunlight.", "They convert toxic hydrogen sulfide into energy through chemosynthesis."], correct: 3 }] },

            { type: 'academic-reading', title: 'Task 19: Academic Talk - Ecology', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/ad8ru1c9oi0rg5l57dcy9/Task-19.mp3?rlkey=udtpbfq3jv4gr5k7j0g3lj0rf&st=vb6mnad1&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s discuss keystone species, using the sea otter as a classic example. A keystone species is an organism that helps hold an entire ecosystem together. Sea otters live in kelp forests along the coast. Their primary food source is sea urchins. If sea otters were removed from the environment, the sea urchin population would explode. These urchins would quickly eat and destroy the entire kelp forest, which serves as a vital habitat and nursery for thousands of other marine animals. By simply eating urchins, otters keep the entire coastal ecosystem balanced."</div>', questions: [
                { q: "What defines a 'keystone species' according to the professor?", options: ["An organism that lives exclusively in the deep ocean.", "A species that helps hold an entire ecosystem together.", "An animal that has no natural predators.", "A plant that grows faster than any other species."], correct: 1 },
                { q: "What would happen if sea otters were removed from the environment?", options: ["The kelp forest would grow out of control.", "Sea urchins would migrate to a different ocean.", "The sea urchin population would explode and destroy the kelp forest.", "Other marine animals would start eating sea urchins."], correct: 2 }
            ]},
            
            { type: 'academic-reading', title: 'Task 20: Academic Talk - History', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/g5ewur11pg8c3ecmlastq/Task-20.mp3?rlkey=76210lbihyg5eqp0ky7d3xg9r&st=bu5r8m5r&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Before the invention of the telephone, the electrical telegraph revolutionized long-distance communication in the 1830s and 40s. Developed largely by Samuel Morse, the system worked by transmitting electrical signals over a wire laid between stations. To make this work, Morse developed a specific code, assigning a set of dots and dashes to each letter of the alphabet. For the very first time in human history, complex messages could be sent across continents almost instantly, forever changing how businesses operated, how wars were fought, and how news was reported."</div>', questions: [

            ]},

            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"We are discussing urban development. Many major cities are closing their central downtown streets to cars entirely, making them pedestrian and bicycle-only zones. Do you think creating car-free zones in city centers is a good idea?\"\n\n<b>Student A (Brian):</b>\n\"I think it's a great idea. It dramatically reduces air pollution and noise in the city center. It also makes the streets much safer for people walking and encourages citizens to be more physically active instead of just sitting in traffic.\"\n\n<b>Student B (Lisa):</b>\n\"I disagree. Banning cars hurts local businesses because people who live far away won't be able to easily drive to those stores. Also, public transportation isn't reliable everywhere, so car-free zones unfairly exclude people who rely on their personal vehicles to get around.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Brian, Lisa, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The Discovery of Penicillin', canSkip: true, text: 'In 1928, Scottish bacteriologist Alexander Fleming made an accidental discovery that revolutionized modern medicine. Upon returning to his laboratory after a vacation, he noticed that a petri dish containing Staphylococcus bacteria had been contaminated by a mold called Penicillium notatum. Surprisingly, the area immediately surrounding the mold was completely clear of the bacteria. Fleming deduced that the mold was secreting a substance that actively killed the bacteria, which he named penicillin. Although he discovered it, it took over a decade for other scientists, Howard Florey and Ernst Chain, to successfully purify and mass-produce penicillin, creating the world\'s first widely used antibiotic and saving countless lives during World War II.', questions: [{ q: "How did Alexander Fleming discover penicillin?", options: ["By intentionally mixing different chemicals in a lab.", "By studying ancient medical texts from Greece.", "Accidentally, after a mold contaminated a petri dish.", "During a surgical procedure on a soldier."], correct: 2 }, { q: "What did the mold in the petri dish do to the bacteria?", options: ["It caused the bacteria to multiply rapidly.", "It changed the color of the bacteria to green.", "It secreted a substance that actively killed the bacteria.", "It merged with the bacteria to create a new organism."], correct: 2 }, { q: "What contribution did Howard Florey and Ernst Chain make?", options: ["They originally discovered the Penicillium mold.", "They successfully purified and mass-produced the drug.", "They proved that penicillin was dangerous to humans.", "They invented the petri dish used by Fleming."], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 23: The Mechanics of Glaciers', canSkip: true, text: 'Glaciers are massive rivers of dense ice that constantly, albeit slowly, move under their own weight. They form in regions where the accumulation of snow in the winter exceeds the amount of snow that melts in the summer. Over decades and centuries, the weight of the new snow compresses the underlying layers into solid, crystalline ice. As the glacier becomes heavier, gravity pulls it slowly downhill. This movement shapes the landscape dramatically; as the ice scrapes across the land, it carves deep U-shaped valleys and pushes massive amounts of rock and debris forward, acting like a slow-moving, natural bulldozer.', questions: [{ q: "Under what specific condition do glaciers form?", options: ["When underground water freezes during an earthquake.", "When winter snow accumulation exceeds summer melting.", "When rivers freeze solid during an ice age.", "When ocean water is pushed onto the land by wind."], correct: 1 }, { q: "What causes the compacted ice to move downhill?", options: ["High-speed winds pushing from behind.", "The force of gravity acting on its massive weight.", "Magnetic forces from the Earth's poles.", "Underground volcanic heat melting the base."], correct: 1 }, { q: "How do glaciers alter the physical landscape?", options: ["They plant seeds for new forests to grow.", "They flatten mountains into perfectly smooth plains.", "They carve deep U-shaped valleys and push rock debris.", "They dry up nearby oceans and lakes."], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 24: The Rise of E-Commerce', canSkip: true, text: 'The advent of the internet in the late 20th century gave rise to electronic commerce, or e-commerce, fundamentally disrupting traditional retail models. E-commerce allows consumers to purchase goods and services digitally without ever visiting a physical brick-and-mortar store. This shift provided unprecedented convenience, enabling 24-hour shopping and access to a global marketplace. For businesses, e-commerce reduced overhead costs associated with maintaining physical storefronts and allowed them to track consumer data meticulously. However, this transition has severely impacted traditional retail jobs and led to the closure of many shopping malls, forcing local economies to adapt to a digital-first consumer base.', questions: [{ q: "What is a major consumer benefit of e-commerce mentioned in the text?", options: ["The ability to touch and feel products before buying.", "Unprecedented convenience and 24-hour shopping.", "Guaranteed lower prices on all electronic goods.", "The elimination of all shipping costs."], correct: 1 }, { q: "How did e-commerce benefit businesses financially?", options: ["It eliminated the need to pay taxes.", "It forced them to hire more retail workers.", "It reduced overhead costs associated with physical storefronts.", "It allowed them to print their own currency."], correct: 2 }, { q: "What has been a negative consequence of the rise of e-commerce?", options: ["A complete collapse of the global shipping industry.", "A severe impact on traditional retail jobs and the closure of malls.", "A massive increase in the cost of internet access.", "The abandonment of all digital marketing strategies."], correct: 1 }] },

            // LISTEN TO AN ACADEMIC TALK
            { type: 'academic-reading', title: 'Task 19: Academic Talk - Sleep and Memory', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/oezehvgx5nzhfd0llvsji/Task-19.mp3?rlkey=9wfyt778sw4l035cnth3kau9u&st=b9uo7d3e&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s talk about the biological function of sleep. During deep sleep, the brain essentially cleans itself. It flushes out toxic waste proteins that accumulate during your waking hours. This specific cleaning process is absolutely necessary for memory consolidation and daily cognitive function. Chronic sleep deprivation prevents this cleaning, which can lead to severe memory issues and an increased risk of neurodegenerative diseases over time."</div>', questions: [
                { q: "What physiological mechanism occurs in the brain during deep rest?", options: ["It generates new nerve cells rapidly.", "It permanently deletes older, unused memories.", "It eliminates harmful substances accumulated during the day.", "It increases the production of stress hormones."], correct: 2 },
                { q: "According to the lecture, what is a potential long-term consequence of failing to get enough rest?", options: ["A heightened susceptibility to neurodegenerative conditions.", "An unnatural increase in physical strength.", "A permanent inability to fall asleep at night.", "A significant decrease in the need for future sleep."], correct: 0 }
            ]},
            
            { type: 'academic-reading', title: 'Task 20: Academic Talk - Inflation', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/5q71kk2pkxd90fipbh6l6/Task-20.mp3?rlkey=zzw9id81ua0zpqgaap0y3rou6&st=cfv9vr6s&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today we will examine the concept of inflation. Simply put, inflation is the rate at which the general level of prices for goods and services rises, causing everyday purchasing power to fall. Central banks actively attempt to limit inflation to keep the economy running smoothly. A common cause of inflation is a rapid increase in the money supply, which means there is more money chasing the exact same amount of goods, naturally driving prices up."</div>', questions: [
                { q: "How does the speaker summarize the concept of inflation?", options: ["As the rapid expansion of international trade borders.", "As a widespread increase in prices that reduces consumer buying power.", "As the deliberate manipulation of the stock market by banks.", "As a sudden halt in the production of consumer goods."], correct: 1 },
                { q: "What phenomenon is cited as a frequent catalyst for rising prices?", options: ["An overabundance of physical products in the market.", "Central banks shutting down their operations completely.", "Consumers refusing to spend their savings.", "An excessive expansion of the available currency supply."], correct: 3 }
            ]},

            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"We are currently discussing corporate culture and employee well-being. Several modern companies have transitioned to a four-day workweek, where employees work 32 hours instead of 40, but receive the exact same salary. Do you think adopting a four-day workweek is a beneficial policy for society?\"\n\n<b>Student A (Mark):</b>\n\"I think it's a brilliant idea. A shorter workweek drastically improves mental health and gives people time to pursue hobbies or spend time with family. Furthermore, studies show that employees are actually more focused and productive when they are well-rested.\"\n\n<b>Student B (Chloe):</b>\n\"I completely disagree. While it sounds nice, a four-day workweek would be disastrous for small businesses that can't afford to hire extra staff to cover the missing days. Customer service would suffer, and it would ultimately lead to lower overall economic output.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Mark, Chloe, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: Roman Aqueducts', canSkip: true, text: 'The ingenuity of ancient Roman engineering is perhaps best exemplified by their extensive network of aqueducts. These massive structures were not merely decorative; they were highly calculated delivery systems designed to transport fresh water from distant mountain springs into densely populated urban centers. Relying entirely on gravity rather than mechanical pumps, engineers maintained a precise, continuous downward gradient over miles of rugged terrain. The influx of clean water revolutionized public health, facilitating the creation of public baths, fountains, and complex sewage systems, which effectively mitigated the spread of waterborne diseases in crowded cities.', questions: [{ q: "What was the primary mechanism that propelled water through the aqueduct system?", options: ["Large, steam-powered pumping stations.", "The natural force of gravity over a slight incline.", "Pressure generated by deep underground wells.", "Windmills constructed along the mountainous routes."], correct: 1 }, { q: "How did the aqueducts directly impact the well-being of the urban populace?", options: ["They provided a strategic advantage during military sieges.", "They allowed farmers to grow exotic crops inside the city limits.", "They enabled sanitation infrastructure that reduced the prevalence of illness.", "They generated vast amounts of wealth through water taxation."], correct: 2 }, { q: "Which aspect of the aqueducts highlights the advanced skill of the builders?", options: ["The ability to maintain a constant downward slope across vast distances.", "The use of incredibly rare, imported marble from Greece.", "Their success in making water flow upwards over steep hills.", "The integration of electrical lighting within the tunnels."], correct: 0 }] },
            { type: 'academic-reading', title: 'Task 23: The Bystander Effect', canSkip: true, text: 'In the field of social psychology, the "bystander effect" refers to a phenomenon where individuals are noticeably less likely to offer help to a victim when other people are present. Researchers hypothesize that this occurs due to a "diffusion of responsibility." In a crowded environment, onlookers subconsciously assume that someone else will intervene or has already called for assistance. Consequently, the perceived pressure to take action diminishes for each individual. Studies have demonstrated that victims suffering medical emergencies in secluded areas are paradoxically more likely to receive immediate aid from a solitary passerby than if they collapsed in a bustling public square.', questions: [{ q: "How does the text define the core concept of the 'diffusion of responsibility'?", options: ["People actively ignore others because they are inherently selfish.", "Individuals feel less personal obligation to act because others are around.", "Crowds naturally block the path to the victim, preventing intervention.", "Witnesses are often too panicked to remember basic first aid."], correct: 1 }, { q: "What paradoxical finding have social psychology studies revealed?", options: ["Medical professionals are the least likely people to help in an emergency.", "People are more eager to assist victims if there is a financial reward.", "A person in distress is more likely to get help from a single individual than from a large crowd.", "Emergencies happen far less frequently in crowded public spaces."], correct: 2 }, { q: "Based on the passage, what thought process might prevent a witness from intervening?", options: ["'I don't have the proper medical training to handle this.'", "'I am already late for an important meeting.'", "'I might get sued if I accidentally injure the person further.'", "'Someone else in this crowd will probably handle the situation.'"], correct: 3 }] },
            { type: 'academic-reading', title: 'Task 24: The James Webb Space Telescope', canSkip: true, text: 'Launched in 2021, the James Webb Space Telescope (JWST) represents a monumental leap in astronomical observation, succeeding the Hubble telescope. Unlike its predecessor, which primarily observed visible light, the JWST is optimized to detect infrared radiation. Because the universe is constantly expanding, the light emitted by the oldest, most distant galaxies stretches into the infrared spectrum by the time it reaches Earth. By capturing these longer wavelengths, the JWST allows scientists to essentially look backward in time, observing the formation of the very first stars and planetary systems that emerged shortly after the Big Bang. Additionally, its advanced sensors can analyze the atmospheric composition of distant exoplanets, searching for potential biosignatures.', questions: [{ q: "Why is the James Webb Space Telescope specifically designed to capture infrared light?", options: ["Because light from ancient, distant galaxies shifts into the infrared spectrum over time.", "Because visible light is completely absorbed by the Earth's atmosphere.", "Because infrared sensors are much cheaper to manufacture than optical lenses.", "Because stars do not produce any visible light during their earliest stages of life."], correct: 0 }, { q: "What unique historical perspective does the telescope provide to researchers?", options: ["The ability to predict the exact date the universe will collapse.", "The opportunity to watch the formation of early stars and galaxies.", "A clear view of how the Earth's continents shifted millions of years ago.", "The chance to observe human-made satellites orbiting other planets."], correct: 1 }, { q: "How might the telescope aid in the search for extraterrestrial life?", options: ["By physically traveling to neighboring star systems to collect soil samples.", "By broadcasting radio signals into deep space.", "By capturing high-resolution photographs of alien structures.", "By examining the gases present in the atmospheres of planets outside our solar system."], correct: 3 }] },

            { type: 'academic-reading', title: 'Task 19: Academic Talk - The Placebo Effect', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/tw2qo4ngh5y996sysiwl6/Task-19.mp3?rlkey=y6lugwebzutqctx69tr6qerfc&st=z7xp4q5f&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s explore the placebo effect, a fascinating psychological phenomenon. It occurs when a patient experiences a real improvement in their medical condition after receiving a \'fake\' treatment, like a sugar pill, simply because they believe it will work. The brain anticipates healing and actually releases endorphins, the body\'s natural painkillers. This proves that our mindset and expectations can have a profound, measurable impact on our physiological health."</div>', questions: [

            { type: 'academic-reading', title: 'Task 23: The Hawthorne Effect', canSkip: true, text: 'The "Hawthorne Effect" originated from a series of occupational studies conducted in the 1920s at the Hawthorne Works factory in Illinois. Initially, researchers intended to measure how changes in lighting affected worker productivity. Surprisingly, they found that productivity improved regardless of whether the lights were made brighter or dimmer. The conclusion was not that lighting was irrelevant, but rather that the workers were modifying their behavior simply because they knew they were being observed by the researchers. This phenomenon fundamentally changed behavioral research, forcing scientists to account for the psychological impact of observation itself.', questions: [{ q: "What was the original objective of the studies at the Hawthorne Works factory?", options: ["To see if brighter lights decreased factory energy costs.", "To determine if workers preferred day shifts or night shifts.", "To measure the psychological stress of factory work.", "To evaluate how physical illumination impacted employee output."], correct: 3 }, { q: "Why did productivity increase when the lights were dimmed?", options: ["Because dimmer lights caused less eye strain for the workers.", "Because the factory machines operated more efficiently in the dark.", "Because the workers were reacting to being monitored by researchers.", "Because the workers wanted to finish their shifts early."], correct: 2 }, { q: "How did this discovery impact the broader field of behavioral science?", options: ["It proved that environmental factors are completely irrelevant.", "It forced researchers to consider the bias introduced by observing subjects.", "It led to the immediate closure of the Hawthorne Works factory.", "It standardized factory lighting regulations across the country."], correct: 1 }] },

    };

    let curSet = []; let idx = 0; let results = []; let timer; let _currentTestKey = '';

    function start(k) { _currentTestKey = k; curSet=testData[k]; idx=0; results=[]; switchScreen('screen-exercise'); render(); }

    function render() {
        clearInterval(timer);
        const ex = curSet[idx]; const cont = document.getElementById('exercise-content');
        document.getElementById('skip-btn').style.display = ex.canSkip ? 'block' : 'none';
        cont.innerHTML = `<h2>${ex.title}</h2>`;

        if (ex.audioUrl) {
            cont.innerHTML += `<div class="audio-container"><p>▶️ Play Audio Material</p><audio controls preload="metadata" crossorigin="anonymous"><source src="${ex.audioUrl}" type="audio/mpeg"></audio></div>`;
        }

        if (ex.type === 'complete-words') {
            let h = ex.text.replace(/\[(\d+)\]/g, (m, p) => `<input type="text" class="fill-blank" maxlength="${p}" style="width: ${p}ch">`);
            cont.innerHTML += `<div class="exercise-paragraph">${h}</div>`;
        } else if (ex.type === 'listen-repeat') {
            cont.innerHTML += `<div style="display:grid; gap:15px;">` + ex.sentences.map((s,i)=>`<div style="display:flex; align-items:center; gap:15px;"><button class="btn-audio-minimal" onclick="new Audio('${s.audio}').play().catch(e=>console.error(e))">▶️</button><button class="btn btn-outline" style="flex:1; margin:0;" onclick="this.parentElement.nextElementSibling.style.display='block'">Reveal Sentence ${i+1}</button></div><div style="background:#f8f9fa; padding:20px; border-left:5px solid var(--primary-blue); display:none; margin-bottom:10px;">${s.text}</div>`).join('') + `</div>`;
        } else if (ex.type === 'speaking-timer') {
            cont.innerHTML += `<div id="timer-box">00:${ex.time}</div><button class="btn" style="background:var(--success-green);" id="t-btn" onclick="runTimer(${ex.time}, 'timer-box')">Start Timer</button>`;
        } else if (ex.type === 'build-sentence') {
            let s = [...ex.words].sort(()=>Math.random()-0.5);
            cont.innerHTML += `<div class="context-box">${ex.context}</div><div class="word-bank" id="w-bank">${s.map(w=>`<div class="draggable-word" onclick="toD(this)">${w}</div>`).join('')}</div><div id="d-area" class="drop-area" onclick="fromD(event)"></div>`;
        } else if (ex.type === 'academic-reading') {
            let qh = ex.questions.map((q,qi)=>`<div style="margin-bottom:30px;"><strong>${qi+1}. ${q.q}</strong>${q.options.map((o,oi)=>`<div class="option q${qi}" onclick="mSel(${qi},${oi})">${o}</div>`).join('')}</div>`).join('');
            cont.innerHTML += `<div class="academic-grid"><div class="reading-text-box">${ex.text}</div><div>${qh}</div></div>`;
        } else if (ex.options) {
            let t = ex.script ? `<button class="btn btn-outline" onclick="this.nextElementSibling.style.display='block'">Show Script</button><div style="background:#f8f9fa; padding:20px; display:none; margin-bottom:20px; border-left: 4px solid var(--primary-blue);">${ex.script}</div>` : `<p>${ex.text || ""}</p>`;
            cont.innerHTML += t + `<p><strong>${ex.question}</strong></p>` + ex.options.map((o,i)=>`<div class="option" onclick="select(this,${i})">${o}</div>`).join('');
        } else if (ex.type === 'writing-email') {
            cont.innerHTML += `<div class="small-timer" id="email-t">07:00</div><p>${ex.text}</p><textarea style="width:100%; height:200px; padding:20px; border-radius:10px; font-family:inherit; font-size:1.1rem; border:1.5px solid #ddd; outline:none;"></textarea>`;
            setTimeout(()=>runTimer(ex.time, 'email-t', true), 100);
        }
    }

    function runTimer(s, elementId, isEmail = false) {
        if(!isEmail) document.getElementById('t-btn').style.display='none'; 
        let t = s;
        timer = setInterval(()=>{ 
            t--; let m = Math.floor(t / 60); let sec = t % 60;
            document.getElementById(elementId).innerText = `${m<10?'0'+m:m}:${sec<10?'0'+sec:sec}`;
            if(t<=0){ clearInterval(timer); document.getElementById(elementId).innerText="DONE"; } 
        },1000);
    }

    function mSel(qi,oi) { document.querySelectorAll(`.q${qi}`).forEach(e=>e.classList.remove('selected')); const t=document.querySelectorAll(`.q${qi}`)[oi]; t.classList.add('selected'); t.dataset.choice=oi; }
    function select(e,i) { document.querySelectorAll('.option').forEach(o=>o.classList.remove('selected')); e.classList.add('selected'); e.dataset.idx=i; }
    function toD(e) { document.getElementById('d-area').appendChild(e); }
    function fromD(e) { if(e.target.className==='draggable-word') document.getElementById('w-bank').appendChild(e.target); }

    function submitAnswer() {
        const ex=curSet[idx]; let r={title:ex.title, type:ex.type, isCorrect:false};
        if(ex.type==='complete-words'){
            const ui=Array.from(document.querySelectorAll('.fill-blank')).map(i=>i.value.trim().toLowerCase());
            r.isCorrect = ui.every((v,i)=>v===ex.answers[i].toLowerCase()); r.ui=ui; r.ans=ex.answers; r.raw=ex.text;
        } else if(ex.type==='academic-reading'){
            r.qs=ex.questions.map((q,qi)=>{ const s=document.querySelector(`.q${qi}.selected`); const c=s?parseInt(s.dataset.choice):null; return {qText:q.q, isC:c===q.correct, uVal:c!==null?q.options[c]:"N/A", cVal:q.options[q.correct]};});
            r.isCorrect=r.qs.every(q=>q.isC);
        } else if(ex.type==='build-sentence'){
            const b=Array.from(document.getElementById('d-area').children).map(c=>c.innerText);
            r.isCorrect = (JSON.stringify(b)===JSON.stringify(ex.correctOrder)); r.uVal=b.join(' '); r.cVal=ex.correctOrder.join(' ');
        } else if(ex.options) {
            const s=document.querySelector('.selected'); const c=s?parseInt(s.dataset.idx):null;
            r.isCorrect = c===ex.correct; r.uVal=c!==null?ex.options[c]:"N/A"; r.cVal=ex.options[ex.correct];
        } else { r.isCorrect=true; }
        results.push(r); idx++; idx<curSet.length?render():finish();
    }

    function finish() {
        switchScreen('screen-results');
        const v = results.filter(r=>!r.skipped && r.type!=='speaking-timer' && r.type!=='writing-email' && r.type!=='listen-repeat');
        const sCount = v.filter(r=>r.isCorrect).length;
        const p = sCount/(v.length||1);
        let band = (p * 5 + 1).toFixed(1);
        let ibt = Math.round(p * 120);

        // Report score to parent platform — first, before any rendering that could throw
        let _reported = false;
        try {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'exerciseComplete',
                    exerciseType: 'TOEFL iBT',
                    exerciseName: _currentTestKey || 'Test',
                    score: sCount,
                    maxScore: v.length
                }, '*');
                _reported = true;
            }
        } catch(e) { console.error('postMessage error:', e); }

        document.getElementById('score-display').innerHTML = `
            <div style="font-size: 4rem; color: var(--primary-blue); font-weight: bold;">${band} / 6.0</div>
            <p style="font-size:1.2rem;">TOEFL Band Score</p>
            <div style="font-size: 1.1rem; color: var(--text-neutral);">Approximate iBT Total: <strong>${ibt} / 120</strong></div>
            ${_reported ? '<div style="margin-top:16px;font-size:0.85rem;color:#1a7a4a;font-weight:600;">✅ Progress saved to My Progress</div>' : ''}
        `;

        let feed = '';
        try {
        results.forEach(r => {
            if(r.skipped || r.type==='speaking-timer' || r.type==='writing-email' || r.type==='listen-repeat') return;
            feed += `<div class="feedback-card"><h3>${r.title}</h3>`;
            if(r.type==='complete-words'){
                let u=r.raw, c=r.raw;
                r.ui.forEach((val, i) => {
                    let col = (val===r.ans[i].toLowerCase()) ? 'correct-text' : 'wrong-text';
                    u = u.replace(/\[\d+\]/, `<span class="${col}">${val || "___"}</span>`);
                    c = c.replace(/\[\d+\]/, `<span class="correct-text">${r.ans[i]}</span>`);
                });
                feed += `<div class="attempt-box"><span class="right-ans-label">Right Answer: <span class="neutral-text" style="color:var(--text-neutral);">${c.replace(/<span class=\"correct-text\">/g, '').replace(/<\/span>/g, '')}</span></span><span class="right-ans-label">Your Attempt: ${u}</span></div>`;
            } else if(r.type==='academic-reading'){
                r.qs.forEach(q => {
                    let colClass = q.isC ? 'correct-text' : 'wrong-text';
                    feed += `<div class="attempt-box"><p><strong>${q.qText}</strong></p><span class="right-ans-label">Right Answer: <span class="correct-text">${q.cVal}</span></span><span class="right-ans-label">Your Answer: <span class="${colClass}">${q.uVal}</span></span></div>`;
                });
            } else if(r.type==='build-sentence'){
                let colClass = r.isCorrect ? 'correct-text' : 'wrong-text';
                feed += `<div class="attempt-box"><span class="right-ans-label">Right Answer: <span class="neutral-text" style="color:var(--text-neutral);">${r.cVal}</span></span><span class="right-ans-label">Your Attempt: <span class="${colClass}">${r.uVal || ""}</span></span></div>`;
            } else {
                let colClass = r.isCorrect ? 'correct-text' : 'wrong-text';
                feed += `<div class="attempt-box"><span class="right-ans-label">Right Answer: <span class="neutral-text" style="color:var(--text-neutral);">${r.cVal}</span></span><span class="right-ans-label">Your Answer: <span class="${colClass}">${r.uVal || ""}</span></span></div>`;
            }
            feed += `</div>`;
        });
        } catch(e) { console.error('feedback render error:', e); }
        document.getElementById('feedback-display').innerHTML = feed;
    }

    function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function skip() { results.push({title:curSet[idx].title, skipped:true}); idx++; idx<curSet.length?render():finish(); }

_buildIBTMenu();
</script>
