
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New TOEFL iBT Practice</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #00467f;
            --accent-blue: #0073e6;
            --bg-page: #f4f7f9;
            --text-main: #2c3e50;
            --white: #ffffff;
            --error-red: #d93025;
            --success-green: #28a745;
            --timer-dark: #1a1a1a;
            --text-neutral: #555555;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-wrapper {
            width: 95%;
            max-width: 1000px;
            background: var(--white);
            padding: 60px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            min-height: 850px; 
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .screen { display: none; flex-grow: 1; }
        .active { display: flex; flex-direction: column; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        h1, h2 { color: var(--primary-blue); text-align: center; margin-bottom: 40px; }

        #menu-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin-top: 40px;
        }

        .fill-blank {
            display: inline-block;
            border: none !important;
            outline: none !important;
            background-color: transparent;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--accent-blue);
            padding: 0;
            margin: 0 4px;
            text-align: left;
            vertical-align: baseline;
            background-image: linear-gradient(to right, #aaa 70%, rgba(255, 255, 255, 0) 0%);
            background-position: bottom;
            background-size: 1ch 2px; 
            background-repeat: repeat-x;
        }

        .exercise-paragraph { font-size: 1.5rem; line-height: 3.5; text-align: justify; margin-bottom: 20px; }

        .context-box { background: #e7f3ff; padding: 25px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #b6d4fe; font-size: 1.2rem; font-style: italic; }
        .word-bank { display: flex; flex-wrap: wrap; gap: 12px; margin: 30px 0; justify-content: center; }
        .draggable-word { padding: 12px 20px; background: white; border: 2px solid #ced4da; border-radius: 8px; cursor: pointer; font-weight: 700; }
        .drop-area { min-height: 90px; border: 2.5px dashed var(--primary-blue); padding: 20px; display: flex; flex-wrap: wrap; gap: 10px; border-radius: 12px; background: #fafafa; }
        
        .academic-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 40px; margin-bottom: 20px; }
        .reading-text-box { font-size: 1.1rem; line-height: 1.8; padding-right: 20px; border-right: 1px solid #eee; height: 520px; overflow-y: auto; text-align: justify; }

        .audio-container { margin: 20px 0; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 1px solid #dee2e6; text-align: center; }
        audio { width: 100%; height: 35px; }
        #timer-box { font-size: 5.5rem; font-weight: bold; color: var(--timer-dark); text-align: center; margin: 60px 0; font-family: monospace; }
        .small-timer { float: right; font-size: 1.5rem; font-weight: bold; color: var(--timer-dark); background: #f4f4f4; padding: 8px 15px; border-radius: 5px; margin: 10px 0; border: 1px solid #ddd; }

        #nav-controls { padding-top: 50px; border-top: 1px solid #eee; margin-top: 20px; text-align: center; }
        .btn { background: var(--primary-blue); color: white; border: none; padding: 18px 45px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: 700; margin: 10px auto; min-width: 280px; display: block; }
        .btn-skip { background: #6c757d; font-size: 14px; margin-top: 25px; }
        .btn-outline { background: transparent; border: 2px solid var(--primary-blue); color: var(--primary-blue); margin-bottom: 15px; }
        .btn-audio-minimal { background: none; border: none; font-size: 24px; cursor: pointer; padding: 0; margin: 0; display: flex; align-items: center; justify-content: center; }
        
        .option { display: block; padding: 18px; margin: 10px 0; border: 1.5px solid #dee2e6; border-radius: 8px; cursor: pointer; }
        .selected { background: var(--accent-blue) !important; color: white; border-color: var(--accent-blue); }

        .feedback-card { padding: 40px; border-radius: 12px; background: #fff; border: 1px solid #eef2f5; margin-bottom: 40px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .feedback-card h3 { margin-top: 0; color: var(--primary-blue); border-bottom: 1px solid #eee; padding-bottom: 15px; }
        .attempt-box { background: #fdfdfd; border: 1px solid #eee; padding: 25px; border-radius: 10px; margin-top: 20px; }
        .right-ans-label { color: var(--text-neutral); font-weight: bold; margin-bottom: 8px; display: block; }
        .correct-text { color: var(--success-green); font-weight: bold; }
        .wrong-text { color: var(--error-red); font-weight: bold; }
    </style>

<script>
var _allowedTests = [];
(function() {
  var params = new URLSearchParams(window.location.search);
  var allowedParam = params.get('allowed');
  if (allowedParam) _allowedTests = allowedParam.split(',');
})();
function _buildIBTMenu() {
  var menuGrid = document.getElementById('menu-grid');
  if (!menuGrid) return;
  menuGrid.innerHTML = '';
  Object.keys(testData).forEach(function(key) {
    var btn = document.createElement('button');
    btn.className = 'btn';
    var isLocked = _allowedTests.length > 0 && _allowedTests.indexOf(key) === -1;
    if (isLocked) {
      btn.textContent = '🔒 ' + key;
      btn.style.opacity = '0.5'; btn.style.background = '#888';
      btn.onclick = function(e) { e.preventDefault(); window.parent.postMessage({type:'showModal'}, '*'); };
    } else {
      btn.textContent = key;
      btn.onclick = (function(k){ return function(){ start(k); }; })(key);
    }
    menuGrid.appendChild(btn);
  });
}
</script>
</head>

            { type: 'academic-reading', title: 'Task 14: Cognitive Psychology', canSkip: true, text: 'Cognitive psychology is the scientific study of mental processes such as attention, language use, memory, and perception. The origin of cognitive psychology occurred in the 1960s in a break from behaviorism, which had held that unobservable mental processes were outside of the realm of empirical science. This shift allowed researchers to use models of mental processing to explain complex human behavior. One key focus is how humans process information, similar to how a computer operates, by encoding, storing, and retrieving data. This field has significantly influenced education, therapy, and artificial intelligence.', questions: [{ q: "What caused the shift toward cognitive psychology?", options: ["The invention of the computer", "A rejection of behaviorist views", "Advances in surgical techniques", "A return to classical philosophy"], correct: 1 }, { q: "When did the field originate?", options: ["1920s", "1950s", "1960s", "1990s"], correct: 2 }, { q: "What do cognitive psychologists study?", options: ["Physical reflexes", "Social hierarchies", "Mental processes", "Animal instincts"], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 15: Plate Tectonics', canSkip: true, text: 'The theory of plate tectonics revolutionized geology by explaining the movement of the Earth’s lithosphere. The Earth\'s outer shell is divided into several large and small plates that glide over the mantle. This movement is driven by mantle convection, where heat from the core causes molten rock to rise and sink. At plate boundaries, geological activity such as earthquakes, volcanic eruptions, and mountain building occurs. For example, the Himalayas were formed by the collision of the Indian and Eurasian plates. While the concept of continental drift was proposed earlier, it was not until the mid-20th century that the mechanism of seafloor spreading provided the necessary evidence for plate tectonics.', questions: [{ q: "What drives the movement of tectonic plates?", options: ["Lunar gravity", "Ocean currents", "Mantle convection", "Atmospheric pressure"], correct: 2 }, { q: "How were the Himalayas formed?", options: ["Volcanic activity", "Erosion by wind", "Collision of plates", "Seafloor spreading"], correct: 2 }, { q: "When was seafloor spreading discovered?", options: ["Early 1800s", "Mid-20th century", "Late 19th century", "The 1980s"], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 16: Supply and Demand', canSkip: true, text: 'In microeconomics, the model of supply and demand explains how prices are determined in a competitive market. The law of demand states that as the price of a product increases, the quantity demanded by consumers decreases. Conversely, the law of supply suggests that a higher price encourages producers to supply more of a good. The point where these two curves intersect is known as the market equilibrium, representing the stable price at which supply equals demand. Factors such as consumer preference, income levels, and production costs can shift these curves, leading to a new equilibrium. Understanding these dynamics is essential for businesses to set prices and for governments to implement effective economic policies.', questions: [{ q: "What is market equilibrium?", options: ["When prices are at their lowest", "When supply equals demand", "When demand is higher than supply", "When production stops"], correct: 1 }, { q: "According to the law of demand, what happens when prices rise?", options: ["Consumers buy more", "Producers decrease supply", "Demand decreases", "Preferences shift"], correct: 2 }, { q: "What can shift the supply and demand curves?", options: ["Only production costs", "Government intervention only", "Various factors like income", "Price changes alone"], correct: 2 }] },

            { type: 'academic-reading', title: 'Task 17: Consumer Behavior', canSkip: true, text: 'Emotional branding is a marketing strategy that aims to connect with consumers on a personal, emotional level rather than just highlighting product features. When a brand successfully evokes feelings of happiness, nostalgia, or belonging, it often creates deep customer loyalty. For example, a beverage company might run a campaign focusing on family gatherings and friendship instead of the drink\'s ingredients. This approach makes the brand memorable and encourages consumers to choose their product over competitors, even if the price is slightly higher.', questions: [{ q: "What is the primary goal of emotional branding?", options: ["To highlight product features", "To connect with consumers emotionally", "To lower product prices", "To change beverage ingredients"], correct: 1 }, { q: "What is a common result of successful emotional branding?", options: ["Deep customer loyalty", "Reduced production costs", "Less memorable campaigns", "Focus on product specifications"], correct: 0 }, { q: "What example of emotional branding is given in the passage?", options: ["A tech company selling software", "A beverage company focusing on friendship", "A shoe brand promoting durability", "A bank advertising low interest rates"], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 18: Volcanology', canSkip: true, text: 'Volcanoes generally fall into two main categories: shield volcanoes and stratovolcanoes, which differ significantly in shape and eruption style. Shield volcanoes, like those in Hawaii, have broad, gentle slopes formed by highly fluid lava that flows easily over great distances. Their eruptions are typically non-explosive. In contrast, stratovolcanoes, such as Mount St. Helens, are tall, steep-sided mountains built from layers of thicker lava, ash, and rocks. Because their magma traps more gas, stratovolcanoes are prone to violent, explosive eruptions.', questions: [{ q: "How do shield volcanoes generally erupt?", options: ["With violent explosions", "In a non-explosive manner", "By spewing mostly ash", "With thick, slow-moving lava"], correct: 1 }, { q: "What characterizes the shape of a stratovolcano?", options: ["Broad and flat", "Short and wide", "Tall and steep-sided", "Underground and invisible"], correct: 2 }, { q: "Which of the following is an example of a shield volcano location mentioned in the text?", options: ["Mount St. Helens", "Mount Vesuvius", "Hawaii", "Mount Fuji"], correct: 2 }] },

            { type: 'academic-reading', title: 'Task 17: Cognitive Psychology', canSkip: true, text: 'Working memory is a cognitive system with a limited capacity that is responsible for temporarily holding information available for processing. Unlike long-term memory, which stores vast amounts of knowledge for a lifetime, working memory is crucial for reasoning and the guidance of decision-making and behavior in the present moment. For example, remembering a phone number just long enough to dial it relies heavily on working memory. Researchers suggest that its capacity is typically limited to about four to seven items at a time, which is why complex tasks require our full attention.', questions: [{ q: "What is the main function of working memory?", options: ["Storing lifelong knowledge", "Temporarily holding information", "Dialing phone numbers permanently", "Increasing brain size"], correct: 1 }, { q: "How does working memory differ from long-term memory?", options: ["It holds limited information temporarily.", "It is used only for math problems.", "It stores vast amounts of knowledge.", "It never forgets information."], correct: 0 }, { q: "Approximately how many items can working memory hold?", options: ["One or two", "Four to seven", "Ten to twelve", "Unlimited items"], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 18: Astronomy', canSkip: true, text: 'Exoplanets are planets that orbit a star outside our solar system. The discovery of the first exoplanet around a sun-like star in 1995 revolutionized astronomy. Since then, thousands have been identified using various methods, most notably the transit method. This technique involves observing the slight dimming of a star\'s light when a planet passes in front of it. Scientists study these distant worlds to understand planetary formation and to search for Earth-like planets situated in the "habitable zone"—the region around a star where conditions might allow liquid water to exist on the planet\'s surface.', questions: [{ q: "What is an exoplanet?", options: ["A planet within our solar system", "A star that orbits a planet", "A planet orbiting a star outside our solar system", "A meteor passing Earth"], correct: 2 }, { q: "What does the transit method observe to find exoplanets?", options: ["The heat of the planet", "The dimming of a star's light", "The color of the solar system", "The radio waves from space"], correct: 1 }, { q: "What is the habitable zone?", options: ["The area where astronomers work", "A region where liquid water might exist", "The center of a star", "A planet made entirely of water"], correct: 1 }] },

            { type: 'academic-reading', title: 'Task 17: Conversation - Evening Plans', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/n1av74q3empkrslenxuhp/Conversation-2.mp3?rlkey=228v6pedqgnip00ac9tj5gw8l&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">-Hey, you\'re home! How was your day?<br>-It was… a day. Long, but productive. You know how it is. How was yours?<br>-Pretty much the same. Felt like I was running in circles all afternoon. Did you manage to get that report finished?<br>-Almost. Just a few more tweaks this evening. What about that presentation you were working on?<br>-It went well, thankfully. The clients seemed impressed. I’m glad that’s over.<br>-That’s great news! I’m happy for you. So, what’s for dinner? I’m starving.<br>-I was thinking we could order pizza. My brain is too fried to cook anything elaborate.<br>-Pizza sounds perfect. I’ll grab my phone. Anything else you want to do tonight?<br>-Maybe just relax on the couch, watch a movie. Or I could give you a massage? You always look so tense after work.<br>-That sounds amazing. I’d love that. Let’s just unwind. No more work talk for tonight, okay?<br>-Deal. Pizza, movie, and a massage. Sounds like the perfect end to a long day.</div>', questions: [
                { q: "What can be inferred about the woman's presentation?", options: ["The clients were dissatisfied with the results.", "It was a source of stress but ultimately successful.", "She did not finish it before leaving the office.", "It involved ordering food for the team."], correct: 1 },
                { q: "Why does the woman suggest ordering pizza instead of cooking?", options: ["She wants to celebrate the success of her presentation.", "They do not have any groceries left in the house.", "The man specifically requested it earlier in the day.", "She feels too mentally exhausted from her long day at work."], correct: 3 }
            ]},
            
            { type: 'academic-reading', title: 'Task 18: Conversation - Climate Conference', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/1ad11k4qlqy8ei1rveuxt/Conversation-1.mp3?rlkey=0gffoondt1tizoq971y553ngo&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">Woman- Wow, that was intense. I\'m still processing everything I heard at that climate change conference.<br>Man- Me too. It\'s a lot to take in. So many alarming statistics and dire predictions.<br>Woman- I know. That presentation on sea-level rise was particularly chilling. The thought of coastal cities being submerged...<br>Man- And the impact on agriculture, the food shortages, the mass migrations. It\'s a domino effect of disaster.<br>Woman- What struck me the most was the urgency. It felt like they were saying we\'re running out of time, that the window for action is closing rapidly.<br>Man- I know... that was the scary part. But well, there\'s only so much we can do about it.</div>', questions: [
                { q: "What does the man mean when he says \"It's a domino effect of disaster\"?", options: ["The presentation focused heavily on a board game analogy.", "The impacts of climate change are strictly isolated to coastal regions.", "One catastrophic environmental event will inevitably trigger others.", "Only agricultural sectors will fail while others survive."], correct: 2 },
                { q: "What specific aspect of the conference struck the woman the most?", options: ["The astronomical financial cost of implementing the proposed solutions.", "The specific location chosen for the next climate conference.", "The extensive backgrounds of the guest speakers.", "The rapidly closing window of time left to take meaningful action."], correct: 3 },
                { q: "How does the man's final comment contrast with the woman's primary concern?", options: ["He believes they have plenty of time, while she is already preparing to relocate.", "He wants to attend another conference, but she feels too overwhelmed to return.", "He expresses a sense of resignation, whereas she feels a pressing need for immediate action.", "He focuses primarily on the economic cost, while she focuses on sea-level rise."], correct: 2 }
            ]},

            // LISTEN TO AN ACADEMIC TALK (Embedded HTML Audio approach)
            { type: 'academic-reading', title: 'Task 19: Academic Talk - Marine Biology', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/bhokajeohe9ujfs9kikzm/Task-19.mp3?rlkey=4gj6eqq4wtaef09q8aeae6i71&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">Today, let\'s talk about bioluminescence in deep-sea organisms. In the darkest parts of the ocean, many creatures have evolved the ability to produce their own light through a chemical reaction. This light serves multiple purposes: it can be used to attract prey in the pitch-black water, to confuse or startle predators, or even for communication and finding mates. The anglerfish, for example, uses a glowing lure attached to its head to draw smaller fish right into its mouth.</div>', questions: [
                { q: "According to the professor, what is the primary mechanism behind bioluminescence?", options: ["The reflection of surface sunlight in the deep ocean.", "A symbiotic relationship with glowing algae.", "A chemical reaction occurring within the organism.", "The absorption of heat from underwater volcanic vents."], correct: 2 },
                { q: "How does the anglerfish specifically utilize its bioluminescent capability?", options: ["By startling larger predators to escape safely into the dark.", "By illuminating the ocean floor to search for hidden food sources.", "By communicating with potential mates from a long distance.", "By luring potential prey into its mouth with a glowing appendage."], correct: 3 }
            ]},
            
            { type: 'academic-reading', title: 'Task 20: Academic Talk - Behavioral Economics', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/9hkd5z9yoc1h23562owqu/Task-20.mp3?rlkey=ksn8ij26u9tc253nz6u03ueda&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">Let\'s turn our attention to the concept of \'loss aversion\' in behavioral economics. Studies have shown that the psychological pain of losing something is roughly twice as powerful as the pleasure of gaining that exact same thing. In marketing, companies often use this principle to their advantage. For instance, offering a \'limited time only\' discount creates a sense of urgency because consumers are afraid of missing out on the deal. They are driven more by the fear of losing the opportunity than by the actual money they might save.</div>', questions: [
                { q: "What is the core principle of \"loss aversion\" described in the talk?", options: ["Consumers actively avoid purchasing items that are heavily discounted.", "The psychological impact of a loss is significantly greater than that of an equivalent gain.", "People are naturally inclined to take financial risks when given the opportunity.", "Gaining money produces twice as much pleasure as losing money produces pain."], correct: 1 },
                { q: "How do marketers successfully exploit the concept of loss aversion?", options: ["By offering comprehensive money-back guarantees on all products.", "By permanently lowering prices to build long-term brand loyalty.", "By aggressively comparing their products to inferior competitors.", "By emphasizing that a discount is temporary to induce a fear of missing out."], correct: 3 },
                { q: "According to the professor, what primarily drives consumers during a \"limited time only\" sale?", options: ["The logical calculation of the actual money they will save.", "The desire to purchase items they don't actually need.", "The fear of losing the opportunity to get the deal.", "The social pressure to buy what others are buying."], correct: 2 }
            ]},

            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"In our business class today, we discussed the shift toward remote work. Do you think remote work is ultimately more beneficial for the employee or for the company? Explain your reasoning.\"\n\n<b>Student A (Alex):</b>\n\"I think it benefits the company more because they save thousands of dollars on office space, electricity, and overhead costs.\"\n\n<b>Student B (Maria):</b>\n\"I disagree; it benefits the employee the most. The flexibility allows for a much better work-life balance and eliminates the stress of commuting.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Alex, Maria, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: History of the Printing Press', canSkip: true, text: 'The invention of the printing press by Johannes Gutenberg in the 15th century is widely considered one of the most important events in human history. Before its invention, books were copied by hand, making them extremely rare and expensive. The printing press allowed for the mass production of books, drastically lowering their cost. This sudden availability of information fueled the Renaissance, the Scientific Revolution, and the Protestant Reformation. By making literature accessible to the general public, it played a critical role in increasing literacy rates and breaking the monopoly on knowledge previously held by the elite and the church.', questions: [{ q: "Why were books rare and expensive before the printing press?", options: ["They were copied entirely by hand.", "They were only printed on expensive paper.", "They were heavily taxed by the government.", "They were banned by the church."], correct: 0 }, { q: "What was a major consequence of the printing press's invention?", options: ["The end of the Scientific Revolution", "An increase in the price of literature", "A dramatic rise in literacy rates", "The decline of the Renaissance"], correct: 2 }, { q: "Who held a monopoly on knowledge before the printing press?", options: ["Johannes Gutenberg and his family", "The elite and the church", "Public libraries", "General merchants"], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 23: Cellular Respiration', canSkip: true, text: 'Cellular respiration is a biological process by which organisms convert glucose and oxygen into usable energy, specifically ATP (adenosine triphosphate). This process takes place primarily in the mitochondria, often referred to as the "powerhouse" of the cell. The byproducts of this reaction are carbon dioxide and water, which the organism expels. While plants produce their own glucose through photosynthesis, animals must obtain it by consuming other organisms. Both plants and animals, however, rely on cellular respiration to sustain their basic metabolic functions.', questions: [{ q: "What is the primary output of cellular respiration?", options: ["Carbon dioxide", "Oxygen", "Glucose", "Usable energy (ATP)"], correct: 3 }, { q: "Where does cellular respiration primarily occur?", options: ["In the mitochondria", "In the chloroplasts", "In the cell wall", "In the lungs"], correct: 0 }, { q: "How do animals obtain glucose for this process?", options: ["Through photosynthesis", "By absorbing it from the air", "By consuming other organisms", "By drinking water"], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 24: Supply and Demand', canSkip: true, text: 'In economics, the law of supply and demand dictates the price of goods and services in a free market. Supply refers to the quantity of a product that producers are willing to sell at a given price, while demand refers to the quantity that consumers are willing to buy. When demand for a product increases but supply remains unchanged, the price typically rises. Conversely, if there is a surplus of a product—meaning supply exceeds demand—prices usually fall as sellers compete to attract buyers. The point at which supply perfectly matches demand is known as market equilibrium.', questions: [{ q: "What does 'supply' refer to in a free market?", options: ["The amount of money consumers have", "The quantity of a product producers are willing to sell", "The taxes placed on a product", "The demand for cheaper goods"], correct: 1 }, { q: "What typically happens when supply exceeds demand?", options: ["Producers stop selling.", "Market equilibrium is reached instantly.", "Demand stops completely.", "Prices fall as sellers compete."], correct: 3 }, { q: "What is 'market equilibrium'?", options: ["The point where supply perfectly matches demand", "When a product's price is at its highest", "When producers refuse to sell goods", "When demand drastically exceeds supply"], correct: 0 }] },

            { type: 'academic-reading', title: 'Task 19: Academic Talk - Saturn\'s Rings', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/woaaa4t1mjn0m5jteepog/Task-19.mp3?rlkey=tycbxkt4s0zh45chm6o36wcz0&st=o79cd34c&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today, let\'s explore the rings of Saturn. Unlike the solid rings you might imagine, Saturn\'s ring system is actually made up of billions of individual pieces of ice and rock, ranging in size from tiny dust grains to giant boulders. These particles constantly orbit the planet, shaped by the gravitational pull of Saturn and its many moons. While they appear continuous from afar, they are actually divided by several large gaps, the most famous being the Cassini Division."</div>', questions: [

            { type: 'academic-reading', title: 'Task 20: Academic Talk - Animal Behavior', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/ypqi2hs3d17aspmpo0pug/Task-20.mp3?rlkey=1k39spbh6evz49dj1io5psrxl&st=zqshe2k1&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today we\'re going to explore a fascinating aspect of animal behavior: the waggle dance of the honeybee. When a foraging bee discovers a rich food source, it returns to the hive and performs a specific figure-eight movement. This \'dance\' effectively communicates the exact distance and direction of the flowers to the rest of the colony, using the sun\'s position as a reference point. It stands as one of the most complex examples of non-verbal communication in the insect world."</div>', questions: [

                { q: "What environmental feature do honeybees use as a reference point during this dance?", options: ["The direction of the wind.", "The position of the sun.", "The location of nearby rivers.", "The temperature of the ground."], correct: 1 }

            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"In our economics seminar today, we discussed the rapid advancement of automation and robotics in the manufacturing industry. Do you believe that replacing human factory workers with machines ultimately helps or harms the global economy? Explain your reasoning.\"\n\n<b>Student A (Michael):</b>\n\"I think it harms the economy. When machines replace humans, thousands of people lose their jobs, which leads to higher unemployment rates and less money being spent in local communities.\"\n\n<b>Student B (Sarah):</b>\n\"I disagree; I think it helps the economy overall. Automation makes production faster and cheaper, which lowers the cost of goods for everyone. Plus, it creates new, higher-paying jobs in tech and machine maintenance.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Michael, Sarah, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The Water Cycle', canSkip: true, text: 'The continuous movement of water on, above, and below the surface of the Earth is known as the water cycle, or the hydrologic cycle. This system is driven by solar energy and gravity. Water from oceans, lakes, and rivers evaporates into the atmosphere as water vapor. As it rises and cools, it condenses into clouds. Eventually, the condensed water falls back to the Earth\'s surface as precipitation, such as rain or snow. Some of this water flows over the ground as runoff, eventually returning to the oceans, while some infiltrates the soil to replenish groundwater supplies. This infinite cycle is vital for sustaining all life on Earth.', questions: [{ q: "What primarily drives the water cycle?", options: ["Ocean currents and wind", "Solar energy and gravity", "Geothermal heat and soil erosion", "Human intervention and industry"], correct: 1 }, { q: "What happens to water vapor as it rises and cools in the atmosphere?", options: ["It turns into groundwater.", "It evaporates instantly.", "It condenses into clouds.", "It falls as solar energy."], correct: 2 }, { q: "What is the term for water that flows over the ground to return to the oceans?", options: ["Condensation", "Infiltration", "Precipitation", "Runoff"], correct: 3 }] },
            { type: 'academic-reading', title: 'Task 23: The Invention of the Telephone', canSkip: true, text: 'The invention of the telephone in the 1870s revolutionized global communication. While several inventors contributed to the underlying technology, Alexander Graham Bell was the first to be awarded a US patent for the device in 1876. Before the telephone, the telegraph was the fastest method of long-distance communication, but it was limited to sending Morse code, requiring skilled operators. The telephone allowed for the transmission of direct, vocal conversations over long distances in real time. This breakthrough rapidly accelerated business operations, changed social dynamics, and paved the way for the highly interconnected modern world we live in today.', questions: [{ q: "Who was awarded the first US patent for the telephone?", options: ["Thomas Edison", "Nikola Tesla", "Alexander Graham অর্জন Bell", "Samuel Morse"], correct: 2 }, { q: "What was a major limitation of the telegraph compared to the telephone?", options: ["It was far more expensive to build.", "It could only transmit vocal conversations.", "It required skilled operators to send Morse code.", "It could only be used for short distances."], correct: 2 }, { q: "How did the invention of the telephone impact society?", options: ["It slowed down business operations.", "It allowed for real-time vocal conversations over long distances.", "It made the telegraph completely obsolete within a month.", "It restricted communication to trained operators only."], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 24: Plate Tectonics', canSkip: true, text: 'The theory of plate tectonics describes the large-scale motion of the Earth\'s lithosphere, which is the rigid outer shell of the planet. This shell is broken into several massive pieces known as tectonic plates. These plates constantly, albeit slowly, move over the asthenosphere, the semi-fluid layer beneath them. The interactions at the boundaries of these plates are responsible for some of the most dramatic geological events on Earth. When plates collide, they can form towering mountain ranges. When they pull apart, they create rift valleys and ocean basins. Additionally, the friction and sudden slipping of these plates along fault lines are the primary cause of earthquakes.', questions: [{ q: "What is the lithosphere?", options: ["The semi-fluid layer beneath the Earth's crust.", "The rigid outer shell of the Earth.", "A specific type of mountain range.", "The deepest ocean basin on the planet."], correct: 1 }, { q: "What happens when tectonic plates pull apart from each other?", options: ["They create rift valleys and ocean basins.", "They form towering mountain ranges.", "They instantly cause massive volcanic eruptions.", "They stop moving completely."], correct: 0 }, { q: "What is the primary cause of earthquakes according to the passage?", options: ["The rapid heating of the asthenosphere.", "The formation of new ocean basins.", "The friction and sudden slipping of tectonic plates.", "The gravitational pull of the moon."], correct: 2 }] },

            // LISTEN TO AN ACADEMIC TALK
            { type: 'academic-reading', title: 'Task 19: Academic Talk - Cave Formations', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/u4ptskve3kwhywkxmstap/Task-19.mp3?rlkey=cq9tw61exc3k2ebxhipj1k1gf&st=7yccnaos&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s discuss the formation of stalactites and stalagmites in limestone caves. These fascinating structures are created by a very slow process involving water and dissolved minerals. When rainwater seeps through the ground, it absorbs carbon dioxide, creating a weak acid that dissolves the limestone. As this mineral-rich water drips from the cave ceiling, it leaves behind tiny deposits of calcium carbonate. Over thousands of years, these deposits build up to form icicle-like stalactites hanging from above, and stalagmites rising from the floor."</div>', questions: [

            { type: 'academic-reading', title: 'Task 20: Academic Talk - Art History', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/g06ab7p4bjcwxnglokcen/Task-20.mp3?rlkey=x0e2ctjw09zfnz79hm8ar2voo&st=1zy0ebx9&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today, we\'ll look at the invention of photography in the 19th century and its impact on traditional painting. Before cameras, portrait painters were highly sought after to record a person\'s likeness. However, when the daguerreotype was introduced in 1839, it offered a much faster and more accurate representation of reality. This technological shift forced painters to adapt. Instead of focusing on strict realism, many artists began experimenting with light, emotion, and abstract forms, which eventually paved the way for the Impressionist movement."</div>', questions: [
                { q: "What was a primary role of portrait painters before the invention of the camera?", options: ["To experiment with abstract forms.", "To quickly sketch landscapes for newspapers.", "To accurately record a person's likeness.", "To mass-produce images for advertising."], correct: 2 },
                { q: "How did the introduction of photography eventually influence painters?", options: ["It pushed them to experiment with light, emotion, and abstract forms.", "It caused them to exclusively paint in black and white.", "It forced them to work much faster to compete with cameras.", "It led them to abandon portrait painting completely."], correct: 0 }
            ]},

            // ACADEMIC DISCUSSION (Writing)
            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"In our urban planning seminar, we discussed the future of city transportation. Do you think cities should invest more heavily in expanding public transit systems (like subways and buses), or should they focus on infrastructure that supports electric cars? Explain your reasoning.\"\n\n<b>Student A (David):</b>\n\"I think the focus should be on electric cars. People value their independence and privacy. If cities build more charging stations, we can reduce emissions without forcing everyone to conform to strict bus or train schedules.\"\n\n<b>Student B (Elena):</b>\n\"I disagree; public transit is the better investment. Even if cars are electric, they still cause massive traffic jams in cities. A strong subway system moves thousands of people efficiently and reduces the overall number of vehicles on the road.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with David, Elena, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The Immune System', canSkip: true, text: 'The human immune system is a highly complex network of cells, tissues, and organs that work together to defend the body against harmful pathogens like bacteria, viruses, and parasites. White blood cells, or leukocytes, are the primary defenders in this system. When a foreign substance, known as an antigen, is detected, the immune system triggers a response to neutralize it. One crucial component of this response involves B-cells, which produce specialized proteins called antibodies. These antibodies lock onto specific antigens, marking them for destruction by other immune cells. Furthermore, the immune system has a "memory" capability; once it has fought off a specific disease, it can respond much more rapidly if it encounters the same pathogen again in the future.', questions: [{ q: "What is the primary function of white blood cells?", options: ["To transport oxygen throughout the body.", "To defend the body against harmful pathogens.", "To break down food in the digestive tract.", "To transmit signals from the brain to muscles."], correct: 1 }, { q: "What do B-cells produce during an immune response?", options: ["Red blood cells", "Antigens", "Antibodies", "Pathogens"], correct: 2 }, { q: "Why does the immune system respond faster to a pathogen the second time it is encountered?", options: ["Because the pathogen becomes weaker over time.", "Because the body stops producing white blood cells.", "Because the immune system has a \"memory\" capability.", "Because the antigens destroy the original antibodies."], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 23: The Great Wall of China', canSkip: true, text: 'The Great Wall of China is not a single continuous structure, but rather a series of fortifications built across the historical northern borders of ancient Chinese states and Imperial China. Its primary purpose was to protect the Chinese Empire from incursions by various nomadic groups from the Eurasian Steppe. Construction began as early as the 7th century BCE, but the most famous sections of the wall were built by the Ming dynasty (1368–1644 CE). In addition to defense, the wall served other purposes such as border control, allowing the imposition of duties on goods transported along the Silk Road, and the regulation of trade and immigration.', questions: [{ q: "Which statement best describes the physical structure of the Great Wall?", options: ["It is a single, continuous stone wall.", "It is a series of interconnected moats and rivers.", "It is a series of separate fortifications.", "It is a wooden fence surrounding the capital city."], correct: 2 }, { q: "What was the primary military purpose of the Great Wall?", options: ["To trap nomadic groups inside the empire.", "To protect the empire from incursions by nomadic groups.", "To serve as a training ground for soldiers.", "To hide the wealth of the Ming dynasty."], correct: 1 }, { q: "Aside from defense, what was another function of the Great Wall?", options: ["To act as a massive aqueduct for farming.", "To mark the southern border of the empire.", "To allow the imposition of duties on traded goods.", "To provide a straight road for royal carriages."], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 24: The Concept of Inflation', canSkip: true, text: 'In economics, inflation is a general increase in the prices of goods and services in an economy over a specific period. When the general price level rises, each unit of currency buys fewer goods and services; consequently, inflation reflects a reduction in the purchasing power of money. A moderate level of inflation is generally considered normal and even desirable for a growing economy, as it encourages consumption and investment rather than hoarding cash. However, hyperinflation—an extremely rapid and out-of-control increase in prices—can devastate an economy, destroying the value of savings and making everyday commerce nearly impossible.', questions: [{ q: "How does inflation affect the purchasing power of money?", options: ["It increases the purchasing power.", "It reduces the purchasing power.", "It has no effect on purchasing power.", "It makes purchasing power fluctuate daily."], correct: 1 }, { q: "Why do economists generally consider a moderate level of inflation to be desirable?", options: ["It encourages people to hoard their cash.", "It makes borrowing money illegal.", "It eliminates the need for a national currency.", "It encourages consumption and investment."], correct: 3 }, { q: "What is hyperinflation?", options: ["A period where prices do not change at all.", "A deliberate lowering of prices by the government.", "An extremely rapid and out-of-control increase in prices.", "A normal economic cycle that happens every year."], correct: 2 }] },

            // LISTEN TO AN ACADEMIC TALK
            { type: 'academic-reading', title: 'Task 19: Academic Talk - Botany', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/0ibqi6ukk9k9r3sg1ibxe/Task-19.mp3?rlkey=hpw774cpu5o5q7lufzda92g5i&st=0cz4p70y&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today we\'re looking at carnivorous plants, specifically the Venus flytrap. Native to nutrient-poor soils, these plants have evolved to get their necessary minerals by trapping and digesting insects. The trap works using tiny sensory hairs on the inner surface of the leaves. When an insect touches two of these hairs within twenty seconds, the trap snaps shut in less than a second. This double-trigger mechanism is incredibly efficient, ensuring the plant doesn\'t waste energy closing on debris like falling raindrops or twigs."</div>', questions: [

                { q: "What is the specific purpose of the 'double-trigger mechanism'?", options: ["It allows the plant to catch two insects at the exact same time.", "It ensures the plant only closes at night when insects are active.", "It prevents the plant from wasting energy closing on non-food debris.", "It helps the plant digest the insects much faster."], correct: 2 }
            ]},

            { type: 'academic-reading', title: 'Task 20: Academic Talk - Archaeology', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/0mitbf0k4ogxtm4kv0xrf/Task-20.mp3?rlkey=udqhumu3em0hcfgjnaznjmamn&st=jbqw1tup&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s turn to one of the most important archaeological discoveries in history: the Rosetta Stone. Found in 1799, this massive slab of black rock contained the exact same decree written in three different scripts: Ancient Greek, Demotic, and Egyptian hieroglyphics. Because scholars already understood Ancient Greek, they were able to use the stone as a translation key. It finally cracked the code of hieroglyphics, unlocking thousands of years of ancient Egyptian history that had previously been completely unreadable to the modern world."</div>', questions: [

            ]},

            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"Governments around the world spend billions of dollars on space exploration programs. Some argue this money is essential for scientific advancement and finding new resources. Others argue that these funds should be spent solving immediate problems on Earth, such as poverty or climate change. Which viewpoint do you agree with and why?\"\n\n<b>Student A (Mark):</b>\n\"I think the money should be kept here on Earth. We have so many urgent crises—like hunger and pollution—that need funding immediately. Spending billions to send a rover to Mars feels irresponsible when people are suffering here.\"\n\n<b>Student B (Lisa):</b>\n\"I disagree. Space exploration drives incredible technological innovations that eventually benefit everyone on Earth, like satellite communication and new medical imaging devices. Plus, understanding other planets helps us understand our own climate better.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Mark, Lisa, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The Discovery of Penicillin', canSkip: true, text: 'The discovery of penicillin by Alexander Fleming in 1928 marked a turning point in modern medicine. Before its discovery, bacterial infections that are considered minor today, such as strep throat or a simple scratch, could be fatal. Fleming accidentally left a petri dish of Staphylococcus bacteria uncovered, and later noticed that a specific type of mold, Penicillium notatum, had grown and destroyed the bacteria around it. While Fleming recognized its potential, it took over a decade for scientists Howard Florey and Ernst Chain to figure out how to mass-produce the drug. During World War II, penicillin was heavily manufactured and distributed, saving countless lives by effectively treating infected wounds and paving the way for the era of antibiotics.', questions: [{ q: "What was the medical landscape like before the discovery of penicillin?", options: ["Antibiotics were widely available for most diseases.", "Minor bacterial infections could easily become fatal.", "Scientists had already cured most bacterial infections.", "Mold was commonly used to treat severe wounds."], correct: 1 }, { q: "How did Alexander Fleming initially discover penicillin?", options: ["By accidentally leaving a petri dish uncovered, allowing mold to grow.", "By traveling to isolated jungles to find new medicinal plants.", "Through a planned, decade-long government experiment.", "By mixing various synthetic chemicals in a laboratory."], correct: 0 }, { q: "What was the contribution of Howard Florey and Ernst Chain?", options: ["They discovered the mold in 1928.", "They proved that penicillin was completely ineffective.", "They figured out how to mass-produce the drug.", "They used it to invent the first vaccines."], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 23: The Concept of Black Holes', canSkip: true, text: 'A black hole is a region of spacetime where gravity is so intense that nothing—no particles or even electromagnetic radiation such as light—can escape from it. The theory of general relativity predicts that a sufficiently compact mass can deform spacetime to form a black hole. The boundary of no return is called the event horizon. Although crossing the event horizon has an enormous effect on the fate of the object crossing it, no locally detectable features appear to be observed. In many ways, a black hole acts like an ideal black body, as it reflects no light. Supermassive black holes, which contain millions or billions of times the mass of our sun, are believed to exist at the center of most large galaxies, including our own Milky Way.', questions: [{ q: "What is an 'event horizon'?", options: ["A massive star that is about to explode.", "The boundary of a black hole from which nothing can return.", "The scientific theory that predicts general relativity.", "A bright ring of light reflecting off a galaxy."], correct: 1 }, { q: "Why is a black hole compared to an 'ideal black body'?", options: ["Because it is incredibly cold.", "Because it is perfectly spherical.", "Because it reflects absolutely no light.", "Because it emits massive amounts of radiation."], correct: 2 }, { q: "Where are supermassive black holes generally believed to exist?", options: ["At the very edge of the expanding universe.", "In orbit around our solar system's sun.", "At the center of most large galaxies.", "Inside the cores of rocky planets."], correct: 2 }] },
            { type: 'academic-reading', title: 'Task 24: The Industrial Revolution', canSkip: true, text: 'The Industrial Revolution, which began in Britain in the late 18th century, was a period of profound transition from agrarian, hand-craft economies to machine-driven manufacturing. The invention of the steam engine was pivotal, as it provided a reliable source of power that did not depend on wind or flowing water. This allowed factories to be built anywhere, leading to massive urbanization as people moved from farms to cities for work. While the revolution dramatically increased the production of goods and overall wealth, it also introduced severe societal challenges, including harsh working conditions, child labor, and unprecedented levels of environmental pollution.', questions: [{ q: "What was the primary economic shift during the Industrial Revolution?", options: ["From machine-driven factories back to agrarian farming.", "From agrarian, hand-craft economies to machine-driven manufacturing.", "From a capitalist system to a barter-based economy.", "From building steam engines to relying entirely on wind power."], correct: 1 }, { q: "Why was the invention of the steam engine so pivotal?", options: ["It allowed factories to be built anywhere, independent of water or wind.", "It eliminated the need for human labor entirely.", "It immediately stopped all environmental pollution.", "It was the only machine capable of harvesting crops."], correct: 0 }, { q: "According to the passage, what was one negative consequence of the Industrial Revolution?", options: ["A decrease in overall wealth.", "Unprecedented levels of environmental pollution.", "The complete collapse of urbanization.", "A return to hand-crafted goods."], correct: 1 }] },

            { type: 'academic-reading', title: 'Task 19: Academic Talk - Marine Biology', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/m0q0za51cf025kc3y0qn6/Task-19.mp3?rlkey=92l0xpyb1luwwxp6r5vgj37v6&st=i3u9g0um&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today, let\'s discuss coral reefs. Often mistaken for rocks or plants, corals are actually colonies of tiny animals called polyps. These polyps secrete a hard calcium carbonate skeleton that builds up over centuries, creating the massive reef structures we see. Corals have a fascinating symbiotic relationship with microscopic algae called zooxanthellae. The algae live inside the coral\'s tissues, providing it with food through photosynthesis, while the coral provides the algae with a protected environment and the compounds they need to survive."</div>', questions: [

            ]},
            
            { type: 'academic-reading', title: 'Task 20: Academic Talk - Psychology', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/5w5o30zvvluxp2963m3fj/Task-20.mp3?rlkey=a9o4ldued831et7l7uj4cj9la&st=vrvzdcqp&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s examine a psychological phenomenon known as the \'bystander effect.\' This theory suggests that individuals are less likely to offer help to a victim when there are other people present. The probability of help is inversely related to the number of bystanders. Psychologists attribute this to a diffusion of responsibility; when others are around, observers subconsciously feel less personal pressure to take action, assuming that someone else in the crowd will step forward and intervene."</div>', questions: [

            ]},

            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"Today we are discussing the impact of remote work on modern cities. If a significant percentage of the workforce permanently works from home, do you think this will ultimately be beneficial or harmful for the economic health of large cities?\"\n\n<b>Student A (Chris):</b>\n\"I think it will be harmful. Large cities rely on office workers spending money at local restaurants, coffee shops, and public transit. Without those daily commuters, many local businesses will be forced to close down completely.\"\n\n<b>Student B (Amanda):</b>\n\"I think it will be beneficial in the long run. Less commuting means less traffic and pollution, making cities more livable. Plus, empty office buildings could be converted into affordable housing, solving a major urban crisis.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Chris, Amanda, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The Voyager Missions', canSkip: true, text: 'Launched in 1977, the Voyager 1 and Voyager 2 spacecraft were designed to explore the outer planets of our solar system. Taking advantage of a rare planetary alignment that occurs only once every 176 years, the twin probes successfully conducted flybys of Jupiter, Saturn, Uranus, and Neptune. They sent back unprecedented, detailed images of the planets and their respective moons, revolutionizing our understanding of planetary science. More remarkably, both probes continue to travel outward and have successfully crossed the heliopause, officially entering interstellar space. They each carry a "Golden Record," a phonograph record containing sounds and images selected to portray the diversity of life and culture on Earth to any extraterrestrial intelligence that might find them.', questions: [{ q: "What astronomical event made the Voyager missions possible?", options: ["A massive solar flare.", "A rare planetary alignment.", "The discovery of a new comet.", "The creation of the Golden Record."], correct: 1 }, { q: "What is a major ongoing achievement of the Voyager probes?", options: ["They have returned safely to Earth.", "They established a human colony on Mars.", "They have officially entered interstellar space.", "They discovered life on Jupiter's moons."], correct: 2 }, { q: "What is the purpose of the 'Golden Record' attached to the spacecraft?", options: ["To store back-up navigational software.", "To generate solar power for the communication dish.", "To record the magnetic fields of the outer planets.", "To portray the diversity of Earth to extraterrestrial life."], correct: 3 }] },
            { type: 'academic-reading', title: 'Task 23: The Discovery of Pompeii', canSkip: true, text: 'The ancient Roman city of Pompeii was completely buried under meters of volcanic ash and pumice after the catastrophic eruption of Mount Vesuvius in 79 CE. For nearly 1,700 years, the city lay forgotten until it was accidentally rediscovered in the 16th century, with proper excavations beginning in 1748. The thick layer of ash acted as a miraculous preservative, freezing the city in time. Archaeologists found intact buildings, detailed mosaics, everyday household items, and even the preserved forms of victims in their final moments. This discovery provided historians with an unparalleled, detailed glimpse into the daily life, economy, and social structure of the Roman Empire at its peak.', questions: [{ q: "What caused the destruction of Pompeii in 79 CE?", options: ["A massive earthquake.", "An invasion by a foreign army.", "The eruption of Mount Vesuvius.", "A severe flood."], correct: 2 }, { q: "Why was Pompeii so well-preserved when it was rediscovered?", options: ["The city was built entirely out of indestructible marble.", "A thick layer of volcanic ash acted as a preservative.", "The residents carefully buried their belongings before leaving.", "The city was located deep underwater."], correct: 1 }, { q: "What did the excavation of Pompeii primarily provide for historians?", options: ["A detailed glimpse into the daily life of the Roman Empire.", "The lost blueprints for the Roman Colosseum.", "A new method for predicting volcanic eruptions.", "Vast amounts of gold and silver coins."], correct: 0 }] },
            { type: 'academic-reading', title: 'Task 24: The Formation of Diamonds', canSkip: true, text: 'Diamonds, the hardest known natural material on Earth, are composed entirely of a single element: carbon. However, it is the extreme conditions under which they form that give them their unique properties. Most natural diamonds are formed at high temperatures and pressures at depths of 140 to 190 kilometers in the Earth\'s mantle. Carbon-containing minerals are subjected to immense pressure for millions, sometimes billions, of years, causing the carbon atoms to crystallize into a rigid lattice structure. These deeply buried diamonds are only brought to the Earth\'s surface through deep-source volcanic eruptions, which create unique geological formations known as kimberlite pipes.', questions: [{ q: "What single element are diamonds entirely composed of?", options: ["Nitrogen", "Oxygen", "Carbon", "Silicon"], correct: 2 }, { q: "Where do most natural diamonds form?", options: ["In shallow riverbeds.", "Deep in the Earth's mantle.", "Inside the cores of volcanoes.", "At the bottom of the ocean."], correct: 1 }, { q: "How are diamonds brought to the Earth's surface?", options: ["Through deep-source volcanic eruptions.", "By extreme earthquakes.", "Through careful human mining techniques.", "By the shifting of tectonic plates over centuries."], correct: 0 }] },

            // LISTEN TO AN ACADEMIC TALK
            { type: 'academic-reading', title: 'Task 19: Academic Talk - Meteorology', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/ramp0g1k0pajtswmda405/Task-19.mp3?rlkey=oi59na1lidkzmmqiz0oyun7a9&st=rlrftnvx&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s briefly discuss the formation of tornadoes. These violent, rotating columns of air typically form within severe thunderstorms known as supercells. When warm, moist air near the ground collides with cold, dry air higher up, it creates an unstable atmosphere. The shifting wind directions and speeds at different altitudes cause the air to spin horizontally. If a strong updraft tilts this spinning column vertically, a tornado is born, potentially causing massive destruction when it touches the ground."</div>', questions: [

            ]},
            
            { type: 'academic-reading', title: 'Task 20: Academic Talk - Linguistics', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/2xxh9mrmgypc8ji99bsti/Task-20.mp3?rlkey=pt27vm1bsv9uc3i5eylbjc0rb&st=l37f6x76&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Today we will look at the origins of the English language. Unlike Romance languages such as Spanish or French, which evolved directly from Latin, English is fundamentally a Germanic language. It was brought to Britain in the 5th century by invading tribes: the Angles, Saxons, and Jutes. However, following the Norman Conquest in 1066, a massive influx of French vocabulary was absorbed into the language. This blend of Germanic grammar and Latin-based vocabulary is what makes modern English incredibly rich but notoriously difficult to learn."</div>', questions: [

            // ACADEMIC DISCUSSION (Writing)
            { type: 'writing-email', title: 'Task 21: Write for an Academic Discussion', canSkip: true, text: "<b>Professor's Prompt:</b>\n\"Many countries are rapidly moving towards a 'cashless society,' where all purchases are made using digital payments, credit cards, or mobile apps instead of physical paper money. Do you think eliminating physical cash is a positive or negative development for society?\"\n\n<b>Student A (Robert):</b>\n\"I think it's a very positive step. Digital payments are much faster and more convenient than carrying cash. Plus, a completely cashless system makes it much harder for criminals to steal money or commit tax fraud since every transaction is tracked.\"\n\n<b>Student B (Maria):</b>\n\"I completely disagree; it's a negative development. A cashless society threatens our privacy because banks and governments can monitor everything we buy. Also, it unfairly excludes elderly people or low-income individuals who might not have access to smartphones or bank accounts.\"\n\n<b>Your Task:</b>\nWrite a response contributing your own thoughts to the discussion. You can agree with Robert, Maria, or present a completely new perspective. You have 10 minutes to write your response.", time: 600 },

            // ACADEMIC READING
            { type: 'academic-reading', title: 'Task 22: The History of the Bicycle', canSkip: true, text: 'The modern bicycle is the result of over a century of continuous engineering evolution. The earliest precursor was the "dandy horse," invented in Germany in 1817. Made almost entirely of wood, it had two wheels but lacked pedals; the rider simply pushed along the ground with their feet. It wasn\'t until the 1860s in France that pedals were successfully attached to the front wheel, creating the "velocipede," famously nicknamed the "boneshaker" due to its incredibly rough ride on cobblestone streets. The defining breakthrough came in the late 1880s with the invention of the "safety bicycle," which featured equal-sized wheels and a chain-driven rear wheel. This design finally made cycling safe, efficient, and accessible to the general public.', questions: [{ q: "How was the 'dandy horse' propelled forward?", options: ["By an early steam engine.", "By pulling a chain with the hands.", "By turning pedals on the front wheel.", "By pushing along the ground with the feet."], correct: 3 }, { q: "Why was the velocipede nicknamed the 'boneshaker'?", options: ["Because it provided an incredibly rough ride.", "Because it was built from recycled animal bones.", "Because its wheels would constantly fall off.", "Because it was designed for off-road mountain biking."], correct: 0 }, { q: "What was a key feature of the 'safety bicycle' invented in the 1880s?", options: ["A massive front wheel and a tiny rear wheel.", "A chain-driven rear wheel and equal-sized wheels.", "The complete removal of the steering mechanism.", "A wooden frame that floated on water."], correct: 1 }] },
            { type: 'academic-reading', title: 'Task 23: The Northern Lights', canSkip: true, text: 'The Aurora Borealis, commonly known as the Northern Lights, is a spectacular natural light display predominantly seen in high-latitude regions around the Arctic. This mesmerizing phenomenon occurs when highly charged particles released by solar storms travel through space and collide with gases in the Earth\'s upper atmosphere. The Earth\'s magnetic field funnels these particles toward the poles. When the solar particles strike oxygen atoms, they typically produce the common pale green and yellow auroras. Collisions with nitrogen atoms, on the other hand, produce rarer blue or purplish-red colors. The intensity of the Northern Lights fluctuates with the 11-year solar cycle, peaking during periods of maximum solar activity.', questions: [{ q: "Where are the Northern Lights predominantly seen?", options: ["In high-latitude regions around the Arctic.", "Directly over the Earth's equator.", "In the southern deserts of Africa.", "Exclusively above active volcanoes."], correct: 0 }, { q: "What happens when solar particles collide with nitrogen atoms in the atmosphere?", options: ["They create a massive thunderstorm.", "They cause global temperatures to drop.", "They produce rare blue or purplish-red colors.", "They instantly destroy the Earth's magnetic field."], correct: 2 }, { q: "What determines the changing intensity of the Northern Lights over time?", options: ["The changing phases of the moon.", "The amount of oxygen produced by forests.", "The distance between the Earth and Mars.", "The 11-year solar cycle of the sun."], correct: 3 }] },
            { type: 'academic-reading', title: 'Task 24: The Impact of the Silk Road', canSkip: true, text: 'The Silk Road was an ancient network of interconnected trade routes that officially linked the Eastern world with the West, stretching from China through India, Asia Minor, and eventually into the Mediterranean. While silk was certainly the most famous and highly prized commodity exported from China, it was far from the only thing traveling along these paths. The routes facilitated the exchange of spices, precious metals, and exotic animals. More importantly, the Silk Road served as a massive conduit for cultural exchange. Major religions like Buddhism and Islam spread rapidly along the routes, and groundbreaking technologies such as papermaking and gunpowder were introduced to Europe, forever altering the course of global history.', questions: [{ q: "According to the passage, what was the most famous commodity exported from China along these routes?", options: ["Gunpowder", "Precious metals", "Silk", "Spices"], correct: 2 }, { q: "Besides physical goods, what else spread rapidly along the Silk Road?", options: ["Dangerous prehistoric animals.", "New methods for building stone pyramids.", "Extraterrestrial scientific theories.", "Major religions and groundbreaking technologies."], correct: 3 }, { q: "What specific groundbreaking technologies are mentioned as being introduced to Europe?", options: ["Papermaking and gunpowder.", "The printing press and the telescope.", "The steam engine and the telegraph.", "Steel swords and compasses."], correct: 0 }] },

            { type: 'academic-reading', title: 'Task 19: Academic Talk - Hydroponics', canSkip: true, text: '<audio controls controlsList="nodownload" style="width: 100%; margin-bottom: 10px;"><source src="https://dl.dropboxusercontent.com/scl/fi/1urb2oaxumqdos2ggfjxa/Task-19.mp3?rlkey=t5h2nk07spj1h5r58tjbh3wqu&st=vyjdsx9j&raw=1" type="audio/mpeg"></audio><p><small><i>We suggest that you only listen to the audio files one time for a more realistic experience. Also, try not to read the script unless it is strictly necessary since you won\'t have this option on the real test.</i></small></p><button type="button" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display === \'none\' ? \'block\' : \'none\'" style="margin-top: 10px; padding: 5px 10px; cursor: pointer;">Show Script</button><div style="display: none; margin-top: 10px; padding: 10px; background: #f9f9f9; border-left: 3px solid #0056b3;">"Let\'s explore hydroponics, an innovative method of growing plants without any soil. Instead of extracting nutrients from the ground, the roots are submerged directly into a nutrient-rich water solution. This method is incredibly resource-efficient, using up to ninety percent less water than traditional farming. Because the plants do not have to expend energy searching for nutrients, they grow significantly faster. Furthermore, hydroponic systems can be set up indoors, allowing for year-round harvesting regardless of the outside weather conditions."</div>', questions: [
