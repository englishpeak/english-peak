<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Collocations Practice | ePeak</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/brand-tokens.css">
  <link rel="stylesheet" href="./collocations.css">
</head>
<body class="ep-brand-scope">
  <main class="page-shell">
    <header class="hero">
      <div><span class="eyebrow">Vocabulary practice</span><h1>Collocations</h1><p>Learn which words naturally go together.</p></div>
      <button id="new-set" class="new-set" type="button">↻ New set</button>
    </header>

    <section class="control-panel" aria-label="Practice settings">
      <fieldset><legend>Difficulty</legend><div class="segmented">
        <button class="mode-button active" data-mode="easy" aria-pressed="true">Easy <small>Match</small></button>
        <button class="mode-button" data-mode="medium" aria-pressed="false">Medium <small>Choose</small></button>
        <button class="mode-button" data-mode="hard" aria-pressed="false">Hard <small>Type</small></button>
      </div></fieldset>
      <fieldset><legend>CEFR level</legend><div class="level-options">
        <button class="level-button active" data-level="all" aria-pressed="true">All Levels</button>
        <button class="level-button" data-level="A1" aria-pressed="false">A1</button><button class="level-button" data-level="A2" aria-pressed="false">A2</button>
        <button class="level-button" data-level="B1" aria-pressed="false">B1</button><button class="level-button" data-level="B2" aria-pressed="false">B2</button><button class="level-button" data-level="C1" aria-pressed="false">C1</button>
      </div></fieldset>
      <div id="session-meta" class="session-meta"></div>
    </section>

    <section id="exercise" class="exercise-card" aria-label="Collocations exercise"></section>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <p id="live-region" class="sr-only" aria-live="assertive"></p>
  </main>
  <script type="module" src="./collocations.js"></script>
</body>
</html>
